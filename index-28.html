    --bg:#F6F5EC; --surface:#FFFFFF; --surface-2:#EDE9D8; --surface-3:#E2DCC3;

  [data-theme="fire"]{
    --bg:#1B0F0C; --surface:#2A1712; --surface-2:#34211A; --surface-3:#402A20;

    --accent:#F2461E; --accent-ink:#2A0800; --accent-soft:#4A2015;

  [data-theme="ice"]{

    --success:#1E9E5A; --success-soft:#E4F7ED; --danger:#D93B3F; --danger-soft:#FBE7E6;
    --shadow:0 10px 26px -14px rgba(20,60,90,.25);
  }
  [data-theme="earth"]{
    --bg:#F7F1E8; --surface:#FFFFFF; --surface-2:#EEE3D0; --surface-3:#E3D3B8;
    --border:#D8C4A0; --text:#2E2013; --text-muted:#7A6852;
    --accent:#A0522D; --accent-ink:#FFFFFF; --accent-soft:#EAD9C4;
    --success:#1E9E5A; --success-soft:#E4F7ED; --danger:#D93B3F; --danger-soft:#FBE7E6;

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}

  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  ::selection{background:var(--accent);color:var(--accent-ink);}

  .screen{flex:1;display:flex;flex-direction:column;animation:riseIn .32s ease both;padding-bottom:90px;}

  .brandmark .t b{font-family:var(--font-display);font-size:15px;}
  .brandmark .t span{font-size:11.5px;color:var(--text-muted);}
  .iconbtn{width:38px;height:38px;border-radius:12px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex:none;}
  .iconbtn:active{transform:scale(.94);}

  .pagehead{padding:6px 18px 14px;display:flex;align-items:center;gap:10px;}
  .pagehead h1{font-size:20px;margin:0;font-weight:800;}
  .backbtn{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none;}
  .crumb{padding:0 18px 8px;font-size:12.5px;color:var(--text-muted);display:flex;flex-wrap:wrap;gap:4px;align-items:center;}
  .crumb b{color:var(--text);font-weight:600;}

  .content{padding:0 18px;display:flex;flex-direction:column;gap:14px;}

  /* ---- cards / lists ---- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
  .listcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .listcard + .listcard{margin-top:8px;}
  .rowlist{display:flex;flex-direction:column;}
  .navrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px;transition:.15s;cursor:pointer;}
  .navrow:active{background:var(--surface-2);}
  .navrow .main{display:flex;flex-direction:column;gap:2px;}
  .navrow .main b{font-size:14.5px;}
  .navrow .main span{font-size:12px;color:var(--text-muted);}
  .navrow + .navrow{margin-top:8px;}
  .chev{color:var(--text-muted);flex:none;}

  /* index-card perforation motif */
  .examcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);}
  .examcard .perf{height:0;border-top:2px dashed var(--border);margin:0 16px;}
  .examcard .head{padding:16px 16px 12px;}
  .examcard .body{padding:12px 16px 16px;}

  /* ---- buttons ---- */
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;border:1px solid transparent;padding:13px 18px;font-size:14.5px;font-weight:700;width:100%;transition:.15s;}
  .btn:active{transform:scale(.98);}
  .btn-primary{background:var(--accent);color:var(--accent-ink);}
  .btn-outline{background:transparent;border-color:var(--border);color:var(--text);}
  .btn-ghost{background:var(--surface-2);color:var(--text);}
  .btn-danger{background:var(--danger-soft);color:var(--danger);}
  .btn-success{background:var(--success-soft);color:var(--success);}

  .btn[disabled]{opacity:.45;pointer-events:none;}

  /* ---- forms ---- */
  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
  .field label{font-size:12.5px;color:var(--text-muted);font-weight:600;}

  .field textarea{resize:vertical;min-height:70px;}
  .hint{font-size:11.5px;color:var(--text-muted);}
  .checkline{display:flex;align-items:center;gap:8px;font-size:13.5px;}

  #toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--surface-3);border:1px solid var(--border);color:var(--text);padding:11px 18px;border-radius:99px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:100;box-shadow:var(--shadow);white-space:nowrap;}

  .opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:var(--surface-2);border:1.5px solid var(--border);color:var(--text);border-radius:12px;padding:13px 14px;font-size:14px;transition:.15s;}
  .opt .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);flex:none;position:relative;}
  .opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .opt.selected .dot{border-color:var(--accent);}
  .opt.selected .dot::after{content:'';position:absolute;inset:3px;border-radius:50%;background:var(--accent);}
  .opt + .opt{margin-top:9px;}

  .reportlink{font-size:12px;color:var(--text-muted);display:flex;align-items:center;gap:4px;background:none;border:none;padding:6px 0;}
  .reportbox{background:var(--surface-2);border:1px dashed var(--border);border-radius:12px;padding:12px;margin-top:8px;}

  .ringwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0 4px;}
  .scoretext{font-family:var(--font-display);font-weight:800;}

  /* ---- login ---- */
  .loginscreen{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:32px 26px;text-align:center;gap:26px;position:relative;overflow:hidden;}
  .loginscreen::before{content:'';position:absolute;top:-120px;right:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,var(--accent-soft),transparent 70%);}
  .loginscreen::after{content:'';position:absolute;bottom:-140px;left:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,var(--surface-3),transparent 70%);}
  .bigmark{width:78px;height:78px;border-radius:22px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:32px;box-shadow:var(--shadow);position:relative;z-index:1;}

  .loginscreen p{color:var(--text-muted);font-size:13.5px;margin:0;max-width:320px;line-height:1.7;position:relative;z-index:1;}
  .googlebtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:320px;background:var(--surface);border:1.5px solid var(--border);color:var(--text);border-radius:14px;padding:15px 18px;font-size:14.5px;font-weight:700;box-shadow:var(--shadow);position:relative;z-index:1;}

  /* ---- modal ---- */
  .modaloverlay{position:fixed;inset:0;background:rgba(6,9,20,.6);display:flex;align-items:flex-end;justify-content:center;z-index:200;}

  [data-theme="green"] .modaloverlay{background:rgba(10,40,25,.35);}
  [data-theme="purple"] .modaloverlay{background:rgba(35,20,55,.35);}
  [data-theme="pink"] .modaloverlay{background:rgba(55,20,35,.35);}
  [data-theme="leaves"] .modaloverlay{background:rgba(30,35,10,.35);}
  [data-theme="fire"] .modaloverlay{background:rgba(20,8,5,.6);}
  [data-theme="ice"] .modaloverlay{background:rgba(10,40,60,.35);}
  [data-theme="earth"] .modaloverlay{background:rgba(40,25,10,.35);}

  .modalsheet{width:100%;max-width:var(--maxw);background:var(--surface);border-radius:22px 22px 0 0;padding:22px 18px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:82vh;overflow-y:auto;animation:sheetUp .25s ease both;}

  .tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .tabs::-webkit-scrollbar{display:none;}
  .tab{flex:none;padding:9px 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--border);font-size:12.5px;font-weight:700;color:var(--text-muted);white-space:nowrap;}
  .tab.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}

  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .statbox{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;}
  .statbox b{display:block;font-family:var(--font-display);font-size:22px;}
  .statbox span{font-size:11.5px;color:var(--text-muted);}

  .switch{width:44px;height:26px;border-radius:99px;background:var(--surface-3);border:1px solid var(--border);position:relative;flex:none;}
  .switch.on{background:var(--accent);}
  .switch::after{content:'';position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;}
  .switch.on::after{transform:translateX(-18px);}

  /* ---------- Aesthetic layer ---------- */
  /* Every existing .empty state (15+ places) gets this automatically:
     the leading icon() svg becomes a soft circular badge with a gentle
     pop-in, no per-call-site changes needed. */
  .empty > svg:first-child{padding:16px;border-radius:50%;background:var(--surface-2);color:var(--accent);box-sizing:content-box;animation:emptyPop .4s ease both;}
  @keyframes emptyPop{from{opacity:0;transform:scale(.7);}to{opacity:1;transform:scale(1);}}

  @keyframes shimmer{0%{background-position:-300px 0;}100%{background-position:300px 0;}}
  .skeleton{background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%);background-size:400px 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:12px;}
  .skeleton-row{height:60px;margin-bottom:10px;}
  .skeleton-line{height:14px;border-radius:7px;}

  .splashscreen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);z-index:500;}
  .splashscreen .bigmark{animation:splashPulse 1.3s ease-in-out infinite;}

  .splashscreen .splashbars{display:flex;flex-direction:column;gap:8px;width:180px;}

  .ringcircle{transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1);}

  .subjectdot{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:14px;flex:none;color:#fff;}
</style>

function migrateDB(d){
  if(!d.features) d.features = defaultFeatures();
  else FEATURE_DEFS.forEach(f=>{ if(!(f.key in d.features)) d.features[f.key] = true; });
  if(!d.ads) d.ads = [];
  if(!d.adSettings) d.adSettings = { maxViewsPerUser: 3 };
  if(!d.institutions) d.institutions = [];
  d.institutions.forEach(i=>{ if(!i.studentFeatures) i.studentFeatures = {}; if(!i.studentUsernames) i.studentUsernames = []; });
  if(!d.writers) d.writers = [];
  d.writers = d.writers.map(w => typeof w === 'string' ? {email:w, restrictToOwnDept:false} : w);
  if(!d.stats) d.stats = { quizzesCompleted:0, subjectUsage:{}, sourceUsage:{} };
  if(!d.reportedQuestions) d.reportedQuestions = {};
  if(!d.subscriptionTiers) d.subscriptionTiers = [];
  if(!d.subscriptionCodes) d.subscriptionCodes = [];
  if(!d.questionDifficulty) d.questionDifficulty = {};
  if(!d.difficultyGraders) d.difficultyGraders = [];
  if(!d.referralCodes) d.referralCodes = {};
  if(!d.referralClaims) d.referralClaims = [];
  if(!d.referralSettings) d.referralSettings = { enabled:false, referrerTierId:null, referrerDays:0, referredTierId:null, referredDays:0 };
  if(!d.duelSettings) d.duelSettings = { defaultMinutes: 20 };
  if(!d.testCountSettings) d.testCountSettings = { customCount: null };
  if(!d.subscriptionGatedKeys) d.subscriptionGatedKeys = ['flashcards','timedTest','reviewAnswers','wrongOnlyRetry','savedResults','shareResults','offlineMode','topicTest','colorThemes','specialThemes','quizDuel','leaderboard'];
  (d.universities||[]).forEach(u=>u.colleges.forEach(c=>c.departments.forEach(dp=>dp.stages.forEach(sg=>sg.subjects.forEach(s=>{
    s.questions.forEach(qq=>{
      if(qq.image===undefined) qq.image='';
      if(!qq.optionImages) qq.optionImages=[];
      if(!qq.ratings) qq.ratings={up:0,down:0};
      if(!qq.createdAt) qq.createdAt = 0;
      if(qq.reported){ d.reportedQuestions[qq.id] = qq.reported; delete qq.reported; }
    });
  })))));
}
function isReported(q){ return !!(db.reportedQuestions && db.reportedQuestions[q.id]); }
function getReport(q){ return (db.reportedQuestions && db.reportedQuestions[q.id]) || null; }

let saveDBTimer = null;
/* Mirrors the Firestore rule's onlyStudentFieldsChanged() allowlist:
   privileged users (owner/writer/institutionAdmin) always write the
   full document since the rules already grant them unrestricted
   access. Regular students only ever touch stats/reportedQuestions/
   subscriptionCodes, so they push ONLY those fields via a scoped
   update() instead of a full set(). This keeps the write's diff
   confined to the allowed keys even if the rest of the student's
   local copy is stale (e.g. after a long offline stretch), instead
   of the whole write being rejected because of unrelated drift. */
function pushDBToFirestore(){
  if(!fbAuth.currentUser) return Promise.resolve();
  const email = fbAuth.currentUser.email;
  const privileged = !!(email && roleFor(email) !== 'student');
  const ref = dbFS.collection('platform').doc('main');
  return privileged
    ? ref.set(db)
    : ref.update({ stats: db.stats, reportedQuestions: db.reportedQuestions, subscriptionCodes: db.subscriptionCodes, questionDifficulty: db.questionDifficulty, referralCodes: db.referralCodes, referralClaims: db.referralClaims });
}
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }catch(err){
    console.error('localStorage save failed', err);
    toast('التخزين المحلي بالجهاز ممتلئ — يتم الاعتماد على الحفظ السحابي فقط الآن');
  }
  if(!fbAuth.currentUser) return;
  clearTimeout(saveDBTimer);
  saveDBTimer = setTimeout(function(){
    pushDBToFirestore().catch(function(err){
      console.error('Firestore save failed', err);
      toast('تعذّر الحفظ السحابي — تحقق من الاتصال بالإنترنت');
    });
  }, 400);
}

let saveSessionTimer = null;
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }catch(err){
    console.error('localStorage session save failed', err);
  }
  if(!fbAuth.currentUser || !session.currentEmail) return;
  const email = session.currentEmail;
  const profile = session.profiles[email];

    });
  }, 400);
}
function themeAllowed(name){
  const def = THEME_DEFS.find(t=>t.key===name);
  if(!def) return false;
  return def.feature===null ? true : hasFeature(def.feature);
}
function loadTheme(){
  const stored = localStorage.getItem(THEME_KEY) || 'dark';
  return themeAllowed(stored) ? stored : 'dark';
}

function currentUser(){ return session.currentEmail ? session.profiles[session.currentEmail] : null; }
function roleFor(email){
  if(email===OWNER_EMAIL) return 'owner';
  if(db.institutions.some(i=>i.adminEmail===email)) return 'institutionAdmin';
  if(db.writers.some(w=>w.email===email)) return 'writer';
  return 'student';
}
function writerRecord(email){ return db.writers.find(w=>w.email===email) || null; }
function refreshSubscription(user){
  if(!user) return;
  const now = Date.now();
  if(user.scheduledSubscription && (!user.subscription || user.subscription.expiresAt<=now)){
    const sch = user.scheduledSubscription;
    user.subscription = { tierId: sch.tierId, activatedAt: now, expiresAt: now + sch.durationDays*86400000 };
    user.scheduledSubscription = null;
    saveSession();
  }
}
function activeTierOf(user){
  if(!user || !user.subscription) return null;
  if(user.subscription.expiresAt<=Date.now()) return null;
  return db.subscriptionTiers.find(t=>t.id===user.subscription.tierId) || null;
}
function hasFeature(key){
  const u = currentUser();
  if(u && (u.role==='owner' || u.role==='writer' || u.role==='institutionAdmin')) return true;
  if(u && u.institutionId){
    const inst = db.institutions.find(i=>i.id===u.institutionId);
    if(inst && inst.studentFeatures && Object.prototype.hasOwnProperty.call(inst.studentFeatures, key)) return !!inst.studentFeatures[key];
    return !!(db.features && db.features[key]);
  }
  if(!(db.features && db.features[key])) return false;
  if(u && (db.subscriptionGatedKeys||[]).includes(key)){
    const tier = activeTierOf(u);
    return !!(tier && tier.features && tier.features[key]);
  }
  return true;
}
const DIFFICULTY_LABELS = {easy:'سهل', medium:'متوسط', hard:'صعب'};
function canRateDifficulty(user){
  if(!user) return false;
  if(user.role==='owner') return true;
  if(!hasFeature('difficultyRating')) return false;
  const g = (db.difficultyGraders||[]).find(x=>x.email===user.email);
  return !!(g && g.expiresAt > Date.now());
}
function getQuestionDifficulty(qId){ return (db.questionDifficulty||{})[qId] || null; }
function setQuestionDifficulty(qid, level){
  if(!canRateDifficulty(currentUser())){ toast('لا تملك صلاحية تحديد الصعوبة'); return; }
  if(!db.questionDifficulty) db.questionDifficulty = {};
  if(getQuestionDifficulty(qid)===level) delete db.questionDifficulty[qid];
  else db.questionDifficulty[qid] = level;
  saveDB(); render();
}

/* ---------- Undo/Redo (owner only, snapshot-based, in-memory for this session) ---------- */
let undoStack = [];
let redoStack = [];
function pushUndo(){ undoStack.push(JSON.stringify(db)); if(undoStack.length>10) undoStack.shift(); redoStack = []; }
function undoLast(){
  if(!undoStack.length){ toast('لا يوجد ما يمكن التراجع عنه'); return; }
  redoStack.push(JSON.stringify(db)); if(redoStack.length>10) redoStack.shift();
  db = JSON.parse(undoStack.pop());
  saveDB(); toast('تم التراجع عن آخر إجراء'); render();
}
function redoLast(){
  if(!redoStack.length){ toast('لا يوجد ما يمكن إعادته'); return; }
  undoStack.push(JSON.stringify(db)); if(undoStack.length>10) undoStack.shift();
  db = JSON.parse(redoStack.pop());
  saveDB(); toast('تمت إعادة الإجراء'); render();
}

/* ---------- Aesthetic helpers: subject colors, result ring, confetti ---------- */
function subjectAccentColor(name){
  const str = name || '';
  let hash = 0;
  for(let i=0;i<str.length;i++){ hash = str.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return 'hsl('+hue+',58%,46%)';
}
function subjectDot(name){
  const letter = (name||'؟').trim().charAt(0).toUpperCase();
  return '<div class="subjectdot" style="background:'+subjectAccentColor(name)+';">'+esc(letter)+'</div>';
}
function skeletonRows(n){
  let rows = '';
  for(let i=0;i<n;i++) rows += '<div class="skeleton skeleton-row"></div>';
  return '<div>'+rows+'</div>';
}
function resultMessage(pct){
  if(pct>=90) return 'أداء استثنائي! 🌟';
  if(pct>=70) return 'أداء جيد جدًا، استمر 👏';
  if(pct>=50) return 'لا بأس، راجع نقاط ضعفك وحاول مجددًا 💪';
  return 'لا تستسلم، كل محاولة خطوة للأمام 🔄';
}
function startResultRingAnimation(){
  const el = document.getElementById('resultRingFill');
  if(!el) return;
  const target = el.getAttribute('data-target-offset');
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ el.style.strokeDashoffset = target; });
  });
  if(quizState && quizState.result && quizState.result.pct>=90 && !quizState.result._celebrated){
    quizState.result._celebrated = true;
    launchConfetti();
  }
}
function launchConfetti(){
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const old = document.getElementById('confettiCanvas'); if(old) old.remove();
  const canvas = document.createElement('canvas');
  canvas.id = 'confettiCanvas';
  canvas.style.position = 'fixed'; canvas.style.inset = '0'; canvas.style.pointerEvents = 'none'; canvas.style.zIndex = '400';
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const colors = ['#F2B84B','#34C77B','#E5584D','#4EA1F2','#C77BE5'];
  const pieces = [];
  for(let i=0;i<90;i++){
    pieces.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.5,
      w: 6+Math.random()*6, h: 8+Math.random()*8,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*360, vRot: -6+Math.random()*12,
      vy: 2+Math.random()*3, vx: -1.5+Math.random()*3,
      opacity: 1
    });
  }
  let frame = 0;
  const maxFrames = 200;
  function step(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    pieces.forEach(function(p){
      p.x += p.vx; p.y += p.vy; p.rot += p.vRot;
      if(frame>120) p.opacity = Math.max(0, p.opacity - 0.02);
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
      ctx.restore();
    });
    if(frame<maxFrames){ requestAnimationFrame(step); }
    else { canvas.remove(); }
  }
  requestAnimationFrame(step);
}

/* ---------- Router ---------- */
function parseHash(){
  const raw = location.hash.slice(1) || '/login';
  const [route, qs] = raw.split('?');
  const params = {}; if(qs) qs.split('&').forEach(p=>{ const [k,v]=p.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v||''); });
  return { route: route || '/login', params };
}
function go(route, params){
  const qs = params ? Object.keys(params).filter(k=>params[k]!==undefined && params[k]!==null && params[k]!=='').map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&') : '';
  location.hash = '#' + route + (qs ? '?' + qs : '');
}
function navTo(href){ location.hash = href; }
window.addEventListener('hashchange', render);

function render(){
  applyTheme();
  const { route, params } = parseHash();
  const user = currentUser();
  if(user) user.role = roleFor(user.email);
  if(user) ensureReferralFields(user);
  if(user && !user.institutionId && user.role==='student') refreshSubscription(user);
  if(user) processMyReferralRewards(user);

  if(user && !isOnline && !hasFeature('offlineMode')){
    document.getElementById('app').innerHTML = renderOfflineBlock();
    return;
  }

  if(route === '/activate' && params.code && !user){ localStorage.setItem(PENDING_CODE_KEY, params.code); }

  if(!user && route !== '/login' && route !== '/activate'){ go('/login'); return; }
  if(user && !user.profileComplete && route !== '/profile'){ go('/profile'); return; }
  if(user && user.profileComplete && route === '/login'){ go('/home'); return; }

  const pendingCode = localStorage.getItem(PENDING_CODE_KEY);
  if(pendingCode && user && user.profileComplete && !user.institutionId && route !== '/activate'){
    localStorage.removeItem(PENDING_CODE_KEY);
    go('/activate', {code: pendingCode});
    return;
  }

  let html = '';
  let bare = false;
  if(route === '/login'){ html = renderLogin(); bare = true; }
  else if(route === '/profile'){ html = renderProfileForm(user); bare = true; }
  else if(route === '/home'){ html = renderHome(user); }
  else if(route === '/browse'){ html = renderBrowse(user, params, false); }
  else if(route === '/admin'){ html = renderAdmin(user, params); }
  else if(route === '/admin-user'){ html = renderAdminUserDetail(user, params); }
  else if(route === '/admin-structure'){ html = renderBrowse(user, params, true); }
  else if(route === '/quiz'){ html = renderQuiz(user, params); }
  else if(route === '/result'){ html = renderResult(user, params); }
  else if(route === '/review'){ html = renderReview(user, params); }
  else if(route === '/favorites'){ html = renderFavorites(user, params); }
  else if(route === '/history'){ html = renderHistory(user, params); }
  else if(route === '/flashcards'){ html = renderFlashcards(user, params); }
  else if(route === '/institution'){ html = renderInstitution(user, params); }
  else if(route === '/activate'){ html = renderActivate(user, params); bare = !user; }
  else if(route === '/settings'){ html = renderSettings(user); }
  else if(route === '/duels'){ html = renderDuels(user, params); }
  else if(route === '/leaderboard'){ html = renderLeaderboard(user, params); }
  else { html = renderHome(user); }

  const app = document.getElementById('app');
  app.innerHTML = bare ? html : layout(html, route, user);
  if(route==='/home') showAdIfEligible();
  if(route==='/quiz') startQuizTimer();
  if(route==='/result') startResultRingAnimation();
}

  }

function institutionBrandFor(user){

function inkForColor(hex){
  const c = (hex||'').replace('#','');
  if(c.length!==6) return '#FFFFFF';
  const r=parseInt(c.slice(0,2),16), g=parseInt(c.slice(2,4),16), b=parseInt(c.slice(4,6),16);
  const luma = (0.299*r+0.587*g+0.114*b)/255;
  return luma>0.6 ? '#1A1A1A' : '#FFFFFF';
}

}

function generateReferralCode(){

function ensureReferralFields(user){
  if(!user) return;
  if(!user.createdAt) user.createdAt = Date.now() - 25*3600*1000;
  if(!user.referralCode){
    user.referralCode = generateUniqueReferralCode();
    if(!db.referralCodes) db.referralCodes = {};
    db.referralCodes[user.referralCode] = user.email;
    saveDB();
  } else if(!db.referralCodes || db.referralCodes[user.referralCode]!==user.email){
    if(!db.referralCodes) db.referralCodes = {};
    db.referralCodes[user.referralCode] = user.email;
    saveDB();

function applyReferralReward(user, tierId, days){
  if(!tierId || !days) return;
  if(user.subscription && user.subscription.expiresAt > Date.now()){
    user.scheduledSubscription = { tierId, durationDays: days };
  } else {
    user.subscription = { tierId, activatedAt: Date.now(), expiresAt: Date.now() + days*86400000 };
  }
}
function processMyReferralRewards(user){
  if(!user || !db.referralClaims || !db.referralClaims.length) return;
  const settings = db.referralSettings || {};
  let changed = false;
  db.referralClaims.forEach(function(claim){
    if(claim.referrerEmail===user.email && !claim.referrerRewarded){
      applyReferralReward(user, settings.referrerTierId, settings.referrerDays);
      claim.referrerRewarded = true;
      changed = true;
    }
  });
  if(changed){ saveDB(); saveSession(); toast('حصلت على مكافأة إحالة صديق 🎉'); }

  const university = p.uid ? db.universities.find(u=>u.id===p.uid) : null;

  const subject = (stage && p.subid) ? stage.subjects.find(s=>s.id===p.subid) : null;
  return { university, college, department, stage, subject };
}

/* ---------- Bulk structure import (indentation-based text) ---------- */
function parseStructureText(text){
  const lines = text.replace(/\t/g,'    ').split('\n').filter(l=>l.trim().length>0);
  const roots = [];
  const stack = [];
  lines.forEach(line=>{
    const indent = line.match(/^\s*/)[0].length;
    const name = line.trim();
    while(stack.length && stack[stack.length-1].indent >= indent) stack.pop();
    const level = stack.length;
    let node;
    if(level===0){ node = {id:uid(), name, departments:[]}; roots.push(node); }
    else if(level===1){ node = {id:uid(), name, stages:[]}; stack[stack.length-1].node.departments.push(node); }
    else if(level===2){ node = {id:uid(), name, subjects:[]}; stack[stack.length-1].node.stages.push(node); }
    else if(level===3){ node = {id:uid(), name, sources:[], questions:[]}; stack[stack.length-1].node.subjects.push(node); }
    else { return; }
    stack.push({indent, level, node});
  });
  return roots;
}

/* ---------- Cross-university structure propagation ----------
   When a department/stage/subject is added under a college (or
   department, or stage) that shares its name with the SAME-LEVEL
   node in other universities, the new node is added there too —
   so the academic tree stays consistent everywhere that already
   has the matching parent, the same way question banks already
   sync by name. Matching is purely by trimmed name; a parent that
   already has a same-named child is left untouched (no duplicate).
   Returns how many other places it was added to. */
function matchingParentContainers(level, names){
  const containers = [];
  db.universities.forEach(u=>{
    u.colleges.forEach(c=>{
      if(c.name.trim()!==names.collegeName.trim()) return;
      if(level==='department'){ containers.push(c); return; }
      c.departments.forEach(d=>{
        if(d.name.trim()!==names.departmentName.trim()) return;
        if(level==='stage'){ containers.push(d); return; }
        d.stages.forEach(sg=>{
          if(sg.name.trim()!==names.stageName.trim()) return;
          if(level==='subject') containers.push(sg);
        });
      });
    });
  });
  return containers;
}
function propagateNodeAcrossUniversities(level, nodeName, names){
  const containers = matchingParentContainers(level, names);
  let count = 0;
  containers.forEach(container=>{
    const childList = level==='department' ? container.departments : level==='stage' ? container.stages : container.subjects;
    if(childList.some(x=>x.name.trim()===nodeName.trim())) return; /* already present here (includes the node we just added) */
    let clone;
    if(level==='department') clone = { id: uid(), name: nodeName, stages: [] };
    else if(level==='stage') clone = { id: uid(), name: nodeName, subjects: [] };
    else clone = { id: uid(), name: nodeName, sources: [], questions: [] };
    childList.push(clone);
    if(level==='subject') pullBankInto(clone.id);
    count++;
  });
  return count;
}
function renameNodeAcrossUniversities(level, oldName, newName, names, excludeId){
  const containers = matchingParentContainers(level, names);
  let count = 0;
  containers.forEach(container=>{
    const childList = level==='department' ? container.departments : level==='stage' ? container.stages : container.subjects;
    childList.forEach(x=>{
      if(x.id===excludeId) return;
      if(x.name.trim()===oldName.trim()){ x.name = newName; count++; }
    });
  });
  return count;
}
function promptRenameNode(level, id, parentParams){
  const { university, college, department, stage } = pathObjs(parentParams);
  let list;
  if(level==='university') list = db.universities;
  else if(level==='college') list = university.colleges;
  else if(level==='department') list = college.departments;
  else if(level==='stage') list = department.stages;
  else if(level==='subject') list = stage.subjects;
  const node = list.find(x=>x.id===id);
  if(!node) return;
  const newName = prompt('الاسم الجديد:', node.name);
  if(newName===null) return;
  const trimmed = newName.trim();
  if(!trimmed || trimmed===node.name.trim()) return;
  const oldName = node.name;

  let names = null;
  if(level==='department') names = {collegeName: college.name};
  else if(level==='stage') names = {collegeName: college.name, departmentName: department.name};
  else if(level==='subject') names = {collegeName: college.name, departmentName: department.name, stageName: stage.name};

  let matchCount = 0;
  if(names){
    matchCount = matchingParentContainers(level, names).reduce(function(sum,c){
      const childList = level==='department'?c.departments:level==='stage'?c.stages:c.subjects;
      return sum + childList.filter(function(x){ return x.id!==node.id && x.name.trim()===oldName.trim(); }).length;
    }, 0);
  }

  let alsoSync = false;
  if(matchCount>0){
    alsoSync = confirm('يوجد '+matchCount+' مكان آخر بجامعات أخرى بنفس الاسم "'+oldName+'". اضغط "موافق" لإعادة تسميته هناك أيضًا (يحافظ على مشاركة بنك الأسئلة)، أو "إلغاء" لتغييره بهذه الجامعة فقط.');
  }

  pushUndo();
  node.name = trimmed;
  let extraCount = 0;
  if(alsoSync && names) extraCount = renameNodeAcrossUniversities(level, oldName, trimmed, names, node.id);

  saveDB();
  toast(extraCount>0 ? ('تمت إعادة التسمية هنا و'+extraCount+' مكان آخر') : 'تمت إعادة التسمية');
  render();
}
function promptAddNode(level, parentParams){
  const name = prompt('اسم ال'+LEVEL_LABEL[level]+' الجديد:');
  if(!name || !name.trim()) return;
  const { university, college, department, stage } = pathObjs(parentParams);
  let type = '';
  if(level==='university'){ type = confirm('اضغط "موافق" لجامعة حكومية، أو "إلغاء" لجامعة أهلية') ? 'حكومية' : 'أهلية'; }

  let node, wasClone = false;
  if(level==='college'){
    const match = findCollegeByName(name.trim(), university.id);
    if(match && confirm('توجد كلية بنفس الاسم "'+name.trim()+'" بجامعة أخرى وفيها هيكل كامل (أقسام، مراحل، مواد). هل تريد إضافة نفس هذا الهيكل لهذه الجامعة أيضًا؟ موادها ستشترك تلقائيًا بنفس بنك الأسئلة (لأن أي مادة بنفس اسم الكلية/القسم/المرحلة/المادة تُعتبر بنكًا موحدًا).')){
      node = cloneCollegeStructure(match, name.trim());
      wasClone = true;
    } else {
      node = { id: uid(), name: name.trim(), departments:[] };
    }
  } else {
    node = level==='subject' ? { id: uid(), name: name.trim(), sources:[], questions:[] }
      : level==='stage' ? { id: uid(), name: name.trim(), subjects:[] }
      : level==='department' ? { id: uid(), name: name.trim(), stages:[] }
      : { id: uid(), name: name.trim(), type, colleges:[] };
  }

  if(level==='university') db.universities.push(node);
  else if(level==='college') university.colleges.push(node);
  else if(level==='department') college.departments.push(node);
  else if(level==='stage') department.stages.push(node);
  else if(level==='subject') stage.subjects.push(node);

  if(level==='subject') pullBankInto(node.id);
  if(level==='college' && wasClone){
    node.departments.forEach(d=>d.stages.forEach(s=>s.subjects.forEach(sub=>pullBankInto(sub.id))));
  }

  let syncedCount = 0;
  if(level==='department'){
    syncedCount = propagateNodeAcrossUniversities('department', node.name, {collegeName: college.name});
  } else if(level==='stage'){
    syncedCount = propagateNodeAcrossUniversities('stage', node.name, {collegeName: college.name, departmentName: department.name});
  } else if(level==='subject'){
    syncedCount = propagateNodeAcrossUniversities('subject', node.name, {collegeName: college.name, departmentName: department.name, stageName: stage.name});
  }

  pushUndo();
  saveDB();
  toast(wasClone ? 'تمت الإضافة مع مشاركة بنك الأسئلة' : (syncedCount>0 ? ('تمت الإضافة، وتمت إضافتها تلقائيًا في '+syncedCount+' مكان مطابق بجامعات أخرى') : 'تمت الإضافة'));
  render();
}
function deleteNodeAcrossUniversities(level, nodeName, names){
  const containers = matchingParentContainers(level, names);
  let count = 0;
  containers.forEach(container=>{
    const childList = level==='department' ? container.departments : level==='stage' ? container.stages : container.subjects;
    const before = childList.length;
    const filtered = childList.filter(x=>x.name.trim()!==nodeName.trim());
    if(filtered.length!==before){
      if(level==='department') container.departments = filtered;
      else if(level==='stage') container.stages = filtered;
      else container.subjects = filtered;
      count++;
    }
  });
  return count;
}
function deleteNode(level, id, parentParams){
  const { university, college, department, stage } = pathObjs(parentParams);
  let nodeName = null, names = null;
  if(level==='department'){ nodeName = (college.departments.find(x=>x.id===id)||{}).name; names = {collegeName: college.name}; }
  else if(level==='stage'){ nodeName = (department.stages.find(x=>x.id===id)||{}).name; names = {collegeName: college.name, departmentName: department.name}; }
  else if(level==='subject'){ nodeName = (stage.subjects.find(x=>x.id===id)||{}).name; names = {collegeName: college.name, departmentName: department.name, stageName: stage.name}; }

  let matchCount = 0;
  if(nodeName && names){
    matchCount = matchingParentContainers(level, names).filter(function(c){
      const childList = level==='department'?c.departments:level==='stage'?c.stages:c.subjects;
      return childList.some(function(x){ return x.name.trim()===nodeName.trim(); });
    }).length - 1; /* exclude this node's own container */
  }

  if(!confirm('حذف هذا العنصر نهائيًا؟ سيتم حذف كل ما بداخله.')) return;

  let alsoSync = false;
  if(matchCount>0){
    alsoSync = confirm('يوجد '+matchCount+' مكان آخر بجامعات أخرى بنفس الاسم والمسار. اضغط "موافق" لحذفه من هناك أيضًا، أو "إلغاء" لحذفه من هذه الجامعة فقط.');
  }

  pushUndo();
  if(level==='university') db.universities = db.universities.filter(x=>x.id!==id);
  else if(level==='college') university.colleges = university.colleges.filter(x=>x.id!==id);
  else if(level==='department') college.departments = college.departments.filter(x=>x.id!==id);
  else if(level==='stage') department.stages = department.stages.filter(x=>x.id!==id);
  else if(level==='subject') stage.subjects = stage.subjects.filter(x=>x.id!==id);

  let extraCount = 0;
  if(alsoSync && nodeName && names) extraCount = deleteNodeAcrossUniversities(level, nodeName, names);

  saveDB();
  toast(extraCount>0 ? ('تم الحذف من هذه الجامعة و'+extraCount+' مكان آخر') : 'تم الحذف');
  render();
}

/* ---------- Unified cross-university question bank ----------
   Subjects that share the exact same names (college → department →
   stage → subject) across different universities are treated as the
   same bank: adding/editing/deleting a question in one propagates to
   all the others. Matching is purely by name, so this also applies
   retroactively to subjects that happen to share the same structure
   without ever having been cloned. Reports and per-question ratings
   stay local to each instance on purpose — those reflect that
   university's own review process, not shared content. */
function bankKeyOf(collegeName, deptName, stageName, subjectName){
  return [collegeName, deptName, stageName, subjectName].map(s=>(s||'').trim()).join('␟');
}
function findSubjectPath(subjectId){
  for(const u of db.universities) for(const c of u.colleges) for(const d of c.departments) for(const sg of d.stages){
    const s = sg.subjects.find(x=>x.id===subjectId);
    if(s) return {university:u, college:c, department:d, stage:sg, subject:s};
  }
  return null;
}
function siblingSubjectPaths(subjectId){
  const origin = findSubjectPath(subjectId);
  if(!origin) return [];
  const key = bankKeyOf(origin.college.name, origin.department.name, origin.stage.name, origin.subject.name);
  const out = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(sg=>sg.subjects.forEach(s=>{
    if(s.id===subjectId) return;
    if(bankKeyOf(c.name,d.name,sg.name,s.name)===key) out.push({university:u, college:c, department:d, stage:sg, subject:s});
  })))));
  return out;
}
function subjectHasSiblings(subjectId){ return siblingSubjectPaths(subjectId).length>0; }
function resolveSourceForSibling(originSource, siblingSubject){
  if(!originSource) return null;
  let match = siblingSubject.sources.find(sr=>sr.name.trim()===originSource.name.trim());
  if(!match){ match = {id:uid(), name:originSource.name}; siblingSubject.sources.push(match); }
  return match.id;
}
/* For a freshly-created (usually empty) subject: pull in whatever an
   existing sibling already has, purely additive — never deletes
   anything from the donor. Used right after creating a new subject
   node so it joins an existing bank instead of starting empty. */
function pullBankInto(subjectId){
  const siblings = siblingSubjectPaths(subjectId);
  const donor = siblings.find(s => s.subject.questions.length>0);
  if(!donor) return;
  const target = findSubjectPath(subjectId);
  if(!target) return;
  donor.subject.questions.forEach(dq=>{
    if(!dq.syncGroupId) dq.syncGroupId = uid();
    const donorSource = dq.sourceId ? donor.subject.sources.find(sr=>sr.id===dq.sourceId) : null;
    const sourceId = resolveSourceForSibling(donorSource, target.subject);
    target.subject.questions.push({
      id: uid(), syncGroupId: dq.syncGroupId, text: dq.text, options: dq.options.slice(),
      correctIndex: dq.correctIndex, notes: dq.notes, topic: dq.topic, sourceId,
      isPreviousYear: dq.isPreviousYear, year: dq.year, round: dq.round,
      showAuthor: dq.showAuthor, authorName: dq.authorName,
      image: dq.image, optionImages: (dq.optionImages||[]).slice(), ratings:{up:0,down:0}, createdAt: dq.createdAt
    });
  });
}
/* For an EXISTING subject that was just edited (add/edit/delete a
   question): pushes its current state out to siblings and deletes
   any sibling copy whose linked question no longer exists here.
   Only call this on the subject that was actually just mutated. */
function syncBank(subjectId){
  const origin = findSubjectPath(subjectId);
  if(!origin) return;
  const siblings = siblingSubjectPaths(subjectId);
  if(!siblings.length) return;
  origin.subject.questions.forEach(q=>{ if(!q.syncGroupId) q.syncGroupId = uid(); });

  siblings.forEach(sib=>{
    origin.subject.questions.forEach(oq=>{
      const match = sib.subject.questions.find(sq=>sq.syncGroupId===oq.syncGroupId);
      const originSource = oq.sourceId ? origin.subject.sources.find(sr=>sr.id===oq.sourceId) : null;
      const sourceId = resolveSourceForSibling(originSource, sib.subject);
      if(!match){
        sib.subject.questions.push({
          id: uid(), syncGroupId: oq.syncGroupId, text: oq.text, options: oq.options.slice(),
          correctIndex: oq.correctIndex, notes: oq.notes, topic: oq.topic, sourceId,
          isPreviousYear: oq.isPreviousYear, year: oq.year, round: oq.round,
          showAuthor: oq.showAuthor, authorName: oq.authorName,
          image: oq.image, optionImages: (oq.optionImages||[]).slice(), ratings:{up:0,down:0}, createdAt: oq.createdAt
        });
      } else {
        Object.assign(match, {
          text: oq.text, options: oq.options.slice(), correctIndex: oq.correctIndex,
          notes: oq.notes, topic: oq.topic, sourceId,
          isPreviousYear: oq.isPreviousYear, year: oq.year, round: oq.round,
          showAuthor: oq.showAuthor, authorName: oq.authorName,
          image: oq.image, optionImages: (oq.optionImages||[]).slice()
        });
      }
    });
    const originGroupIds = new Set(origin.subject.questions.map(q=>q.syncGroupId));
    sib.subject.questions = sib.subject.questions.filter(sq => !sq.syncGroupId || originGroupIds.has(sq.syncGroupId));
  });
}

function deleteQuestion(subjectId, questionId){
  const siblingCount = siblingSubjectPaths(subjectId).length;
  const warn = siblingCount>0 ? ' هذه المادة مشتركة مع '+siblingCount+' كلية/جامعة أخرى بنفس الهيكل — سيُحذف من هناك أيضًا.' : '';
  if(!confirm('حذف هذا السؤال؟'+warn)) return;
  pushUndo();
  const subject = findSubject(subjectId);
  subject.questions = subject.questions.filter(q=>q.id!==questionId);
  removeReportFlag({id:questionId});
  syncBank(subjectId);
  saveDB(); toast('تم حذف السؤال'); render();
}

/* ---------- Question editor modal ---------- */
let qImgState = { question:'', options:{} };
function openQuestionEditor(subjectId, questionId){
  const subject = findSubject(subjectId);

function compressImage(file, callback){
  if(file.size > 20000000){ toast('الملف كبير جدًا حتى للمعالجة — اختر صورة أصغر'); callback(null); return; }
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function(){ toast('تعذّرت معالجة الصورة'); callback(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ toast('تعذّر قراءة الصورة'); callback(null); };
  reader.readAsDataURL(file);
}
function handleImageUpload(e, target){
  const file = e.target.files[0];

    const el = document.getElementById('imgPreview_'+target);

}

/* Removes one specific option row (used to clean up unwanted/mis-imported
   options, e.g. a stray "Answer: d" line that got saved as an extra
   option instead of being recognized as the answer key). Re-numbers
   the remaining rows and shifts their images/correct-answer mark
   accordingly. Always keeps at least 2 options. */
function removeOptionRow(idx){
  const wrap = document.getElementById('optionsWrap');
  const rows = Array.from(wrap.querySelectorAll('input[type="text"]'));
  if(rows.length<=2){ toast('يجب أن يبقى اختياران على الأقل'); return; }
  const currentValues = rows.map(function(inp){ return inp.value; });
  const checkedEl = wrap.querySelector('input[name="correctIndex"]:checked');
  let checkedIndex = checkedEl ? parseInt(checkedEl.value) : -1;
  currentValues.splice(idx,1);
  if(checkedIndex===idx) checkedIndex = -1;
  else if(checkedIndex>idx) checkedIndex--;
  const newImgs = {};
  Object.keys(qImgState.options).forEach(function(k){
    const ki = parseInt(k);
    if(ki===idx) return;
    newImgs[ki>idx ? ki-1 : ki] = qImgState.options[k];
  });
  qImgState.options = newImgs;
  const newCount = currentValues.length;
  const countSelect = document.getElementById('optCount');
  if(countSelect && newCount<=6) countSelect.value = String(newCount);
  wrap.innerHTML = optionInputsHtml(newCount, { options: currentValues, correctIndex: checkedIndex });

let quizTimerHandle = null;
function startTest(subjectId, mode, extra){
  if(!hasFeature('tests')){ toast('الاختبارات متوقفة مؤقتًا من قبل الإدارة'); return; }
  const subject = findSubject(subjectId);
  let pool = subject.questions.filter(q=>!isReported(q) && q.correctIndex>=0);
  if(mode==='all'){ /* keep all */ }
  else if(mode==='allSources'){ pool = pool.filter(q=>!q.isPreviousYear && q.sourceId); }
  else if(mode==='source'){ pool = pool.filter(q=>q.sourceId===extra.sourceId); }
  else if(mode==='year'){ pool = pool.filter(q=>q.isPreviousYear && q.year===extra.year); }
  else if(mode==='round'){ pool = pool.filter(q=>q.isPreviousYear && q.year===extra.year && q.round===decodeURIComponent(extra.round)); }
  else if(mode==='single'){ pool = pool.filter(q=>q.id===extra.questionId); }
  else if(mode==='topics'){ pool = pool.filter(q=>extra.topics && extra.topics.includes((q.topic||'').trim())); }
  else if(mode==='difficulty'){ pool = pool.filter(q=>extra.levels && extra.levels.includes(getQuestionDifficulty(q.id))); }
  else if(mode==='duel'){ const ids = extra.questionIds||[]; pool = ids.map(id=>pool.find(q=>q.id===id)).filter(Boolean); }

  // de-duplicate by normalized text+options
  const seen = new Set(); const deduped = [];
  pool.forEach(q=>{
    const key = (q.text.trim()+'|'+q.options.join('|')).replace(/\s+/g,' ').toLowerCase();
    if(!seen.has(key)){ seen.add(key); deduped.push(q); }
  });

  if(deduped.length===0){ toast('لا توجد أسئلة متاحة لهذا الاختيار'); return; }

  let finalPool = deduped;
  if((mode==='all'||mode==='allSources') && hasFeature('questionCountControl') && selectedQuestionCountMode!=='all'){
    const cap = parseInt(selectedQuestionCountMode,10);
    if(cap && finalPool.length>cap){ finalPool = shuffle(finalPool.slice()).slice(0,cap); }
  }

  db.stats.subjectUsage[subjectId] = (db.stats.subjectUsage[subjectId]||0)+1;
  if(mode==='source' && extra && extra.sourceId){
    if(!db.stats.sourceUsage) db.stats.sourceUsage = {};
    db.stats.sourceUsage[extra.sourceId] = (db.stats.sourceUsage[extra.sourceId]||0)+1;
  }
  saveDB();

  let timed = false, totalSeconds = 0;
  if(mode==='duel'){
    const minutes = extra.timeMinutes || (db.duelSettings && db.duelSettings.defaultMinutes) || 20;
    timed = true;
    totalSeconds = minutes*60;
  } else if(hasFeature('timedTest') && selectedTimeMode !== 'none'){
    const ratePer100 = parseInt(selectedTimeMode, 10) || 180;
    totalSeconds = Math.round(ratePer100 * finalPool.length / 100 * 60);
    timed = true;
  }
  quizState = { subjectId, subjectName: subject.name, questions: shuffle(finalPool), index:0, answers:{}, timed, secondsLeft: totalSeconds, totalSeconds, duelId: (mode==='duel' ? extra.duelId : null), startedAt: Date.now() };
  go('/quiz');
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Flashcards ----------
   Rule (owner-specified): if the correct choice's text is essentially
   "all of the above are correct", the card's answer side lists every
   other option (since they are all individually true). If the correct
   choice's text is essentially "none of the above", that question is
   skipped from flashcards entirely — there is no positive content to
   show as an answer. */
const ALL_ABOVE_PATTERNS = [/جميع\s*(ما|الإجابات|الاجابات|الخيارات)?\s*(ذكر|سبق)?\s*صحيح/, /كل\s*(ما|الإجابات|الاجابات)?\s*(ذكر|سبق)/, /جميع\s*ما\s*(ذكر|سبق)/, /all\s*of\s*the\s*above/i];
const NONE_ABOVE_PATTERNS = [/لا\s*(شيء|أحد|احد)\s*مم(ا|ّا)?\s*(ذكر|سبق)/, /لا\s*(شيء|أحد|احد)\s*(صحيح|من\s*(الإجابات|الاجابات|الخيارات))/, /none\s*of\s*the\s*above/i];
function isAllAboveText(t){ t=(t||'').trim(); return ALL_ABOVE_PATTERNS.some(p=>p.test(t)); }
function isNoneAboveText(t){ t=(t||'').trim(); return NONE_ABOVE_PATTERNS.some(p=>p.test(t)); }

function buildFlashcards(subject){
  const cards = [];
  subject.questions.forEach(qq=>{
    if(isReported(qq) || qq.correctIndex<0) return;
    const correctText = qq.options[qq.correctIndex] || '';
    if(isNoneAboveText(correctText)) return; /* excluded per owner's rule */
    let answerText;
    if(isAllAboveText(correctText)){
      const others = qq.options.filter((opt,i)=>i!==qq.correctIndex && !isNoneAboveText(opt));
      answerText = others.join(' • ');
    } else {
      answerText = correctText;
    }
    cards.push({ id: qq.id, question: qq.text, answer: answerText, notes: qq.notes||'' });
  });
  return cards;
}

function renderQuiz(user, params){

function prevQuestion(){
  const qz = quizState;
  if(qz.index>0){ qz.index--; render(); }
}
function startQuizTimer(){
  clearInterval(quizTimerHandle);
  if(!quizState || !quizState.timed) return;
  quizTimerHandle = setInterval(()=>{
    if(!quizState || !quizState.timed){ clearInterval(quizTimerHandle); return; }
    quizState.secondsLeft--;
    const badge = document.getElementById('quizTimerBadge');
    if(badge) badge.textContent = '⏱ '+formatDuration(quizState.secondsLeft);
    if(quizState.secondsLeft<=0){ clearInterval(quizTimerHandle); toast('انتهى الوقت المحدد — تم إنهاء الاختبار تلقائيًا'); finishQuiz(); }
  }, 1000);
}
function selectAnswer(i){
  const qz = quizState; const cur = qz.questions[qz.index];
  qz.answers[cur.id] = i;
  if(navigator.vibrate) navigator.vibrate(12);
  render();
}
function exitQuiz(){
  if(!confirm('الخروج من الاختبار؟ لن يتم حفظ التقدم.')) return;
  clearInterval(quizTimerHandle);
  quizState = null;
  navTo('#/browse');
}
function toggleReportBox(){ const b=document.getElementById('reportBox'); b.style.display = b.style.display==='none' ? 'block' : 'none'; }
function submitReport(questionId){
  const subject = findSubject(quizState.subjectId);
  const question = subject.questions.find(q=>q.id===questionId);
  setReport(question, { type: document.getElementById('reportType').value, correction: document.getElementById('reportCorrection').value.trim(), at: Date.now() });
  saveDB();
  toast('تم استلام البلاغ، شكرًا لك');
  document.getElementById('reportBox').style.display='none';
}
function nextQuestion(){
  const qz = quizState;
  if(qz.index < qz.questions.length-1){ qz.index++; render(); }
  else { clearInterval(quizTimerHandle); finishQuiz(); }
}
function finishQuiz(){
  const qz = quizState;
  clearInterval(quizTimerHandle);
  let correct = 0;
  qz.questions.forEach(q=>{ if(qz.answers[q.id]===q.correctIndex) correct++; });
  const total = qz.questions.length;
  const wrong = total-correct;
  const pct = Math.round((correct/total)*100);
  db.stats.quizzesCompleted += 1;
  saveDB();
  quizState.result = { correct, wrong, total, pct, score100: pct };
  if(hasFeature('savedResults')){
    const user = currentUser();
    user.resultHistory = user.resultHistory || [];
    user.resultHistory.push({ date: Date.now(), subjectName: qz.subjectName, correct, total, pct });
    if(user.resultHistory.length>50) user.resultHistory.shift();
    saveSession();
  }
  if(qz.duelId){ submitDuelAttempt(qz, correct, total, pct); }
  if(navigator.vibrate) navigator.vibrate(pct>=70 ? [15,60,15] : 25);
  go('/result');
}
function submitDuelAttempt(qz, correct, total, pct){
  const user = currentUser();
  recordDuelAttemptUsage(user, qz.subjectId);
  const timeTakenSeconds = Math.round((Date.now() - (qz.startedAt||Date.now()))/1000);
  const dept = user.departmentId ? findDepartmentById(user.departmentId) : null;
  const stage = user.stageId ? findStageById(user.stageId) : null;
  const attempt = {
    id: uid(), duelId: qz.duelId, subjectId: qz.subjectId, email: user.email,
    displayName: duelDisplayName(user), departmentName: dept?dept.name:'', stageName: stage?stage.name:'',
    correct, total, pct, timeTakenSeconds,
    completedAt: Date.now()
  };
  dbFS.collection('duelAttempts').doc(attempt.id).set(attempt).catch(function(err){
    console.error('Duel attempt submit failed', err);
    toast('تعذّر إرسال نتيجة المبارزة — تحقق من الاتصال');
  });
}

function retryQuiz(){
  quizState.index=0; quizState.answers={}; quizState.result=null;
  quizState.questions = shuffle(quizState.questions);
  if(quizState.timed) quizState.secondsLeft = quizState.totalSeconds;
  go('/quiz');
}
function retryWrongOnly(){
  const qz = quizState;
  const wrongOnes = qz.questions.filter(q=>qz.answers[q.id]!==q.correctIndex);

  quizState = { subjectId: qz.subjectId, subjectName: qz.subjectName, questions: shuffle(wrongOnes), index:0, answers:{} };
  go('/quiz');

function shareResult(){
  const r = quizState.result;
  const text = 'حصلت على '+r.pct+'% ('+r.correct+'/'+r.total+') في اختبار "'+quizState.subjectName+'" على MCQ Study 🎓';

function resultChartSvg(histChrono){
  const n = histChrono.length;
  const W = 300, H = 130, padX = 14, padY = 14;
  const chartW = W - padX*2, chartH = H - padY*2;
  const pts = histChrono.map((h,i)=>{
    const x = n>1 ? padX + (n-1-i)/(n-1)*chartW : padX + chartW/2;
    const y = padY + (1 - h.pct/100)*chartH;
    return {x, y, pct:h.pct};
  });
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots = pts.map(p=>{
    const color = p.pct>=70?'var(--success)':(p.pct>=50?'var(--accent)':'var(--danger)');
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="'+color+'"/>';
  }).join('');
  const grid = [0,25,50,75,100].map(v=>{
    const y = padY + (1-v/100)*chartH;
    return '<line x1="'+padX+'" y1="'+y.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>';
  }).join('');
  const line = n>1 ? '<path d="'+pathD+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;display:block;">'+grid+line+dots+'</svg>';
}
function renderHistory(user, params){
  const hist = (user.resultHistory||[]).slice();
  let html = '<div class="screen">' + pagehead('سجل نتائجي', '/home') + '<div class="content" style="padding-top:0;">';
  if(!hist.length){
    html += '<div class="empty">'+icon('bar',30)+'<b>لا توجد محاولات بعد</b><p>نتائج اختباراتك ستظهر هنا تلقائيًا، مقسّمة حسب كل مادة.</p></div>';
  } else {
    const avg = Math.round(hist.reduce((a,h)=>a+h.pct,0)/hist.length);
    html += '<div class="statgrid"><div class="statbox"><b>'+hist.length+'</b><span>اختبارات مكتملة</span></div><div class="statbox"><b>'+avg+'%</b><span>متوسط الأداء الكلي</span></div></div>';

    /* Group attempts by subject, each subject gets its own mini-chart
       and its own attempt list, instead of one combined feed. */
    const groups = {}; const order = [];
    hist.forEach(h=>{
      if(!groups[h.subjectName]){ groups[h.subjectName]=[]; order.push(h.subjectName); }
      groups[h.subjectName].push(h);
    });
    order.sort((a,b)=> groups[b][groups[b].length-1].date - groups[a][groups[a].length-1].date);

    html += order.map(function(subjName){
      const list = groups[subjName];
      const subjAvg = Math.round(list.reduce((a,h)=>a+h.pct,0)/list.length);
      const chartData = list.slice(-20);
      const revList = list.slice().reverse();
      const chart = chartData.length>1
        ? ('<div class="hint" style="margin:8px 0 4px;">آخر '+chartData.length+' محاولة لهذه المادة</div>' + resultChartSvg(chartData))
        : '';
      return '<div class="card" style="margin-top:10px;">'
        + '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;"><b dir="auto" style="font-size:14px;">'+esc(subjName)+'</b><span class="hint" style="white-space:nowrap;">'+list.length+' محاولة • '+subjAvg+'%</span></div>'
        + chart
        + '<div style="margin-top:8px;">' + revList.map(h=>{
            const d = new Date(h.date);
            const dateStr = d.toLocaleDateString('ar-EG', {day:'numeric', month:'short'});
            const color = h.pct>=70 ? 'var(--success)' : (h.pct>=50 ? 'var(--accent)' : 'var(--danger)');
            return '<div class="listcard"><div class="rowlist"><b style="font-size:13px;">'+dateStr+'</b><span class="hint">'+h.correct+'/'+h.total+'</span></div><b style="color:'+color+';font-family:var(--font-display);">'+h.pct+'%</b></div>';
          }).join('') + '</div>'
        + '</div>';
    }).join('');
  }
  html += '</div></div>';
  return html;
}
function renderReview(user, params){

        }).join('') + '</div>'
      : '';

  }).join('');

function rateQuestion(qid, dir){

  saveDB();
  const btn = document.getElementById('rate_'+qid);
  if(btn) btn.innerHTML = '<span class="hint">شكرًا لتقييمك</span>';
}

function createDuel(){
  const subjectId = document.getElementById('duelSubject').value;
  const subject = findSubject(subjectId);
  if(!subject){ toast('اختر مادة'); return; }
  const qCount = parseInt(document.getElementById('duelQCount').value,10) || 20;
  const opensAtStr = document.getElementById('duelOpensAt').value;
  if(!opensAtStr){ toast('حدّد وقت الفتح'); return; }
  const opensAt = new Date(opensAtStr).getTime();
  const ownMinutesVal = document.getElementById('duelOwnMinutes').value.trim();
  const timeMinutes = ownMinutesVal ? (parseInt(ownMinutesVal,10)||null) : null;
  const topics = Array.from(document.querySelectorAll('.duelTopicChk:checked')).map(c=>c.value);
  let pool = subject.questions.filter(q=>!isReported(q) && q.correctIndex>=0);
  if(topics.length) pool = pool.filter(q=>topics.includes((q.topic||'').trim()));
  if(pool.length<qCount){ toast('عدد الأسئلة المتاحة ('+pool.length+') أقل من المطلوب'); return; }
  const chosen = shuffle(pool.slice()).slice(0,qCount);
  const duel = {
    id: uid(), subjectId, subjectName: subject.name, topics,
    questionIds: chosen.map(q=>q.id),
    timeMinutes,
    opensAt, createdAt: Date.now(), createdBy: currentUser().email
  };
  dbFS.collection('duels').doc(duel.id).set(duel).then(function(){ toast('تم إنشاء المبارزة'); }).catch(function(err){ console.error(err); toast('تعذّر إنشاء المبارزة — تحقق من الاتصال'); });
}

function startLuckyDraw(){
  const subjectId = document.getElementById('ldSubject').value;
  const position = parseInt(document.getElementById('ldPosition').value,10);
  const subject = findSubject(subjectId);
  toast('جارٍ جلب النتائج...');
  dbFS.collection('duelAttempts').where('subjectId','==',subjectId).get().then(function(snap){
    const attempts = snap.docs.map(function(d){ return d.data(); });
    const totals = {};
    attempts.forEach(function(a){
      if(!totals[a.email]) totals[a.email] = { email:a.email, displayName:a.displayName, total:0 };
      totals[a.email].total += a.pct;
      totals[a.email].displayName = a.displayName;
    });
    const ranked = Object.values(totals).sort(function(x,y){ return y.total-x.total; });
    let rank = 0, lastScore = null, group = [];
    for(let i=0;i<ranked.length;i++){
      if(ranked[i].total !== lastScore){ rank = i+1; lastScore = ranked[i].total; }
      if(rank===position) group.push(ranked[i]);
    }
    luckyDrawWinners = null;
    luckyDrawState = { subjectId, subjectName: subject.name, position, group };
    render();
  }).catch(function(err){ console.error(err); toast('تعذّر جلب البيانات — تحقق من الاتصال'); });
}

  const st = luckyDrawState;

  if(!st.group.length){

      html += '<div class="field"><label>الخطة</label><select id="ldUniformTier">'+tierOpts+'</select></div>'
        + '<div class="field"><label>عدد الأيام</label><input type="number" id="ldUniformDays" min="1" value="30"/></div>';

      return '<div class="listcard" style="flex-direction:column;align-items:stretch;">'
        + '<b style="font-size:13px;margin-bottom:6px;">'+esc(w.displayName)+' <span class="hint">('+esc(w.email)+')</span></b>'
        + (rewardMode==='custom' ? ('<div class="field"><label>الخطة</label><select id="ldTier_'+i+'">'+tierOpts+'</select></div><div class="field"><label>عدد الأيام</label><input type="number" id="ldDays_'+i+'" min="1" value="30"/></div>') : '')
        + '</div>';
    }).join('');
    html += '<div class="field"><label>وقت التفعيل</label><select id="ldActivateWhen"><option value="now">فورًا</option><option value="later">لاحقًا (بعد انتهاء اشتراكهم الحالي)</option></select></div>'
      + '<button class="btn btn-primary" onclick="applyLuckyDrawRewards()">تفعيل المكافآت</button>';
  }
  return html;

function toggleRewardMode(){ rewardMode = rewardMode==='uniform' ? 'custom' : 'uniform'; render(); }
function drawWinners(){
  const count = parseInt(document.getElementById('ldWinnerCount').value,10) || 1;
  luckyDrawWinners = shuffle(luckyDrawState.group.slice()).slice(0, Math.min(count, luckyDrawState.group.length));
  render();
}
function applyLuckyDrawRewards(){
  const when = document.getElementById('ldActivateWhen').value;
  const rewards = luckyDrawWinners.map(function(w,i){
    let tierId, days;
    if(rewardMode==='uniform'){
      tierId = document.getElementById('ldUniformTier').value;
      days = parseInt(document.getElementById('ldUniformDays').value,10)||0;
    } else {
      tierId = document.getElementById('ldTier_'+i).value;
      days = parseInt(document.getElementById('ldDays_'+i).value,10)||0;
    }
    return { email: w.email, tierId, days };
  });
  if(rewards.some(function(r){ return !r.tierId || !r.days; })){ toast('حدد خطة ومدة لكل فائز'); return; }
  let pending = rewards.length;
  rewards.forEach(function(r){
    dbFS.collection('users').doc(r.email).get().then(function(doc){
      if(!doc.exists) return null;
      const profile = doc.data();
      if(when==='now'){
        profile.subscription = { tierId:r.tierId, activatedAt:Date.now(), expiresAt:Date.now()+r.days*86400000 };
      } else if(profile.subscription && profile.subscription.expiresAt>Date.now()){
        profile.scheduledSubscription = { tierId:r.tierId, durationDays:r.days };
      } else {
        profile.subscription = { tierId:r.tierId, activatedAt:Date.now(), expiresAt:Date.now()+r.days*86400000 };
      }
      return dbFS.collection('users').doc(r.email).set(profile, {merge:true});
    }).then(function(){
      pending--;
      if(pending<=0){ toast('تم تفعيل كل المكافآت بنجاح'); luckyDrawWinners=null; luckyDrawState=null; render(); }
    }).catch(function(err){ console.error(err); toast('حدث خطأ أثناء تفعيل إحدى المكافآت'); });
  });
}

/* ---------- Leaderboard ---------- */
let leaderboardCache = { current:null, previous:null };
let leaderboardFetchStatus = { current:'idle', previous:'idle' };
let leaderboardPeriod = 'current';
function monthRange(offset){
  const now = new Date();
  const y = now.getFullYear(), m = now.getMonth()+offset;
  return { start: new Date(y,m,1).getTime(), end: new Date(y,m+1,1).getTime() };
}
function fetchLeaderboard(period, force){
  period = period || leaderboardPeriod;
  if(leaderboardFetchStatus[period]==='loading') return;
  if(leaderboardCache[period] && !force) return;
  leaderboardFetchStatus[period] = 'loading';
  const range = monthRange(period==='current' ? 0 : -1);
  dbFS.collection('duelAttempts').where('completedAt','>=',range.start).where('completedAt','<',range.end).get().then(function(snap){
    const totals = {};
    snap.docs.forEach(function(d){
      const a = d.data();
      if(!totals[a.email]) totals[a.email] = { email:a.email, displayName:a.displayName, departmentName:a.departmentName||'', stageName:a.stageName||'', total:0 };
      totals[a.email].total += a.pct;
      totals[a.email].displayName = a.displayName;
      totals[a.email].departmentName = a.departmentName||totals[a.email].departmentName;
      totals[a.email].stageName = a.stageName||totals[a.email].stageName;
    });
    leaderboardCache[period] = Object.values(totals).sort(function(x,y){ return y.total-x.total; }).slice(0,100);
    leaderboardFetchStatus[period] = 'loaded';
    render();
  }).catch(function(err){ console.error(err); leaderboardFetchStatus[period]='error'; render(); });
}
function switchLeaderboardPeriod(period){
  leaderboardPeriod = period;
  if(leaderboardFetchStatus[period]==='idle') fetchLeaderboard(period);
  render();
}
function renderLeaderboard(user, params){
  if(!hasFeature('leaderboard')){ go('/home'); return ''; }
  const period = leaderboardPeriod;
  if(leaderboardFetchStatus[period]==='idle') fetchLeaderboard(period);
  let html = '<div class="screen">'+pagehead('قائمة المتصدرين','/home')+'<div class="content" style="padding-top:0;">';
  html += '<div class="btnrow" style="margin-bottom:12px;">'
    + '<button type="button" class="btn '+(period==='current'?'btn-primary':'btn-outline')+'" style="flex:1;" onclick="switchLeaderboardPeriod(\'current\')">الشهر الحالي</button>'
    + '<button type="button" class="btn '+(period==='previous'?'btn-primary':'btn-outline')+'" style="flex:1;" onclick="switchLeaderboardPeriod(\'previous\')">الشهر السابق</button>'
    + '</div>';
  const status = leaderboardFetchStatus[period];
  const cache = leaderboardCache[period];
  if(status==='loading' || status==='idle'){
    html += skeletonRows(6);
  } else if(status==='error'){

    }).join('');

function grantDifficultyPermission(){
  const email = document.getElementById('diffGranteeEmail').value.trim().toLowerCase();
  const days = parseInt(document.getElementById('diffGranteeDays').value,10) || 30;
  if(!email || !email.includes('@')){ toast('أدخل بريدًا صحيحًا'); return; }
  if(!db.difficultyGraders) db.difficultyGraders = [];
  const existing = db.difficultyGraders.find(g=>g.email===email);
  const expiresAt = Date.now() + days*86400000;
  if(existing){ existing.expiresAt = expiresAt; existing.grantedAt = Date.now(); }
  else db.difficultyGraders.push({ email, grantedAt: Date.now(), expiresAt });
  saveDB(); toast('تم منح الصلاحية'); render();
}
function renewDifficultyPermission(email){
  const g = (db.difficultyGraders||[]).find(x=>x.email===email);
  if(!g) return;
  const days = parseInt(prompt('كم يومًا تريد تمديد الصلاحية؟','30'),10);
  if(!days || days<=0) return;
  g.expiresAt = Math.max(g.expiresAt, Date.now()) + days*86400000;
  saveDB(); toast('تم التجديد'); render();
}
function revokeDifficultyPermission(email){
  if(!confirm('إيقاف صلاحية هذا الطالب فورًا؟')) return;
  const g = (db.difficultyGraders||[]).find(x=>x.email===email);
  if(!g) return;
  g.expiresAt = Date.now()-1;
  saveDB(); toast('تم إيقاف الصلاحية'); render();
}

/* ---------- Broken-question audit: finds legacy/mis-imported questions
   across ALL universities (no answer set, or an unusually high option
   count — a tell-tale sign of an import that split incorrectly, like
   an "Answer: X" line that ended up saved as an extra option). ---------- */
function scanBrokenQuestions(){
  const results = [];
  db.universities.forEach(u=>{
    u.colleges.forEach(c=>{
      c.departments.forEach(d=>{
        d.stages.forEach(sg=>{
          sg.subjects.forEach(s=>{
            (s.questions||[]).forEach(q=>{
              const issues = [];
              if(q.correctIndex<0 || q.correctIndex>=q.options.length) issues.push('بلا إجابة صحيحة محددة');
              if(q.options.length>6) issues.push('اختيارات زائدة ('+q.options.length+')');
              if(issues.length) results.push({ uniName:u.name, path: c.name+' ← '+d.name+' ← '+sg.name+' ← '+s.name, subjectId:s.id, questionId:q.id, text:q.text, issues });
            });
          });
        });
      });
    });
  });
  return results;
}
function adminAuditTab(){
  const results = scanBrokenQuestions();
  let html = '<div class="card"><p class="hint" style="margin:0;">فحص تلقائي لكل الأسئلة بكل الجامعات: يجمع أي سؤال بلا إجابة صحيحة محددة، أو فيه أكثر من ٦ اختيارات (عادة أثر استيراد لم يتم تحليله بشكل كامل، مثل سطر "Answer: د" الذي حُفظ كخيار إضافي بدل تحديد الإجابة).</p></div>';
  if(!results.length){
    html += '<div class="empty">'+icon('check',28)+'<b>لا توجد مشاكل حاليًا</b><p>كل الأسئلة سليمة.</p></div>';
    return html;
  }
  html += '<div class="hint" style="margin:10px 0;">تم العثور على '+results.length+' سؤال يحتاج مراجعة:</div>'
    + results.map(r=>'<div class="listcard" style="align-items:flex-start;flex-direction:column;gap:6px;">'
      + '<b dir="auto" style="font-size:13px;">'+esc(truncate(r.text||'(بلا نص)',60))+'</b>'
      + '<span class="hint">'+esc(r.uniName)+' ← '+esc(r.path)+'</span>'

}

let allUsersCache = null;
let usersFetchStatus = 'idle'; /* idle | loading | loaded | error */
function fetchAllUsers(force){
  if(usersFetchStatus==='loading') return;
  if(allUsersCache && !force) return;
  usersFetchStatus = 'loading';
  dbFS.collection('users').get().then(function(snap){
    allUsersCache = [];
    snap.forEach(function(doc){ allUsersCache.push(Object.assign({_id: doc.id}, doc.data())); });
    usersFetchStatus = 'loaded';
    render();
  }).catch(function(err){
    console.error('fetch users failed', err);
    usersFetchStatus = 'error';
    render();
  });
}

function saveNewAd(e){
  e.preventDefault();

function showAdIfEligible(){
  if(!hasFeature('ads')) return;
  const ad = (db.ads||[]).find(a=>a.active);
  if(!ad) return;
  const u = currentUser(); if(!u || u.role==='owner') return;
  if(ad.targetColleges && ad.targetColleges.length && !ad.targetColleges.includes(u.collegeId)) return;
  if(ad.targetDepartments && ad.targetDepartments.length && !ad.targetDepartments.includes(u.departmentId)) return;
  const tier = activeTierOf(u);
  if(tier && tier.adsExempt) return;
  u.adViews = u.adViews || {};
  const cap = (db.adSettings && db.adSettings.maxViewsPerUser) || 0;
  const seen = u.adViews[ad.id] || 0;
  if(cap>0 && seen>=cap) return;
  u.adViews[ad.id] = seen+1; saveSession();

  const mediaHtml = (ad.image?('<img src="'+ad.image+'" style="width:100%;border-radius:14px;max-height:280px;object-fit:cover;"/>'):'')
    + (ad.video?('<video src="'+esc(ad.video)+'" controls autoplay muted playsinline style="width:100%;border-radius:14px;max-height:280px;margin-top:'+(ad.image?'10px':'0')+';"></video>'):'')
    + (ad.text?('<p style="margin-top:12px;line-height:1.7;font-size:14px;">'+esc(ad.text)+'</p>'):'');
  const html = '<div class="modaloverlay" id="adOverlay" style="align-items:center;">'
    + '<div class="modalsheet" style="border-radius:22px;position:relative;">'
    + '<button id="adCloseBtn" disabled onclick="if(!this.disabled) closeAdOverlay()" style="position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text);opacity:.6;">5</button>'
    + '<div style="margin-top:4px;">' + mediaHtml + '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  let left = 5;
  const cd = setInterval(()=>{
    left--;
    const btn = document.getElementById('adCloseBtn');
    if(!btn){ clearInterval(cd); return; }
    if(left<=0){ clearInterval(cd); btn.disabled=false; btn.style.opacity='1'; btn.innerHTML = icon('x',15); }
    else { btn.textContent = left; }
  }, 1000);
}

function saveInstitution(instId){
  const uniId = document.getElementById('instUni').value;
  const editing = instId ? db.institutions.find(i=>i.id===instId) : null;
  const email = editing ? editing.adminEmail : document.getElementById('instEmail').value.trim().toLowerCase();
  if(!editing){
    if(!email || !email.includes('@')){ toast('أدخل بريدًا صحيحًا'); return; }
    if(email===OWNER_EMAIL || db.institutions.some(i=>i.adminEmail===email)){ toast('هذا البريد مستخدم بالفعل'); return; }
  }
  const studentFeatures = {};
  FEATURE_DEFS.forEach(f=>{ studentFeatures[f.key] = document.getElementById('instFeat_'+f.key).checked; });
  pushUndo();
  if(editing){
    editing.universityId = uniId;
    editing.studentFeatures = studentFeatures;
    if(db.features.institutionBranding){
      editing.brandName = document.getElementById('instBrandName').value.trim();
      editing.brandColor = document.getElementById('instBrandColor').value;
      editing.logoDataUrl = instLogoState;
    }
  } else {
    const rec = { id: uid(), universityId: uniId, adminEmail: email, studentFeatures, studentUsernames: [] };
    if(db.features.institutionBranding){
      rec.brandName = document.getElementById('instBrandName').value.trim();
      rec.brandColor = document.getElementById('instBrandColor').value;
      rec.logoDataUrl = instLogoState;
    }
    db.institutions.push(rec);
  }
  saveDB(); if(!editing) grantPrivilege(email); closeModal(); toast('تم الحفظ'); render();
}
function deleteInstitution(id){
  if(!confirm('حذف هذه الجامعة المسجّلة؟ سيفقد مسؤولها صلاحية الدخول، ولن يتمكن طلابها الحاليون من الدخول بيوزراتهم بعد الآن.')) return;
  pushUndo();
  const inst = db.institutions.find(i=>i.id===id);
  const email = inst ? inst.adminEmail : null;
  db.institutions = db.institutions.filter(i=>i.id!==id);
  saveDB(); if(email) revokePrivilege(email); toast('تم الحذف'); render();
}

function saveTier(tierId){

function genCodeString(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<8;i++) s += chars.charAt(Math.floor(Math.random()*chars.length));
  return s;
}
function generateCode(){
  const tierId = document.getElementById('codeTier').value;
  const durationDays = parseInt(document.getElementById('codeDuration').value)||30;
  const maxUses = parseInt(document.getElementById('codeMaxUses').value)||1;
  const expiryVal = document.getElementById('codeExpiry').value;
  const codeExpiresAt = expiryVal ? new Date(expiryVal+'T23:59:59').getTime() : null;
  const notes = document.getElementById('codeNotes').value.trim();
  let code;
  do { code = genCodeString(); } while(db.subscriptionCodes.some(c=>c.code===code));
  pushUndo();
  db.subscriptionCodes.push({ id:uid(), code, tierId, durationDays, maxUses, usedCount:0, usedBy:[], codeExpiresAt, notes, createdAt:Date.now(), revoked:false });
  saveDB();
  const url = location.origin + location.pathname + '#/activate?code=' + code;
  const box = document.getElementById('codeResult');
  box.innerHTML = '<div class="card" style="text-align:center;"><div id="qrHolder" style="display:flex;justify-content:center;margin-bottom:10px;"></div>'
    + '<div class="hint" style="margin-bottom:8px;word-break:break-all;">'+esc(url)+'</div>'
    + '<button type="button" class="btn btn-outline btn-sm" onclick="copyActivationLink(\''+url+'\')">نسخ الرابط</button></div>';
  new QRCode(document.getElementById('qrHolder'), { text:url, width:180, height:180, colorDark:'#1B2333', colorLight:'#ffffff' });
  toast('تم توليد الرمز: '+code);
}
function copyActivationLink(url){
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('تم نسخ الرابط')).catch(()=>toast('تعذّر النسخ')); }
}
function revokeCode(id){
  if(!confirm('إلغاء هذا الرمز؟ لن يعود قابلًا للاستخدام.')) return;
  const c = db.subscriptionCodes.find(x=>x.id===id);
  if(c){ pushUndo(); c.revoked = true; saveDB(); toast('تم الإلغاء'); render(); }
}

function distinctNames(list){ return Array.from(new Set(list)).sort((a,b)=>a.localeCompare(b,'ar')); }
function distinctCollegeNames(){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>names.push(c.name)));
  return distinctNames(names);
}
function distinctDeptNames(collegeName){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>{ if(c.name===collegeName) c.departments.forEach(d=>names.push(d.name)); }));
  return distinctNames(names);
}
function distinctStageNames(collegeName, deptName){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>{ if(c.name!==collegeName) return; c.departments.forEach(d=>{ if(d.name!==deptName) return; d.stages.forEach(s=>names.push(s.name)); }); }));
  return distinctNames(names);
}
function distinctSubjectNames(collegeName, deptName, stageName){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>{ if(c.name!==collegeName) return; c.departments.forEach(d=>{ if(d.name!==deptName) return; d.stages.forEach(sg=>{ if(sg.name!==stageName) return; sg.subjects.forEach(sub=>names.push(sub.name)); }); }); }));
  return distinctNames(names);
}
function findAnySubjectByPath(collegeName, deptName, stageName, subjectName){
  for(const u of db.universities) for(const c of u.colleges){
    if(c.name!==collegeName) continue;
    for(const d of c.departments){
      if(d.name!==deptName) continue;
      for(const sg of d.stages){
        if(sg.name!==stageName) continue;
        const s = sg.subjects.find(x=>x.name===subjectName);
        if(s) return s;
      }
    }
  }
  return null;
}
