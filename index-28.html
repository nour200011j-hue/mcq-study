function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const name = file.name.toLowerCase();
  const textarea = document.getElementById('impText');
  const status = document.getElementById('impFileStatus');
  status.textContent = 'جاري استخراج النص من الملف...';
  if(name.endsWith('.txt')){
    const reader = new FileReader();
    reader.onload = function(){ textarea.value = reader.result; status.textContent = 'تم استخراج النص من '+file.name; };
    reader.onerror = function(){ status.textContent = 'تعذّر قراءة الملف'; };
    reader.readAsText(file, 'utf-8');
  } else if(name.endsWith('.docx')){
    const reader = new FileReader();
    reader.onload = function(){
      mammoth.extractRawText({arrayBuffer: reader.result}).then(function(result){
        textarea.value = result.value;
        status.textContent = 'تم استخراج النص من '+file.name;
      }).catch(function(err){
        console.error(err); status.textContent = 'تعذّر استخراج النص من ملف Word';
      });
    };
    reader.onerror = function(){ status.textContent = 'تعذّر قراءة الملف'; };
    reader.readAsArrayBuffer(file);
  } else if(name.endsWith('.pdf')){
    const reader = new FileReader();
    reader.onload = function(){
      const typedArray = new Uint8Array(reader.result);
      let sawHighlights = false;
      pdfjsLib.getDocument({data: typedArray}).promise.then(function(pdf){
        const pagePromises = [];
        for(let i=1; i<=pdf.numPages; i++){
          pagePromises.push(pdf.getPage(i).then(function(page){
            return Promise.all([page.getTextContent(), page.getAnnotations()]);
          }).then(function(res){
            const content = res[0], annots = res[1];
            const highlights = annots.filter(function(a){ return a.subtype==='Highlight' && a.quadPoints && a.quadPoints.length>=8; });
            const tagged = content.items.map(function(it){
              const x = it.transform[4], y = it.transform[5];
              const w = it.width||1, h = Math.abs(it.transform[3])||10;
              const cx = x + w/2, cy = y + h/2;
              let marked = false;
              highlights.forEach(function(hl){
                for(let qi=0; qi+7<hl.quadPoints.length; qi+=8){
                  const qx = [hl.quadPoints[qi],hl.quadPoints[qi+2],hl.quadPoints[qi+4],hl.quadPoints[qi+6]];
                  const qy = [hl.quadPoints[qi+1],hl.quadPoints[qi+3],hl.quadPoints[qi+5],hl.quadPoints[qi+7]];
                  const minX=Math.min.apply(null,qx), maxX=Math.max.apply(null,qx);
                  const minY=Math.min.apply(null,qy), maxY=Math.max.apply(null,qy);
                  if(cx>=minX-1 && cx<=maxX+1 && cy>=minY-2 && cy<=maxY+2) marked = true;
                }
              });
              if(marked) sawHighlights = true;
              return { str: it.str, y: y, marked: marked, hasEOL: !!it.hasEOL };
            });
            /* pdf.js gives a flat list of text runs with no line breaks —
               reconstruct lines by grouping runs whose baseline Y is close
               together, since the parser needs real newlines to find
               question/option boundaries. */
            const lines = [];
            let curY = null, curParts = [];
            tagged.forEach(function(t){
              if(curY===null) curY = t.y;
              if(Math.abs(t.y-curY) > 3){
                lines.push(curParts.join(' ').replace(/\s+/g,' ').trim());
                curParts = []; curY = t.y;
              }
              if(t.str) curParts.push(t.marked ? ('*'+t.str+'*') : t.str);
              if(t.hasEOL){ lines.push(curParts.join(' ').replace(/\s+/g,' ').trim()); curParts = []; curY = null; }
            });
            if(curParts.length) lines.push(curParts.join(' ').replace(/\s+/g,' ').trim());
            return lines.filter(Boolean).join('\n');
          }));
        }
        return Promise.all(pagePromises);
      }).then(function(pages){
        textarea.value = pages.join('\n\n');
        status.textContent = 'تم استخراج النص من '+file.name+' ('+pages.length+' صفحة)'
          + (sawHighlights ? ' — تم رصد تظليل ملوّن وتحديده تلقائيًا (راجعه)' : '')
          + ' — راجع النص فقد يحتاج ترتيب بسيط';
      }).catch(function(err){
        console.error(err); status.textContent = 'تعذّر استخراج النص من ملف PDF';
      });
    };
    reader.onerror = function(){ status.textContent = 'تعذّر قراءة الملف'; };
    reader.readAsArrayBuffer(file);
  } else if(name.endsWith('.doc')){
    status.textContent = 'صيغة .doc القديمة غير مدعومة — احفظ الملف بصيغة .docx من Word ثم أعد رفعه';
  } else {
    status.textContent = 'صيغة غير مدعومة — استخدم txt أو docx أو pdf';
  }
}
const AR_LETTER_INDEX = { 'أ':0,'ا':0,'إ':0,'ب':1,'ج':2,'د':3,'ه':4,'و':5 };
function letterToIndex(letter){
  if(!letter) return -1;
  const en = 'ABCDE'.indexOf(letter.toUpperCase());
  if(en>-1) return en;
  if(letter in AR_LETTER_INDEX) return AR_LETTER_INDEX[letter];
  return -1;
}
/* Finds "answer key" lines anywhere in the text: a line that is JUST a
   question number followed by a single option letter (e.g. "45- c",
   "12. D"), as opposed to an actual question/option line which always
   has real content after the marker. Handles both a single key block
   at the end of the file and several smaller key blocks repeated
   throughout (e.g. every ~10 questions). Also handles several pairs
   comma-separated on one line. */
function extractAnswerKey(text){
  const map = {};
  const re = /(?:^|[\s,،(|])(\d{1,4})\s*[-.:)\\_]\s*([A-Ea-e])(?=[\s,،.|]|$)/g;
  let m;
  while((m = re.exec(text)) !== null){
    map[parseInt(m[1],10)] = m[2].toUpperCase();
  }
  return map;
}
function parseBulkQuestions(text){
  const answerKey = extractAnswerKey(text);
  const lines = text.split('\n');
  const blocks = [];
  let current = null;
  lines.forEach(function(line){
    const trimmed = line.trim();
    if(!trimmed) return;
    const isAnswerKeyLine = /^\d{1,4}\s*[-.:)]\s*[A-Ea-e]\s*$/.test(trimmed);
    const qStart = trimmed.match(/^(\d{1,4})\s*[-.:)]\s+(.{4,})$/);
    if(isAnswerKeyLine){
      if(current){ blocks.push(current); current = null; }
    } else if(qStart){
      if(current) blocks.push(current);
      current = { num: parseInt(qStart[1],10), lines: [qStart[2]] };
    } else if(current){
      current.lines.push(trimmed);
    }
  });
  if(current) blocks.push(current);
  if(!blocks.length) return parseBulkQuestionsLegacy(text, answerKey);

  const results = [];
  blocks.forEach(function(b){
    const parsed = parseQuestionLines(b.lines);
    if(!parsed) return;
    if(parsed.correctIndex===-1 && b.num!=null && answerKey[b.num]){
      const idx = letterToIndex(answerKey[b.num]);
      if(idx>-1 && idx<parsed.options.length) parsed.correctIndex = idx;
    }
    results.push({ text:parsed.text, options:parsed.options, correctIndex:parsed.correctIndex, uncertain: parsed.correctIndex<0 });
  });
  return results;
}
function detectDominantScript(text){
  const arabicCount = (text.match(/[\u0600-\u06FF]/g)||[]).length;
  const latinCount = (text.match(/[a-zA-Z]/g)||[]).length;
  if(arabicCount===0 && latinCount===0) return null;
  if(arabicCount > latinCount*2) return 'ar';
  if(latinCount > arabicCount*2) return 'en';
  return null;
}
function stripForeignScript(text, dominant){
  if(!dominant || !text) return text;
  let out = text;
  if(dominant==='en') out = out.replace(/[\u0600-\u06FF]+/g,'');
  else if(dominant==='ar') out = out.replace(/\b[a-zA-Z]{2,}\b/g,'');
  return out.replace(/\s{2,}/g,' ').replace(/\s+([.,;:؟?!])/g,'$1').trim();
}
/* An option marker: an optional bullet, then a single option letter
   (Latin A-E, either case, or the equivalent Arabic letters), then
   one of the accepted separators ) \ - _ . : with optional spaces on
   either side of it — covers "A)", "A\", "A-", "A_", "A )", "A \",
   "A -", "A _", etc. Anchored to the START of a (trimmed) line so
   ordinary sentence text isn't mistaken for a marker. */
const OPTION_MARKER_RE = /^[-•]?\s*([A-Ea-eأإابجده])\s*[)\\\-_.:]\s*(.*)$/;
function parseQuestionLines(blockLines){
  if(!blockLines.length) return null;

  /* Pull out an inline "Answer: X" / "الإجابة: X" line wherever it
     appears in the block (normally right after the last option) so
     it never gets swallowed into the last option's text. */
  let answerFromLine = null;
  const workLines = [];
  blockLines.forEach(function(raw){
    const t = String(raw==null?'':raw).trim();
    if(!t) return;
    if(answerFromLine===null){
      const ansMatch = t.match(/^(الجواب|الإجابة|Answer)\s*[:\-\\\/]\s*(.+)$/i);
      if(ansMatch){ answerFromLine = ansMatch[2].trim(); return; }
    }
    workLines.push(t);
  });
  if(!workLines.length) return null;

  /* Walk the lines once: everything before the first option marker
     is question text (it may itself wrap across several lines).
     Once the first marker (option A) is seen, every following line
     either starts a new option (its own marker) or is a continuation
     of the option currently being read — so a long option keeps
     growing until the NEXT marker shows up, exactly like a long
     question keeps growing until the FIRST marker shows up. */
  const qParts = [];
  const optChunks = {};
  const starredIdx = {};
  const orderedIndices = [];
  let seenMarker = false;
  let currentIdx = -1;

  workLines.forEach(function(rawLine){
    let line = rawLine;
    let starred = false;
    if(/^\*/.test(line)){ line = line.replace(/^\*+/,'').trim(); starred = true; }
    if(/\*$/.test(line)){ line = line.replace(/\*+$/,'').trim(); starred = true; }
    if(/✓/.test(line)){ line = line.replace(/✓/g,'').trim(); starred = true; }

    const m = line.match(OPTION_MARKER_RE);
    if(m){
      const idx = letterToIndex(m[1]);
      /* Real option lists always start at A — this rejects a false
         match like "E.R, a 27-year-old woman..." (patient initials
         at the very start of a clinical vignette) which would
         otherwise be misread as "option E" before any real option
         has appeared. Once a genuine A has been seen, any later
         letter (B, C, D, E...) is accepted as a new option. */
      if(idx>-1 && (seenMarker || idx===0)){
        seenMarker = true;
        currentIdx = idx;
        if(!(idx in optChunks)){ optChunks[idx]=[]; orderedIndices.push(idx); }
        const rest = m[2].trim();
        if(rest) optChunks[idx].push(rest);
        if(starred) starredIdx[idx] = true;
        return;
      }
    }
    if(!seenMarker){
      qParts.push(line);
    } else if(currentIdx>-1){
      optChunks[currentIdx].push(line);
      if(starred) starredIdx[currentIdx] = true;
    }
  });

  if(!seenMarker || !orderedIndices.length) return null;
  const qLine = qParts.join(' ').replace(/\s{2,}/g,' ').trim();

  orderedIndices.sort(function(a,b){ return a-b; });
  let correctIndex = -1;
  const options = orderedIndices.map(function(idx, pos){
    const text = optChunks[idx].join(' ').replace(/\s{2,}/g,' ').trim();
    if(starredIdx[idx]) correctIndex = pos;
    return text;
  }).filter(Boolean);
  if(options.length !== orderedIndices.length) return null; /* an option ended up empty */

  if(correctIndex===-1 && answerFromLine){
    const idx = letterToIndex(answerFromLine.charAt(0));
    const pos = idx>-1 ? orderedIndices.indexOf(idx) : -1;
    if(pos>-1) correctIndex = pos;
    else { const found = options.findIndex(function(o){ return o.trim()===answerFromLine.trim(); }); if(found>-1) correctIndex=found; }
  }

  const dominant = detectDominantScript([qLine].concat(options).join(' '));
  const cleanQLine = stripForeignScript(qLine, dominant);
  let adjustedCorrectIndex = correctIndex;
  const cleanOptions = [];
  options.forEach(function(o, idx){
    const cleaned = stripForeignScript(o, dominant);
    if(cleaned){
      cleanOptions.push(cleaned);
    } else if(idx===correctIndex){
      adjustedCorrectIndex = -1;
    } else if(idx<correctIndex){
      adjustedCorrectIndex--;
    }
  });
  if(cleanQLine && cleanOptions.length>=2) return { text:cleanQLine, options:cleanOptions, correctIndex:adjustedCorrectIndex };
  return null;
}
/* Fallback for text with no numbered questions at all: split on blank
   lines like before, but still consult a separately-declared answer
   key by position (1st block ↔ key #1, etc.) when nothing inline is
   found — and never guess: an undetected answer stays unanswered. */
function parseBulkQuestionsLegacy(text, answerKey){
  const blocks = text.split(/\n\s*\n+/).map(function(b){ return b.trim(); }).filter(Boolean);
  const results = [];
  blocks.forEach(function(block,bi){
    const lines = block.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    if(lines.length<3) return;
    const cleanFirst = lines[0].replace(/^(س\d*[.):]|\d+[.)]|\d+-)\s*/,'').trim();
    const parsed = parseQuestionLines([cleanFirst].concat(lines.slice(1)));
    if(!parsed) return;
    if(parsed.correctIndex===-1 && answerKey && answerKey[bi+1]){
      const idx = letterToIndex(answerKey[bi+1]);
      if(idx>-1 && idx<parsed.options.length) parsed.correctIndex = idx;
    }
    results.push({ text:parsed.text, options:parsed.options, correctIndex:parsed.correctIndex, uncertain: parsed.correctIndex<0 });
  });
  return results;
}
function normalizeQKey(text, options){
  return (text.trim()+'|'+options.join('|')).replace(/\s+/g,' ').toLowerCase();
}
function resolveImportTargetSubject(){
  if(importFixedSubjectId) return findSubject(importFixedSubjectId);

  if(!collegeEl) return null;

  const deptName = document.getElementById('impDept').value;

function runImportParse(){
  const text = document.getElementById('impText').value.trim();
  if(!text){ toast('أضف نص الأسئلة أولاً'); return; }
  importParsed = parseBulkQuestions(text);
  const box = document.getElementById('impPreview');
  if(!importParsed.length){ box.innerHTML = '<div class="empty">'+icon('flag',26)+'<b>لم يتم التعرف على أي سؤال</b><p>راجع صيغة الملف الموضحة بالأسفل.</p></div>'; return; }
  const unansweredCount = importParsed.filter(function(qq){ return qq.correctIndex<0; }).length;
  const targetSubject = resolveImportTargetSubject();
  const existingKeys = new Set((targetSubject ? targetSubject.questions : []).map(function(q){ return normalizeQKey(q.text, q.options); }));
  const dupCount = importParsed.filter(function(qq){ return existingKeys.has(normalizeQKey(qq.text, qq.options)); }).length;

  const multiYear = document.getElementById('impIsPY').checked && document.getElementById('impMultiYear') && document.getElementById('impMultiYear').checked;
  let segLabels = null, segWarning = '';
  if(multiYear){
    const segments = readImportYearSegments();
    const total = segments.reduce(function(a,s){ return a+s.count; },0);
    segLabels = [];
    let segIdx = 0, segRemaining = segments.length ? segments[0].count : 0;
    importParsed.forEach(function(){
      if(!segments.length){ segLabels.push(null); return; }
      while(segRemaining<=0 && segIdx<segments.length-1){ segIdx++; segRemaining = segments[segIdx].count; }
      segLabels.push(segments[segIdx] && segments[segIdx].year ? (segments[segIdx].year+' • '+segments[segIdx].round) : null);
      segRemaining--;
    });
    if(total !== importParsed.length){
      segWarning = '<div class="hint" style="margin-bottom:8px;color:var(--danger);">⚠ مجموع عدد الأسئلة بكل الدفعات ('+total+') لا يساوي عدد الأسئلة المستوردة ('+importParsed.length+') — عدّل الأعداد بالأعلى قبل الاستيراد.</div>';
    }
  }

  box.innerHTML = '<div class="hint" style="margin-bottom:8px;">تم التعرف على '+importParsed.length+' سؤال'+(unansweredCount?(' — '+unansweredCount+' منها بلا إجابة محددة (ستُرفع وتقدر تحدد إجابتها لاحقًا من قائمة الأسئلة)'):'')+'. راجعها ثم اضغط استيراد (فُك التحديد عن أي سؤال غير صحيح).</div>'
    + (dupCount>0 ? ('<div class="hint" style="margin-bottom:8px;color:var(--danger);">⚠ '+dupCount+' سؤال يبدو موجودًا مسبقًا بنفس المادة (نفس النص والاختيارات) — تم إلغاء تحديدها تلقائيًا لتفادي التكرار، راجعها إذا كنت تقصد استيرادها فعلًا.</div>') : '')
    + segWarning
    + importParsed.map(function(qq,i){
      const isDup = existingKeys.has(normalizeQKey(qq.text, qq.options));
      const ansHtml = qq.correctIndex>=0
        ? ('الإجابة المكتشفة: '+esc(qq.options[qq.correctIndex]))
        : '<span class="badge badge-danger">بلا إجابة محددة — سيُرفع فارغًا</span>';
      const segTag = (segLabels && segLabels[i]) ? (' <span class="badge badge-accent">'+esc(segLabels[i])+'</span>') : (multiYear ? ' <span class="badge badge-danger">بلا دفعة</span>' : '');
      return '<div class="listcard" style="align-items:flex-start;flex-direction:column;gap:6px;">'
        + '<div class="checkline"><input type="checkbox" id="impChk_'+i+'" '+(isDup?'':'checked')+'/> <label for="impChk_'+i+'" dir="auto" style="font-weight:700;">'+esc(truncate(qq.text,60))+(isDup?' <span class="badge badge-danger">مكرر محتمل</span>':'')+segTag+'</label></div>'
        + '<div class="hint" style="padding-right:26px;">'+ansHtml+'</div>'
        + '</div>';
    }).join('')

}
function commitImport(){
  const subject = resolveImportTargetSubject();
  if(!subject){ toast(importFixedSubjectId ? 'تعذّر العثور على المادة' : 'اختر المادة أولاً'); return; }
  const topic = document.getElementById('impTopic').value.trim();
  const isPY = document.getElementById('impIsPY').checked;
  const multiYear = isPY && document.getElementById('impMultiYear') && document.getElementById('impMultiYear').checked;
  let year = '', round = '', segments = null;
  if(multiYear){
    segments = readImportYearSegments();
    if(!segments.length || segments.some(s=>!s.year || s.count<=0)){ toast('أكمل السنة وعدد الأسئلة لكل دفعة'); return; }
    const total = segments.reduce((a,s)=>a+s.count,0);
    if(total !== importParsed.length){ toast('مجموع عدد الأسئلة بكل الدفعات ('+total+') يجب أن يساوي عدد الأسئلة المستوردة ('+importParsed.length+')'); return; }
  } else if(isPY){
    year = document.getElementById('impYear').value.trim();
    round = document.getElementById('impRound').value;
  }
  const sourceName = document.getElementById('impSource').value.trim();
  const user = currentUser();
  let sourceId = null;
  if(sourceName && !isPY){
    let src = subject.sources.find(s=>s.name===sourceName);
    if(!src){ src = {id:uid(), name:sourceName}; subject.sources.push(src); }
    sourceId = src.id;
  }
  let count = 0, segIdx = 0, segRemaining = segments ? segments[0].count : 0;
  importParsed.forEach((qq,i)=>{
    let qYear = year, qRound = round;
    if(multiYear){
      while(segRemaining<=0 && segIdx<segments.length-1){ segIdx++; segRemaining = segments[segIdx].count; }
      qYear = segments[segIdx].year; qRound = segments[segIdx].round;
      segRemaining--;
    }
    const chk = document.getElementById('impChk_'+i);
    if(chk && chk.checked){
      subject.questions.push({
        id: uid(), text:qq.text, options:qq.options, correctIndex:qq.correctIndex,
        notes:'', topic, sourceId, isPreviousYear:isPY, year:qYear, round:qRound,
        showAuthor:false, authorName: user ? (user.fullName || user.name || '') : '',
        image:'', optionImages:[], ratings:{up:0,down:0}, createdAt:Date.now()
      });
      count++;
    }
  });
  if(count>0) syncBank(subject.id);
  importFixedSubjectId = null;
  saveDB(); closeModal(); toast('تم استيراد '+count+' سؤال بنجاح'); render();
}

  if(hasActive){
    const curTier = db.subscriptionTiers.find(t=>t.id===user.subscription.tierId);
    html += '<div class="card"><p class="hint" style="margin:0 0 10px;">عندك اشتراك فعّال حاليًا: <b style="color:var(--text);">'+esc(curTier?curTier.name:'—')+'</b> حتى '+new Date(user.subscription.expiresAt).toLocaleDateString('ar-EG')+'. اختر كيف تحب تفعّل الرمز الجديد:</p>'
      + '<button class="btn btn-primary" onclick="redeemCode(\''+code+'\',\'now\')">تفعيل فوري (إلغاء المتبقي من الحالي)</button>'
      + '<button class="btn btn-outline" style="margin-top:8px;" onclick="redeemCode(\''+code+'\',\'queue\')">تفعيل بعد انتهاء الاشتراك الحالي</button>'
      + '</div>';
  } else {
    html += '<button class="btn btn-primary" onclick="redeemCode(\''+code+'\',\'now\')">تفعيل الاشتراك الآن</button>';
  }
  html += '</div></div>';
  return html;
}
function redeemCode(code, mode){
  const user = currentUser();
  const codeRec = db.subscriptionCodes.find(c=>c.code===code);
  if(!codeRec || codeRec.revoked || codeRec.usedCount>=codeRec.maxUses || (codeRec.codeExpiresAt && codeRec.codeExpiresAt<Date.now())){ toast('تعذّر تفعيل الرمز'); go('/home'); return; }
  const tier = db.subscriptionTiers.find(t=>t.id===codeRec.tierId);
  if(!tier){ toast('الخطة غير موجودة'); go('/home'); return; }
  if(mode==='now'){
    user.subscription = { tierId: tier.id, activatedAt: Date.now(), expiresAt: Date.now() + codeRec.durationDays*86400000 };
    user.scheduledSubscription = null;
  } else {
    user.scheduledSubscription = { tierId: tier.id, durationDays: codeRec.durationDays };
  }
  codeRec.usedCount = (codeRec.usedCount||0)+1;
  codeRec.usedBy = codeRec.usedBy||[]; codeRec.usedBy.push({email:user.email, at:Date.now()});
  saveDB(); saveSession();
  toast(mode==='now' ? 'تم تفعيل الاشتراك بنجاح 🎉' : 'تمت جدولة الاشتراك — سيبدأ تلقائيًا بعد انتهاء اشتراكك الحالي');
  go('/settings');
}
function redeemManualCode(){
  const code = document.getElementById('manualCode').value.trim().toUpperCase();
  if(!code){ toast('أدخل الرمز'); return; }
  go('/activate', {code});
}
function openCreateStudentUsername(instId){
  const modal = '<div class="modaloverlay" onclick="if(event.target===this) closeModal()">'
    + '<div class="modalsheet"><h3>يوزر طالب جديد</h3>'
    + '<div class="field"><label>اسم اليوزر</label><input type="text" id="newStuUsername" placeholder="مثال: ali_2024"/></div>'
    + '<button class="btn btn-primary" type="button" onclick="createStudentUsername(\''+instId+'\')">إنشاء</button>'
    + '<button class="btn btn-ghost" type="button" style="margin-top:8px;" onclick="closeModal()">إلغاء</button>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);
}
function createStudentUsername(instId){
  const uname = document.getElementById('newStuUsername').value.trim();
  if(!uname){ toast('أدخل اسم يوزر'); return; }
  const taken = db.institutions.some(i=>(i.studentUsernames||[]).some(s=>s.username.toLowerCase()===uname.toLowerCase()))
    || Object.keys(session.profiles).some(k=>(session.profiles[k].username||'').toLowerCase()===uname.toLowerCase());
  if(taken){ toast('هذا اليوزر مستخدم بالفعل'); return; }
  const inst = db.institutions.find(i=>i.id===instId);
  const code = String(Math.floor(100000+Math.random()*900000));
  inst.studentUsernames.push({ username: uname, code, claimedBy:null });
  saveDB();
  const sheet = document.querySelector('.modalsheet');
  if(sheet){
    sheet.innerHTML = '<h3>تم الإنشاء ✅</h3><p class="hint" style="margin-bottom:14px;">زوّد الطالب بهذين المعرّفين للدخول من زر "الدخول بيوزر جامعة":</p>'
      + '<div class="card" style="margin-bottom:14px;"><div class="hint">اليوزر</div><b style="font-size:16px;">'+esc(uname)+'</b><div class="hint" style="margin-top:10px;">رمز الدخول</div><b style="font-size:16px;">'+code+'</b></div>'
      + '<button class="btn btn-primary" type="button" onclick="closeModal();render();">تم</button>';
  }
}
function deleteStudentUsername(instId, username){
  if(!confirm('حذف هذا اليوزر؟ لن يتمكن صاحبه من الدخول بعد الآن.')) return;
  pushUndo();
  const inst = db.institutions.find(i=>i.id===instId);
  inst.studentUsernames = (inst.studentUsernames||[]).filter(s=>s.username!==username);
  saveDB(); toast('تم الحذف'); render();
}

function institutionEngagementBlock(){
  if(!hasFeature('ownerAnalytics') || usersFetchStatus!=='loaded' || !db.institutions.length) return '';
  const users = (allUsersCache||[]).filter(u=>u.profileComplete);
  const activeCutoff = Date.now() - 30*86400000;
  const rows = db.institutions.map(function(inst){
    const studs = users.filter(u=>u.institutionId===inst.id);
    const active = studs.filter(u=>u.lastSeenAt && u.lastSeenAt>activeCutoff).length;
    const quizzes = studs.reduce(function(sum,u){ return sum+((u.resultHistory||[]).length); },0);
    const uni = db.universities.find(x=>x.id===inst.universityId);
    return { name: inst.brandName||(uni?uni.name:inst.adminEmail), students: studs.length, active, quizzes };
  }).sort(function(a,b){ return b.students-a.students; });
  if(!rows.length) return '';
  return '<div class="sectiontitle"><h2>تفاعل الطلاب حسب المؤسسة</h2></div>' + rows.map(function(r){
    return '<div class="listcard"><div><b style="font-size:13px;">'+esc(r.name)+'</b><br><span class="hint">'+r.students+' طالب • '+r.active+' نشط (٣٠ يوم) • '+r.quizzes+' اختبارًا مكتملاً</span></div></div>';
  }).join('');
}
function subjectEngagementBlock(){
  if(!hasFeature('ownerAnalytics')) return '';
  const usage = db.stats.subjectUsage||{};
  const pairs = Object.entries(usage).sort(function(a,b){ return b[1]-a[1]; }).slice(0,15);
  if(!pairs.length) return '';
  return '<div class="sectiontitle"><h2>الأكثر تفاعلاً بين المواد</h2></div>' + pairs.map(function(p){
    const s = findSubject(p[0]);
    return '<div class="listcard"><b style="font-size:13px;">'+esc(s?s.name:'—')+'</b><span class="hint">'+p[1]+' اختبار</span></div>';
  }).join('');
}
function adminStatsTab(){
  if(!db.features.statistics){
    return '<div class="empty">'+icon('bar',28)+'<b>الإحصائيات معطّلة حاليًا</b><p>فعّلها من تبويب "الميزات" لعرضها من جديد.</p></div>';
  }
  let qCount=0, reportCount=0;
  db.universities.forEach(u=>u.colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(sg=>sg.subjects.forEach(s=>{
    qCount += s.questions.length; reportCount += s.questions.filter(q=>isReported(q)).length;
  })))));

  let topSubject = '—';
  const usage = db.stats.subjectUsage||{};
  const topSubjId = Object.keys(usage).sort((a,b)=>usage[b]-usage[a])[0];
  if(topSubjId){ const s=findSubject(topSubjId); if(s) topSubject = s.name; }

  let topSource = '—';
  const srcUsage = db.stats.sourceUsage||{};
  const topSrcId = Object.keys(srcUsage).sort((a,b)=>srcUsage[b]-srcUsage[a])[0];
  if(topSrcId){
    outer: for(const u of db.universities) for(const c of u.colleges) for(const d of c.departments) for(const sg of d.stages) for(const s of sg.subjects){
      const src = s.sources.find(x=>x.id===topSrcId);
      if(src){ topSource = src.name; break outer; }
    }
  }

  if(usersFetchStatus==='idle') fetchAllUsers();

  function topPairs(obj){ return Object.entries(obj).sort((a,b)=>b[1]-a[1]); }
  function listBlock(title, obj, unit){
    const pairs = topPairs(obj).slice(0,6);
    if(!pairs.length) return '';
    return '<div class="sectiontitle"><h2>'+title+'</h2></div>' + pairs.map(function(p){
      return '<div class="listcard"><b style="font-size:13px;">'+esc(p[0])+'</b><span class="hint">'+p[1]+' '+unit+'</span></div>';
    }).join('');
  }

  let userStatsHtml = skeletonRows(3);
  if(usersFetchStatus==='error'){
    userStatsHtml = '<div class="empty">'+icon('flag',24)+'<b>تعذّر تحميل بيانات المستخدمين</b></div><button type="button" class="btn btn-outline btn-sm" onclick="fetchAllUsers(true);render()">إعادة المحاولة</button>';
  } else if(usersFetchStatus==='loaded'){
    const users = (allUsersCache||[]).filter(u=>u.profileComplete);
    const activeCutoff = Date.now() - 30*86400000;
    const activeUsers = users.filter(u=>u.lastSeenAt && u.lastSeenAt>activeCutoff).length;

    const byGov = {}, byUni = {}, byCollege = {}, byDep = {}, byStage = {};
    users.forEach(function(u){
      if(u.governorate) byGov[u.governorate] = (byGov[u.governorate]||0)+1;
      const uni = db.universities.find(x=>x.id===u.universityId);
      if(uni) byUni[uni.name] = (byUni[uni.name]||0)+1;
      const college = uni && uni.colleges.find(c=>c.id===u.collegeId);
      if(college) byCollege[college.name] = (byCollege[college.name]||0)+1;
      const dep = college && college.departments.find(d=>d.id===u.departmentId);
      if(dep) byDep[dep.name] = (byDep[dep.name]||0)+1;
      const stage = dep && dep.stages.find(s=>s.id===u.stageId);
      if(stage) byStage[stage.name] = (byStage[stage.name]||0)+1;
    });

    const writerCounts = {};
    db.universities.forEach(u=>u.colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(sg=>sg.subjects.forEach(s=>{
      s.questions.forEach(function(q){ if(q.authorName) writerCounts[q.authorName] = (writerCounts[q.authorName]||0)+1; });
    })))));

    userStatsHtml = '<div class="statgrid">'
      + '<div class="statbox"><b>'+users.length+'</b><span>إجمالي المستخدمين</span></div>'
      + '<div class="statbox"><b>'+activeUsers+'</b><span>نشطون آخر ٣٠ يوم</span></div>'
      + '</div>'
      + listBlock('المستخدمون حسب الجامعة', byUni, 'مستخدم')
      + listBlock('المستخدمون حسب الكلية', byCollege, 'مستخدم')
      + listBlock('المستخدمون حسب القسم', byDep, 'مستخدم')
      + listBlock('المستخدمون حسب المرحلة', byStage, 'مستخدم')
      + listBlock('المستخدمون حسب المحافظة', byGov, 'مستخدم')
      + listBlock('مساهمة الكُتّاب', writerCounts, 'سؤال')
      + institutionEngagementBlock()
      + '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="fetchAllUsers(true);render()">تحديث بيانات المستخدمين</button>';
  }

  return '<div class="statgrid">'
    + '<div class="statbox"><b>'+qCount+'</b><span>إجمالي الأسئلة</span></div>'
    + '<div class="statbox"><b>'+reportCount+'</b><span>بلاغات مفتوحة</span></div>'
    + '<div class="statbox"><b>'+(db.stats.quizzesCompleted||0)+'</b><span>اختبارات مكتملة</span></div>'
    + '<div class="statbox"><b style="font-size:13.5px;">'+esc(topSubject)+'</b><span>المادة الأكثر استخدامًا</span></div>'
    + '<div class="statbox" style="grid-column:1/-1;"><b style="font-size:13.5px;">'+esc(topSource)+'</b><span>المصدر الأكثر استخدامًا</span></div>'
    + '</div>'
    + subjectEngagementBlock()
    + userStatsHtml
    + '<div class="card" style="margin-top:14px;"><b style="font-size:13.5px;">نسخة احتياطية / نقل البيانات لجهاز آخر</b>'
    + '<p class="hint" style="margin:6px 0 10px;">صدّر كل بيانات المنصة كملف JSON واحد، أو استورد ملفًا سابقًا.</p>'
    + '<div class="btnrow"><button class="btn btn-outline btn-sm" onclick="exportBackup()">'+icon('bar',14)+' تصدير نسخة (JSON)</button>'
    + '<label class="btn btn-ghost btn-sm" style="cursor:pointer;">استيراد ملف<input type="file" accept="application/json" onchange="importBackup(event)" style="display:none;"/></label></div></div>';
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mcq-study-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('تم تنزيل النسخة الاحتياطية');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  if(!confirm('سيتم استبدال كل بيانات المنصة الحالية بمحتوى هذا الملف. متابعة؟')){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.universities){ toast('ملف غير صالح'); return; }
      pushUndo();
      db = parsed;
      migrateDB(db);
      saveDB(); toast('تم استيراد النسخة الاحتياطية بنجاح'); render();
    }catch(err){ toast('تعذّرت قراءة الملف — تأكد أنه ملف JSON صالح'); }
  };
  reader.readAsText(file, 'utf-8');
}

/* ==========================================================
   SETTINGS
   ========================================================== */
function renderSettings(user){
  const currentTheme = loadTheme();
  let html = '<div class="screen">' + pagehead('الإعدادات', '/home')
    + '<div class="content" style="padding-top:0;">';

  const availableThemes = THEME_DEFS.filter(t=>t.feature===null || hasFeature(t.feature));
  if(availableThemes.length){
    const swatches = availableThemes.map(function(t){
      const active = currentTheme===t.key;
      return '<button type="button" onclick="setTheme(\''+t.key+'\')" style="display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;padding:2px;">'
        + '<span style="width:38px;height:38px;border-radius:50%;display:block;background:linear-gradient(135deg,'+t.swatchBg+' 50%,'+t.swatchAccent+' 50%);border:'+(active?'3px solid var(--accent)':'3px solid var(--border)')+';box-shadow:var(--shadow);"></span>'
        + '<span style="font-size:11px;color:'+(active?'var(--text)':'var(--text-muted)')+';font-weight:'+(active?'700':'500')+';">'+t.label+'</span>'
        + '</button>';
    }).join('');
    html += '<div class="card"><b style="font-size:14px;">المظهر</b><div class="hint" style="margin-bottom:12px;">اختر شكل ألوان التطبيق</div>'
      + '<div style="display:flex;gap:16px;flex-wrap:wrap;">'+swatches+'</div>'
      + '</div>';
  }

  if(hasFeature('quizDuel') && user.role==='student'){
    html += '<div class="card"><b style="font-size:14px;">هويتك في المبارزات</b><div class="hint" style="margin-bottom:10px;">اختر كيف يظهر اسمك للآخرين في المبارزات وقائمة المتصدرين.</div>'
      + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;"><span style="font-size:13.5px;">استخدام اسم مستعار</span><button class="switch'+(user.duelUseNickname?' on':'')+'" onclick="toggleDuelNickname()"></button></div>'
      + (user.duelUseNickname ? ('<div class="field"><label>الاسم المستعار</label><input type="text" id="duelNicknameInput" value="'+esc(user.duelNickname||'')+'" placeholder="مثال: النسر الذهبي"/></div><button class="btn btn-outline btn-sm" onclick="saveDuelNickname()">حفظ الاسم</button>') : '')
      + '</div>';
  }

  if(hasFeature('referral') && db.referralSettings && db.referralSettings.enabled && user.role==='student'){
    const withinWindow = (Date.now() - (user.createdAt||0)) <= 24*3600*1000;
    html += '<div class="card"><b style="font-size:14px;">ادعُ صديقًا</b><div class="hint" style="margin-bottom:10px;">شارك كودك مع صديقك — يحصل كل منكما على مكافأة عند تفعيله.</div>'
      + '<div style="display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:10px;"><b style="font-size:16px;letter-spacing:2px;flex:1;">'+esc(user.referralCode||'')+'</b><button type="button" class="btn btn-outline btn-sm" onclick="navigator.clipboard.writeText(\''+esc(user.referralCode||'')+'\');toast(\'تم نسخ الكود\');">نسخ</button></div>';
    if(user.referredBy){
      html += '<div class="hint">فعّلت رمز إحالة صديق مسبقًا ✓</div>';
    } else if(withinWindow){
      html += '<div class="field"><label>عندك كود من صديق؟ فعّله الآن (متاح خلال 24 ساعة من التسجيل فقط)</label><input type="text" id="referralCodeInput" placeholder="مثال: AB12CD" style="text-transform:uppercase;"/></div>'
        + '<button type="button" class="btn btn-primary btn-sm" onclick="claimReferralCode()">تفعيل الكود</button>';
    } else {
      html += '<div class="hint">انتهت مهلة تفعيل كود صديق (24 ساعة من التسجيل)</div>';
    }
    html += '</div>';
  }

  html += '<a href="#/profile" class="navrow"><div class="main"><b>تعديل الملف الشخصي</b><span>الاسم، اليوزر، الجامعة، الكلية، القسم، المرحلة</span></div>'+icon('chevL',18)+'</a>';
  if(hasFeature('favorites')) html += '<a href="#/favorites" class="navrow"><div class="main"><b>المفضلة</b><span>الأسئلة التي حفظتها للمراجعة</span></div>'+icon('chevL',18)+'</a>';
  if(hasFeature('savedResults')) html += '<a href="#/history" class="navrow"><div class="main"><b>سجل نتائجي</b><span>تتبّع تقدمك عبر الوقت</span></div>'+icon('chevL',18)+'</a>';

  if(user.role==='student' && !user.institutionId){
    const tier = activeTierOf(user);
    html += '<div class="card"><b style="font-size:14px;">اشتراكي</b>';
    if(tier){
      html += '<div class="hint" style="margin-top:6px;">الخطة: '+esc(tier.name)+'<br>حتى: '+new Date(user.subscription.expiresAt).toLocaleDateString('ar-EG')+'</div>';
      if(user.scheduledSubscription){
        const schTier = db.subscriptionTiers.find(t=>t.id===user.scheduledSubscription.tierId);
        html += '<div class="badge badge-accent" style="margin-top:8px;">التالي: '+esc(schTier?schTier.name:'—')+' ('+user.scheduledSubscription.durationDays+' يوم) بعد الانتهاء</div>';
      }
    } else {
      html += '<div class="hint" style="margin-top:6px;">لا يوجد اشتراك فعّال حاليًا</div>';
    }
    html += '<div class="field" style="margin-top:10px;margin-bottom:8px;"><label>لديك رمز تفعيل؟</label><input type="text" id="manualCode" placeholder="اكتب الرمز هنا" style="text-transform:uppercase;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;width:100%;"/></div>'
      + '<button class="btn btn-outline btn-sm" onclick="redeemManualCode()">تفعيل الرمز</button>'
      + '</div>';
  }

  html += '<div class="card"><b style="font-size:14px;">بيانات الحساب</b>';
  if(user.role==='owner'){
    html += '<div class="hint" style="margin-top:6px;">مالك المنصة</div>';
  } else {
    html += '<div class="hint" style="margin-top:6px;">'+esc(user.username?('@'+user.username):user.name)+'</div>';
  }
  html += '</div>';

  html += '<button class="btn btn-outline" onclick="logout()">'+icon('logout',16)+' تسجيل الخروج</button>'
    + '<button class="btn btn-ghost" onclick="if(confirm(\'سيتم حذف كل البيانات التجريبية المحلية وإعادة التطبيق لحالته الأولى. متابعة؟\')) resetAppData()">إعادة تعيين بيانات التطبيق</button>'
    + '</div></div>';
  return html;
}
function setTheme(name){
  if(!themeAllowed(name)) return;
  localStorage.setItem(THEME_KEY, name);
  applyTheme();
  render();
}
function resetAppData(){
  localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY);
  location.hash = '#/login'; location.reload();
}

function syncAllPrivileges(){
  if(!fbAuth.currentUser) return;
  db.writers.forEach(w=>grantPrivilege(w.email));
  db.institutions.forEach(i=>grantPrivilege(i.adminEmail));
}
/* ---------- boot ---------- */
let authBooted = false;
fbAuth.onAuthStateChanged(function(fbUser){
  if(fbUser){
    startFirestoreSync();
    startDuelsSync();
    if(fbUser.email && !session.currentEmail){
      chooseAccount(fbUser.email, fbUser.displayName || fbUser.email.split('@')[0]);
    }
    if(fbUser.email === OWNER_EMAIL){ setTimeout(syncAllPrivileges, 1500); }
  }
  if(!authBooted){ authBooted = true; render(); }
});
