    return '<div class="sectiontitle"><h2>'+title+'</h2></div>' + pairs.map(function(p){
      return '<div class="listcard"><b style="font-size:13px;">'+esc(p[0])+'</b><span class="hint">'+p[1]+' '+unit+'</span></div>';
    }).join('');
  }

  let userStatsHtml = '<div class="empty">'+icon('users',24)+'<b>جاري تحميل بيانات المستخدمين...</b></div>';
  if(usersFetchStatus==='error'){
    userStatsHtml = '<div class="empty">'+icon('flag',24)+'<b>تعذّر تحميل بيانات المستخدمين</b></div><button type="button" class="btn btn-outline btn-sm" onclick="fetchAllUsers(true);render()">إعادة المحاولة</button>';
  } else if(usersFetchStatus==='loaded'){
    const users = (allUsersCache||[]).filter(u=>u.profileComplete);
    const activeCutoff = Date.now() - 30*86400000;
    const activeUsers = users.filter(u=>u.lastSeenAt && u.lastSeenAt>activeCutoff).length;

    const byGov = {}, byUni = {}, byCollege = {}, byDep = {}, byStage = {};
    users.forEach(function(u){
      if(u.governorate) byGov[u.governorate] = (byGov[u.governorate]||0)+1;
      const uni = db.universities.find(x=>x.id===u.universityId);
      if(uni) byUni[uni.name] = (byUni[uni.name]||0)+1;
      const college = uni && uni.colleges.find(c=>c.id===u.collegeId);
      if(college) byCollege[college.name] = (byCollege[college.name]||0)+1;
      const dep = college && college.departments.find(d=>d.id===u.departmentId);
      if(dep) byDep[dep.name] = (byDep[dep.name]||0)+1;
      const stage = dep && dep.stages.find(s=>s.id===u.stageId);
      if(stage) byStage[stage.name] = (byStage[stage.name]||0)+1;
    });

    const writerCounts = {};
    db.universities.forEach(u=>u.colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(sg=>sg.subjects.forEach(s=>{
      s.questions.forEach(function(q){ if(q.authorName) writerCounts[q.authorName] = (writerCounts[q.authorName]||0)+1; });
    })))));

    userStatsHtml = '<div class="statgrid">'
      + '<div class="statbox"><b>'+users.length+'</b><span>إجمالي المستخدمين</span></div>'
      + '<div class="statbox"><b>'+activeUsers+'</b><span>نشطون آخر ٣٠ يوم</span></div>'
      + '</div>'
      + listBlock('المستخدمون حسب الجامعة', byUni, 'مستخدم')
      + listBlock('المستخدمون حسب الكلية', byCollege, 'مستخدم')
      + listBlock('المستخدمون حسب القسم', byDep, 'مستخدم')
      + listBlock('المستخدمون حسب المرحلة', byStage, 'مستخدم')
      + listBlock('المستخدمون حسب المحافظة', byGov, 'مستخدم')
      + listBlock('مساهمة الكُتّاب', writerCounts, 'سؤال')
      + '<button type="button" class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="fetchAllUsers(true);render()">تحديث بيانات المستخدمين</button>';
  }

  return '<div class="statgrid">'
    + '<div class="statbox"><b>'+qCount+'</b><span>إجمالي الأسئلة</span></div>'
    + '<div class="statbox"><b>'+reportCount+'</b><span>بلاغات مفتوحة</span></div>'
    + '<div class="statbox"><b>'+(db.stats.quizzesCompleted||0)+'</b><span>اختبارات مكتملة</span></div>'
    + '<div class="statbox"><b style="font-size:13.5px;">'+esc(topSubject)+'</b><span>المادة الأكثر استخدامًا</span></div>'
    + '<div class="statbox" style="grid-column:1/-1;"><b style="font-size:13.5px;">'+esc(topSource)+'</b><span>المصدر الأكثر استخدامًا</span></div>'
    + '</div>'
    + userStatsHtml
    + '<div class="card" style="margin-top:14px;"><b style="font-size:13.5px;">نسخة احتياطية / نقل البيانات لجهاز آخر</b>'
    + '<p class="hint" style="margin:6px 0 10px;">صدّر كل بيانات المنصة كملف JSON واحد، أو استورد ملفًا سابقًا.</p>'
    + '<div class="btnrow"><button class="btn btn-outline btn-sm" onclick="exportBackup()">'+icon('bar',14)+' تصدير نسخة (JSON)</button>'
    + '<label class="btn btn-ghost btn-sm" style="cursor:pointer;">استيراد ملف<input type="file" accept="application/json" onchange="importBackup(event)" style="display:none;"/></label></div></div>';
}
function exportBackup(){
  const blob = new Blob([JSON.stringify(db, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'mcq-study-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  toast('تم تنزيل النسخة الاحتياطية');
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  if(!confirm('سيتم استبدال كل بيانات المنصة الحالية بمحتوى هذا الملف. متابعة؟')){ e.target.value=''; return; }
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const parsed = JSON.parse(reader.result);
      if(!parsed.universities){ toast('ملف غير صالح'); return; }
      pushUndo();
      db = parsed;
      migrateDB(db);
      saveDB(); toast('تم استيراد النسخة الاحتياطية بنجاح'); render();
    }catch(err){ toast('تعذّرت قراءة الملف — تأكد أنه ملف JSON صالح'); }
  };
  reader.readAsText(file, 'utf-8');
}

/* ==========================================================
   SETTINGS
   ========================================================== */
function renderSettings(user){
  const isLight = loadTheme()==='light';
  let html = '<div class="screen">' + pagehead('الإعدادات', '/home')
    + '<div class="content" style="padding-top:0;">';

  if(hasFeature('darkMode')){
    html += '<div class="card">'
      + '<div style="display:flex;justify-content:space-between;align-items:center;">'
      + '<div><b style="font-size:14px;">الوضع النهاري/الليلي</b><div class="hint">'+(isLight?'الوضع النهاري مفعّل':'الوضع الليلي مفعّل')+'</div></div>'
      + '<button class="switch'+(isLight?' on':'')+'" onclick="toggleTheme()"></button>'
      + '</div></div>';
  }

  html += '<a href="#/profile" class="navrow"><div class="main"><b>تعديل الملف الشخصي</b><span>الاسم، اليوزر، الجامعة، الكلية، القسم، المرحلة</span></div>'+icon('chevL',18)+'</a>';
  if(hasFeature('favorites')) html += '<a href="#/favorites" class="navrow"><div class="main"><b>المفضلة</b><span>الأسئلة التي حفظتها للمراجعة</span></div>'+icon('chevL',18)+'</a>';
  if(hasFeature('savedResults')) html += '<a href="#/history" class="navrow"><div class="main"><b>سجل نتائجي</b><span>تتبّع تقدمك عبر الوقت</span></div>'+icon('chevL',18)+'</a>';

  if(user.role==='student' && !user.institutionId){
    const tier = activeTierOf(user);
    html += '<div class="card"><b style="font-size:14px;">اشتراكي</b>';
    if(tier){
      html += '<div class="hint" style="margin-top:6px;">الخطة: '+esc(tier.name)+'<br>حتى: '+new Date(user.subscription.expiresAt).toLocaleDateString('ar-EG')+'</div>';
      if(user.scheduledSubscription){
        const schTier = db.subscriptionTiers.find(t=>t.id===user.scheduledSubscription.tierId);
        html += '<div class="badge badge-accent" style="margin-top:8px;">التالي: '+esc(schTier?schTier.name:'—')+' ('+user.scheduledSubscription.durationDays+' يوم) بعد الانتهاء</div>';
      }
    } else {
      html += '<div class="hint" style="margin-top:6px;">لا يوجد اشتراك فعّال حاليًا</div>';
    }
    html += '<div class="field" style="margin-top:10px;margin-bottom:8px;"><label>لديك رمز تفعيل؟</label><input type="text" id="manualCode" placeholder="اكتب الرمز هنا" style="text-transform:uppercase;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px;width:100%;"/></div>'
      + '<button class="btn btn-outline btn-sm" onclick="redeemManualCode()">تفعيل الرمز</button>'
      + '</div>';
  }

  html += '<div class="card"><b style="font-size:14px;">بيانات الحساب</b>';
  if(user.role==='owner'){
    html += '<div class="hint" style="margin-top:6px;">مالك المنصة</div>';
  } else {
    html += '<div class="hint" style="margin-top:6px;">'+esc(user.username?('@'+user.username):user.name)+'</div>';
  }
  html += '</div>';

  html += '<button class="btn btn-outline" onclick="logout()">'+icon('logout',16)+' تسجيل الخروج</button>'
    + '<button class="btn btn-ghost" onclick="if(confirm(\'سيتم حذف كل البيانات التجريبية المحلية وإعادة التطبيق لحالته الأولى. متابعة؟\')) resetAppData()">إعادة تعيين بيانات التطبيق</button>'
    + '</div></div>';
  return html;
}
function toggleTheme(){
  const next = loadTheme()==='light' ? 'dark' : 'light';
  localStorage.setItem(THEME_KEY, next);
  applyTheme();
  render();
}
function resetAppData(){
  localStorage.removeItem(DB_KEY); localStorage.removeItem(SESSION_KEY);
  location.hash = '#/login'; location.reload();
}

function syncAllPrivileges(){
  if(!fbAuth.currentUser) return;
  db.writers.forEach(w=>grantPrivilege(w.email));
  db.institutions.forEach(i=>grantPrivilege(i.adminEmail));
}
/* ---------- boot ---------- */
let authBooted = false;
fbAuth.onAuthStateChanged(function(fbUser){
  if(fbUser){
    startFirestoreSync();
    if(fbUser.email && !session.currentEmail){
      chooseAccount(fbUser.email, fbUser.displayName || fbUser.email.split('@')[0]);
    }
    if(fbUser.email === OWNER_EMAIL){ setTimeout(syncAllPrivileges, 1500); }
  }
  if(!authBooted){ authBooted = true; render(); }
});
</script>
