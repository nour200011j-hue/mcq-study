<style>
  :root{
    --bg:#0F1729; --surface:#17213B; --surface-2:#1E2A4A; --surface-3:#26335A;
    --border:#2A3655; --text:#EDEFF5; --text-muted:#8B96B3;
    --accent:#F2B84B; --accent-ink:#3A2E0E; --accent-soft:#3A331C;
    --success:#34C77B; --success-soft:#173427; --danger:#E5584D; --danger-soft:#3A1F1E;
    --radius:16px; --radius-sm:10px;
    --font-display:'Cairo',system-ui,sans-serif; --font-body:'Tajawal',system-ui,sans-serif;
    --shadow:0 10px 30px -12px rgba(0,0,0,.5);
    --maxw:520px;
  }
  [data-theme="light"]{
    --bg:#FBF9F4; --surface:#FFFFFF; --surface-2:#F4F1E8; --surface-3:#ECE7D8;
    --border:#E4DFCF; --text:#20263A; --text-muted:#6B7288;
    --accent:#C9861F; --accent-ink:#FFF7E6; --accent-soft:#FBEBCB;
    --success:#1E9E5A; --success-soft:#E4F7ED; --danger:#D93B3F; --danger-soft:#FBE7E6;
    --shadow:0 10px 26px -14px rgba(30,25,10,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{min-height:100vh;-webkit-font-smoothing:antialiased;}
  #app{max-width:var(--maxw);margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--bg);}
  h1,h2,h3,.disp{font-family:var(--font-display);}
  a{color:inherit;}
  button{font-family:var(--font-body);cursor:pointer;}
  input,select,textarea{font-family:var(--font-body);}
  ::selection{background:var(--accent);color:var(--accent-ink);}
  @media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important;}}

  .screen{flex:1;display:flex;flex-direction:column;animation:riseIn .32s ease both;padding-bottom:90px;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ---- top bar ---- */
  .topbar{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:18px 18px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .brandmark{display:flex;align-items:center;gap:10px;}
  .brandmark .logo{width:36px;height:36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:16px;flex:none;}
  .brandmark .t{line-height:1.15;}
  .brandmark .t b{font-family:var(--font-display);font-size:15px;}

/* ---------- Persistence ---------- */
let db = loadDB();
let session = loadSession();
let firestoreSyncStarted = false;
function startFirestoreSync(){
  if(firestoreSyncStarted) return;
  firestoreSyncStarted = true;
  dbFS.collection('platform').doc('main').onSnapshot(function(doc){
    if(doc.exists){
      db = doc.data();
      migrateDB(db);
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      render();
    } else {
      dbFS.collection('platform').doc('main').set(db).catch(function(err){
        console.error('Firestore init failed', err);
        toast('تعذّر إنشاء قاعدة البيانات السحابية');
      });
    }
  }, function(err){
    console.error('Firestore listen error', err);
    toast('تعذّر الاتصال بقاعدة البيانات السحابية — يعمل التطبيق بالنسخة المحلية حاليًا');
  });
}
function loadDB(){
  let d;
  try{ const raw = localStorage.getItem(DB_KEY); d = raw ? JSON.parse(raw) : null; }catch(e){ d = null; }
  if(!d){ d = seedDB(); }
  migrateDB(d);
  localStorage.setItem(DB_KEY, JSON.stringify(d));
  return d;
}
function migrateDB(d){
  if(!d.features) d.features = defaultFeatures();
  else FEATURE_DEFS.forEach(f=>{ if(!(f.key in d.features)) d.features[f.key] = true; });
  if(!d.ads) d.ads = [];
  if(!d.adSettings) d.adSettings = { maxViewsPerUser: 3 };
  if(!d.institutions) d.institutions = [];
  d.institutions.forEach(i=>{ if(!i.studentFeatures) i.studentFeatures = {}; if(!i.studentUsernames) i.studentUsernames = []; });
  if(!d.writers) d.writers = [];
  d.writers = d.writers.map(w => typeof w === 'string' ? {email:w, restrictToOwnDept:false} : w);
  if(!d.stats) d.stats = { quizzesCompleted:0, subjectUsage:{}, sourceUsage:{} };
  if(!d.reportedQuestions) d.reportedQuestions = {};
  if(!d.subscriptionTiers) d.subscriptionTiers = [];
  if(!d.subscriptionCodes) d.subscriptionCodes = [];
  (d.universities||[]).forEach(u=>u.colleges.forEach(c=>c.departments.forEach(dp=>dp.stages.forEach(sg=>sg.subjects.forEach(s=>{
    s.questions.forEach(qq=>{
      if(qq.image===undefined) qq.image='';
      if(!qq.optionImages) qq.optionImages=[];
      if(!qq.ratings) qq.ratings={up:0,down:0};
      if(!qq.createdAt) qq.createdAt = 0;
      if(qq.reported){ d.reportedQuestions[qq.id] = qq.reported; delete qq.reported; }
    });
  })))));
}
function isReported(q){ return !!(db.reportedQuestions && db.reportedQuestions[q.id]); }
function getReport(q){ return (db.reportedQuestions && db.reportedQuestions[q.id]) || null; }
function setReport(q, reportObj){ if(!db.reportedQuestions) db.reportedQuestions = {}; db.reportedQuestions[q.id] = reportObj; }
function removeReportFlag(q){ if(db.reportedQuestions) delete db.reportedQuestions[q.id]; }
let saveDBTimer = null;
function saveDB(){
  try{
    localStorage.setItem(DB_KEY, JSON.stringify(db));
  }catch(err){

    toast('التخزين المحلي بالجهاز ممتلئ — يتم الاعتماد على الحفظ السحابي فقط الآن');

    });

function loadSession(){ try{ const raw = localStorage.getItem(SESSION_KEY); if(raw) return JSON.parse(raw); }catch(e){} return { profiles:{}, currentEmail:null }; }
let saveSessionTimer = null;
function saveSession(){
  try{
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }catch(err){
    console.error('localStorage session save failed', err);
  }
  if(!fbAuth.currentUser || !session.currentEmail) return;
  const email = session.currentEmail;
  const profile = session.profiles[email];
  if(!profile) return;
  clearTimeout(saveSessionTimer);

function currentUser(){ return session.currentEmail ? session.profiles[session.currentEmail] : null; }
function roleFor(email){
  if(email===OWNER_EMAIL) return 'owner';
  if(db.institutions.some(i=>i.adminEmail===email)) return 'institutionAdmin';
  if(db.writers.some(w=>w.email===email)) return 'writer';
  return 'student';
}
function writerRecord(email){ return db.writers.find(w=>w.email===email) || null; }
function refreshSubscription(user){
  if(!user) return;
  const now = Date.now();
  if(user.scheduledSubscription && (!user.subscription || user.subscription.expiresAt<=now)){
    const sch = user.scheduledSubscription;
    user.subscription = { tierId: sch.tierId, activatedAt: now, expiresAt: now + sch.durationDays*86400000 };
    user.scheduledSubscription = null;
    saveSession();
  }
}
function activeTierOf(user){
  if(!user || !user.subscription) return null;
  if(user.subscription.expiresAt<=Date.now()) return null;
  return db.subscriptionTiers.find(t=>t.id===user.subscription.tierId) || null;
}
function hasFeature(key){
  const u = currentUser();
  if(u && (u.role==='owner' || u.role==='writer' || u.role==='institutionAdmin')) return true;
  if(u && u.institutionId){
    const inst = db.institutions.find(i=>i.id===u.institutionId);
    if(inst && inst.studentFeatures && Object.prototype.hasOwnProperty.call(inst.studentFeatures, key)) return !!inst.studentFeatures[key];
    return !!(db.features && db.features[key]);
  }
  if(!(db.features && db.features[key])) return false;
  if(u && SUBSCRIPTION_GATED_KEYS.includes(key)){
    const tier = activeTierOf(u);
    return !!(tier && tier.features && tier.features[key]);
  }
  return true;
}

/* ---------- Undo/Redo (owner only, snapshot-based, in-memory for this session) ---------- */
let undoStack = [];
let redoStack = [];
function pushUndo(){ undoStack.push(JSON.stringify(db)); if(undoStack.length>10) undoStack.shift(); redoStack = []; }
function undoLast(){
  if(!undoStack.length){ toast('لا يوجد ما يمكن التراجع عنه'); return; }
  redoStack.push(JSON.stringify(db)); if(redoStack.length>10) redoStack.shift();
  db = JSON.parse(undoStack.pop());
  saveDB(); toast('تم التراجع عن آخر إجراء'); render();
}
function redoLast(){
  if(!redoStack.length){ toast('لا يوجد ما يمكن إعادته'); return; }
  undoStack.push(JSON.stringify(db)); if(undoStack.length>10) undoStack.shift();
  db = JSON.parse(redoStack.pop());
  saveDB(); toast('تمت إعادة الإجراء'); render();
}

/* ---------- Router ---------- */
function parseHash(){
  const raw = location.hash.slice(1) || '/login';
  const [route, qs] = raw.split('?');
  const params = {}; if(qs) qs.split('&').forEach(p=>{ const [k,v]=p.split('='); params[decodeURIComponent(k)] = decodeURIComponent(v||''); });
  return { route: route || '/login', params };
}
function go(route, params){
  const qs = params ? Object.keys(params).filter(k=>params[k]!==undefined && params[k]!==null && params[k]!=='').map(k=>encodeURIComponent(k)+'='+encodeURIComponent(params[k])).join('&') : '';
  location.hash = '#' + route + (qs ? '?' + qs : '');
}
function navTo(href){ location.hash = href; }
window.addEventListener('hashchange', render);

function render(){
  const { route, params } = parseHash();
  const user = currentUser();
  if(user) user.role = roleFor(user.email);
  if(user && !user.institutionId && user.role==='student') refreshSubscription(user);

  if(route === '/activate' && params.code && !user){ localStorage.setItem(PENDING_CODE_KEY, params.code); }

  if(!user && route !== '/login' && route !== '/activate'){ go('/login'); return; }
  if(user && !user.profileComplete && route !== '/profile'){ go('/profile'); return; }
  if(user && user.profileComplete && route === '/login'){ go('/home'); return; }

  const pendingCode = localStorage.getItem(PENDING_CODE_KEY);
  if(pendingCode && user && user.profileComplete && !user.institutionId && route !== '/activate'){
    localStorage.removeItem(PENDING_CODE_KEY);
    go('/activate', {code: pendingCode});
    return;
  }

  let html = '';
  let bare = false;
  if(route === '/login'){ html = renderLogin(); bare = true; }
  else if(route === '/profile'){ html = renderProfileForm(user); bare = true; }
  else if(route === '/home'){ html = renderHome(user); }
  else if(route === '/browse'){ html = renderBrowse(user, params, false); }
  else if(route === '/admin'){ html = renderAdmin(user, params); }
  else if(route === '/admin-user'){ html = renderAdminUserDetail(user, params); }
  else if(route === '/admin-structure'){ html = renderBrowse(user, params, true); }
  else if(route === '/quiz'){ html = renderQuiz(user, params); }
  else if(route === '/result'){ html = renderResult(user, params); }
  else if(route === '/review'){ html = renderReview(user, params); }
  else if(route === '/favorites'){ html = renderFavorites(user, params); }
  else if(route === '/history'){ html = renderHistory(user, params); }
  else if(route === '/flashcards'){ html = renderFlashcards(user, params); }
  else if(route === '/institution'){ html = renderInstitution(user, params); }
  else if(route === '/activate'){ html = renderActivate(user, params); bare = !user; }
  else if(route === '/settings'){ html = renderSettings(user); }
  else { html = renderHome(user); }

  const app = document.getElementById('app');
  app.innerHTML = bare ? html : layout(html, route, user);
  if(route==='/home') showAdIfEligible();
  if(route==='/quiz') startQuizTimer();
}

function openUsernameLogin(){
  const modal = '<div class="modaloverlay" onclick="if(event.target===this) closeModal()">'
    + '<div class="modalsheet">'

function loginWithUsername(){
  const uname = document.getElementById('uLogUsername').value.trim();
  const code = document.getElementById('uLogCode').value.trim();
  if(!uname || !code){ toast('أدخل اليوزر ورمز الدخول'); return; }
  closeModal();
  const ensureAuth = fbAuth.currentUser ? Promise.resolve() : fbAuth.signInAnonymously();
  ensureAuth.then(function(){
    return dbFS.collection('platform').doc('main').get();
  }).then(function(doc){
    if(doc.exists){ db = doc.data(); migrateDB(db); localStorage.setItem(DB_KEY, JSON.stringify(db)); }
    startFirestoreSync();
    let found = null, inst = null;
    for(const i of db.institutions){
      const entry = (i.studentUsernames||[]).find(su=>su.username.toLowerCase()===uname.toLowerCase() && su.code===code);
      if(entry){ found = entry; inst = i; break; }
    }
    if(!found){ toast('اليوزر أو رمز الدخول غير صحيح'); return; }
    const key = 'u:'+found.username.toLowerCase();
    dbFS.collection('users').doc(key).get().then(function(udoc){
      const remoteProfile = udoc.exists ? udoc.data() : null;
      if(remoteProfile && remoteProfile.banned){ toast('هذا الحساب محظور من استخدام المنصة'); return; }
      if(!session.profiles[key]){
        session.profiles[key] = remoteProfile || newProfile(key, found.username, { universityId: inst.universityId, username: found.username, institutionId: inst.id });
        if(!remoteProfile){ found.claimedBy = key; saveDB(); }
      } else if(remoteProfile){
        session.profiles[key].banned = !!remoteProfile.banned;
      }
      session.currentEmail = key; saveSession();
      const u = session.profiles[key];
      go(u.profileComplete ? '/home' : '/profile');
    }).catch(function(){ toast('تعذّر الاتصال — حاول مجددًا'); });
  }).catch(function(err){
    console.error(err);
    toast('تعذّر تسجيل الدخول — تحقق من الاتصال بالإنترنت');
  });
}

  return Object.assign({
    email, name, fullName: email===OWNER_EMAIL ? OWNER_NAME : '',
    username:'', governorate:'', universityId:'', collegeId:'', departmentId:'', stageId:'',
    profileComplete:false, favorites:[], resultHistory:[], adViews:{}, institutionId:null, lastSeenAt: Date.now(),
    subscription:null, scheduledSubscription:null
  }, extra||{});
}
let chooseAccountInFlight = false;
function chooseAccount(email, name){
  if(chooseAccountInFlight) return;
  chooseAccountInFlight = true;
  closeModal();
  const finish = function(remoteProfile){
    chooseAccountInFlight = false;
    if(remoteProfile && remoteProfile.banned){
      fbAuth.signOut();
      session.currentEmail = null;
      toast('هذا الحساب محظور من استخدام المنصة');
      go('/login');
      return;
    }
    if(!session.profiles[email]){
      session.profiles[email] = remoteProfile || newProfile(email, name);
    } else if(remoteProfile){
      session.profiles[email].banned = !!remoteProfile.banned;
    }
    session.currentEmail = email;
    saveSession();
    const u = session.profiles[email];
    go(u.profileComplete ? '/home' : '/profile');
  };
  if(fbAuth.currentUser){
    dbFS.collection('users').doc(email).get().then(function(doc){
      finish(doc.exists ? doc.data() : null);
    }).catch(function(){ finish(null); });
  } else {
    finish(null);
  }
}

function pathObjs(p){
  const university = p.uid ? db.universities.find(u=>u.id===p.uid) : null;
  const college = (university && p.cid) ? university.colleges.find(c=>c.id===p.cid) : null;
  const department = (college && p.did) ? college.departments.find(d=>d.id===p.did) : null;
  const stage = (department && p.sgid) ? department.stages.find(s=>s.id===p.sgid) : null;
  const subject = (stage && p.subid) ? stage.subjects.find(s=>s.id===p.subid) : null;
  return { university, college, department, stage, subject };
}
function qs(params){ return Object.keys(params).filter(k=>params[k]).map(k=>k+'='+encodeURIComponent(params[k])).join('&'); }
function baseRoute(manageMode){ return manageMode ? '/admin-structure' : '/browse'; }

function renderBrowse(user, params, manageMode){

    return '<div class="screen"><div class="content"><div class="empty">'+icon('shield',30)+'<b>هذه الصفحة للمالك فقط</b></div></div></div>';
  }

  const restrict = !manageMode && user.role!=='owner' && !(user.role==='writer' && wr && !wr.restrictToOwnDept);
  if(restrict){ params = Object.assign({}, params, {uid: user.universityId, cid: user.collegeId, did: user.departmentId}); }

  if(stage) return renderListScreen(user, params, 'subject', stage.subjects, stage.name, {uid:params.uid,cid:params.cid,did:params.did,sgid:params.sgid}, manageMode);
  if(department) return renderListScreen(user, params, 'stage', department.stages, department.name, restrict?{}:{uid:params.uid,cid:params.cid,did:params.did}, manageMode);
  if(college) return renderListScreen(user, params, 'department', college.departments, college.name, restrict?{}:{uid:params.uid,cid:params.cid}, manageMode);
  if(university) return renderListScreen(user, params, 'college', university.colleges, restrict?'الكليات':university.name, restrict?{}:{uid:params.uid}, manageMode);
  if(!restrict) return renderListScreen(user, params, 'university', db.universities, manageMode?'إدارة الهيكل الأكاديمي':'اختر الجامعة', {}, manageMode);
  return '<div class="screen">'+pagehead('المواد','/home')+'<div class="content"><div class="empty">'+icon('book',30)+'<b>لم يكتمل تسجيلك بعد</b><p>عدّل ملفك الشخصي من الإعدادات لاختيار جامعتك وكليتك وقسمك.</p></div></div></div>';

function levelCountLabel(level, it){

function stripLast(p){
  const keys = Object.keys(p);
  const out = {}; keys.slice(0,-1).forEach(k=>out[k]=p[k]);
  return out;
}

/* ---------- Bulk structure import (indentation-based text) ---------- */
function parseStructureText(text){
  const lines = text.replace(/\t/g,'    ').split('\n').filter(l=>l.trim().length>0);
  const roots = [];
  const stack = [];
  lines.forEach(line=>{
    const indent = line.match(/^\s*/)[0].length;
    const name = line.trim();
    while(stack.length && stack[stack.length-1].indent >= indent) stack.pop();
    const level = stack.length;
    let node;
    if(level===0){ node = {id:uid(), name, departments:[]}; roots.push(node); }
    else if(level===1){ node = {id:uid(), name, stages:[]}; stack[stack.length-1].node.departments.push(node); }
    else if(level===2){ node = {id:uid(), name, subjects:[]}; stack[stack.length-1].node.stages.push(node); }
    else if(level===3){ node = {id:uid(), name, sources:[], questions:[]}; stack[stack.length-1].node.subjects.push(node); }
    else { return; }
    stack.push({indent, level, node});
  });
  return roots;
}
function openBulkStructureImport(){
  if(!db.universities.length){ toast('أضف جامعة واحدة على الأقل أولاً'); return; }
  const uniOpts = db.universities.map(u=>'<option value="'+u.id+'">'+esc(u.name)+'</option>').join('');
  const modal = '<div class="modaloverlay" onclick="if(event.target===this) closeModal()">'

    + '<div class="field"><label>الهيكل (مسافات بادئة أكثر = مستوى أعمق: كلية ← قسم ← مرحلة ← مادة)</label>'
    + '<textarea id="bulkStructureText" rows="10" placeholder="كلية الطب\n  قسم الطب العام\n    المرحلة الأولى\n      التشريح\n      الفسلجة\n  قسم طب الأسنان\n    المرحلة الأولى\n      تشريح الفم"></textarea></div>'
    + '<p class="hint" style="margin-bottom:12px;">كل سطر أعمق من الذي فوقه (بمسافات أكثر) يُعتبر تابعًا له، بالترتيب: كلية، قسم، مرحلة، مادة.</p>'
    + '<button class="btn btn-primary" onclick="commitStructureImport()">معاينة واستيراد</button>'
    + '<button type="button" class="btn btn-ghost" style="margin-top:8px;" onclick="closeModal()">إلغاء</button>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);
}
function commitStructureImport(){
  const uniId = document.getElementById('bulkUniSelect').value;
  const text = document.getElementById('bulkStructureText').value;
  const colleges = parseStructureText(text);
  if(!colleges.length){ toast('لم يتم العثور على أي بيانات صالحة بالنص'); return; }
  let depCount=0, stageCount=0, subCount=0;
  colleges.forEach(c=>c.departments.forEach(d=>{ depCount++; d.stages.forEach(s=>{ stageCount++; subCount += s.subjects.length; }); }));
  if(!confirm('سيتم إضافة '+colleges.length+' كلية، '+depCount+' قسم، '+stageCount+' مرحلة، '+subCount+' مادة. متابعة؟')) return;
  const uni = db.universities.find(u=>u.id===uniId);
  pushUndo();
  uni.colleges = uni.colleges.concat(colleges);
  colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(s=>s.subjects.forEach(sub=>pullBankInto(sub.id)))));
  saveDB(); closeModal(); toast('تم الاستيراد بنجاح'); render();
}

function findCollegeByName(name, excludeUniId){
  const norm = name.trim();
  for(const u of db.universities){
    if(u.id===excludeUniId) continue;
    const found = u.colleges.find(c=>c.name.trim()===norm);
    if(found) return found;
  }
  return null;
}
function cloneCollegeStructure(college, newName){
  return {
    id: uid(), name: newName,
    departments: college.departments.map(d=>({
      id: uid(), name: d.name,
      stages: d.stages.map(s=>({
        id: uid(), name: s.name,
        subjects: s.subjects.map(sub=>({
          id: uid(), name: sub.name,
          sources: (sub.sources||[]).map(src=>({id:uid(), name:src.name})),
          questions: []
        }))
      }))
    }))
  };
}
function promptAddNode(level, parentParams){
  const name = prompt('اسم ال'+LEVEL_LABEL[level]+' الجديد:');
  if(!name || !name.trim()) return;
  const { university, college, department, stage } = pathObjs(parentParams);
  let type = '';
  if(level==='university'){ type = confirm('اضغط "موافق" لجامعة حكومية، أو "إلغاء" لجامعة أهلية') ? 'حكومية' : 'أهلية'; }

  let node, wasClone = false;
  if(level==='college'){
    const match = findCollegeByName(name.trim(), university.id);
    if(match && confirm('توجد كلية بنفس الاسم "'+name.trim()+'" بجامعة أخرى وفيها هيكل كامل (أقسام، مراحل، مواد). هل تريد إضافة نفس هذا الهيكل لهذه الجامعة أيضًا؟ موادها ستشترك تلقائيًا بنفس بنك الأسئلة (لأن أي مادة بنفس اسم الكلية/القسم/المرحلة/المادة تُعتبر بنكًا موحدًا).')){
      node = cloneCollegeStructure(match, name.trim());
      wasClone = true;
    } else {
      node = { id: uid(), name: name.trim(), departments:[] };
    }
  } else {
    node = level==='subject' ? { id: uid(), name: name.trim(), sources:[], questions:[] }
      : level==='stage' ? { id: uid(), name: name.trim(), subjects:[] }
      : level==='department' ? { id: uid(), name: name.trim(), stages:[] }
      : { id: uid(), name: name.trim(), type, colleges:[] };
  }

  if(level==='university') db.universities.push(node);
  else if(level==='college') university.colleges.push(node);
  else if(level==='department') college.departments.push(node);
  else if(level==='stage') department.stages.push(node);
  else if(level==='subject') stage.subjects.push(node);

  if(level==='subject') pullBankInto(node.id);
  if(level==='college' && wasClone){
    node.departments.forEach(d=>d.stages.forEach(s=>s.subjects.forEach(sub=>pullBankInto(sub.id))));
  }

  pushUndo();
  saveDB();
  toast(wasClone ? 'تمت الإضافة مع مشاركة بنك الأسئلة' : 'تمت الإضافة');
  render();
}
function deleteNode(level, id, parentParams){
  if(!confirm('حذف هذا العنصر نهائيًا؟ سيتم حذف كل ما بداخله.')) return;
  pushUndo();
  const { university, college, department, stage } = pathObjs(parentParams);
  if(level==='university') db.universities = db.universities.filter(x=>x.id!==id);
  else if(level==='college') university.colleges = university.colleges.filter(x=>x.id!==id);
  else if(level==='department') college.departments = college.departments.filter(x=>x.id!==id);
  else if(level==='stage') department.stages = department.stages.filter(x=>x.id!==id);
  else if(level==='subject') stage.subjects = stage.subjects.filter(x=>x.id!==id);
  saveDB(); toast('تم الحذف'); render();
}

        + '</select></div>') : '')

    if(showSources){

      }).join('');
    }

    }
    }
  }

  if(canWrite || manageMode){
    html += '<div class="sectiontitle"><h2>إدارة الأسئلة</h2></div>';
    html += '<button class="btn btn-outline" onclick="openQuestionEditor(\''+subject.id+'\')">'+icon('plus',16)+' إضافة سؤال</button>';

      html += '<div style="margin-top:6px;">' + subject.questions.map(qq=>questionRow(qq, subject)).join('') + '</div>';
    }
  }

  html += '</div></div>';
  return html;
}

function findSubject(subjectId){
  for(const u of db.universities) for(const c of u.colleges) for(const d of c.departments) for(const sg of d.stages){
    const s = sg.subjects.find(x=>x.id===subjectId); if(s) return s;
  }
  return null;
}

/* ---------- Unified cross-university question bank ----------
   Subjects that share the exact same names (college → department →
   stage → subject) across different universities are treated as the
   same bank: adding/editing/deleting a question in one propagates to
   all the others. Matching is purely by name, so this also applies
   retroactively to subjects that happen to share the same structure
   without ever having been cloned. Reports and per-question ratings
   stay local to each instance on purpose — those reflect that
   university's own review process, not shared content. */
function bankKeyOf(collegeName, deptName, stageName, subjectName){
  return [collegeName, deptName, stageName, subjectName].map(s=>(s||'').trim()).join('␟');
}
function findSubjectPath(subjectId){
  for(const u of db.universities) for(const c of u.colleges) for(const d of c.departments) for(const sg of d.stages){
    const s = sg.subjects.find(x=>x.id===subjectId);
    if(s) return {university:u, college:c, department:d, stage:sg, subject:s};
  }
  return null;
}
function siblingSubjectPaths(subjectId){
  const origin = findSubjectPath(subjectId);
  if(!origin) return [];
  const key = bankKeyOf(origin.college.name, origin.department.name, origin.stage.name, origin.subject.name);
  const out = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(sg=>sg.subjects.forEach(s=>{
    if(s.id===subjectId) return;
    if(bankKeyOf(c.name,d.name,sg.name,s.name)===key) out.push({university:u, college:c, department:d, stage:sg, subject:s});
  })))));
  return out;
}
function subjectHasSiblings(subjectId){ return siblingSubjectPaths(subjectId).length>0; }
function resolveSourceForSibling(originSource, siblingSubject){
  if(!originSource) return null;
  let match = siblingSubject.sources.find(sr=>sr.name.trim()===originSource.name.trim());
  if(!match){ match = {id:uid(), name:originSource.name}; siblingSubject.sources.push(match); }
  return match.id;
}
/* For a freshly-created (usually empty) subject: pull in whatever an
   existing sibling already has, purely additive — never deletes
   anything from the donor. Used right after creating a new subject
   node so it joins an existing bank instead of starting empty. */
function pullBankInto(subjectId){
  const siblings = siblingSubjectPaths(subjectId);
  const donor = siblings.find(s => s.subject.questions.length>0);
  if(!donor) return;
  const target = findSubjectPath(subjectId);
  if(!target) return;
  donor.subject.questions.forEach(dq=>{
    if(!dq.syncGroupId) dq.syncGroupId = uid();
    const donorSource = dq.sourceId ? donor.subject.sources.find(sr=>sr.id===dq.sourceId) : null;
    const sourceId = resolveSourceForSibling(donorSource, target.subject);
    target.subject.questions.push({
      id: uid(), syncGroupId: dq.syncGroupId, text: dq.text, options: dq.options.slice(),
      correctIndex: dq.correctIndex, notes: dq.notes, topic: dq.topic, sourceId,
      isPreviousYear: dq.isPreviousYear, year: dq.year, round: dq.round,
      showAuthor: dq.showAuthor, authorName: dq.authorName,
      image: dq.image, optionImages: (dq.optionImages||[]).slice(), ratings:{up:0,down:0}, createdAt: dq.createdAt
    });
  });
}
/* For an EXISTING subject that was just edited (add/edit/delete a
   question): pushes its current state out to siblings and deletes
   any sibling copy whose linked question no longer exists here.
   Only call this on the subject that was actually just mutated. */
function syncBank(subjectId){
  const origin = findSubjectPath(subjectId);
  if(!origin) return;
  const siblings = siblingSubjectPaths(subjectId);
  if(!siblings.length) return;
  origin.subject.questions.forEach(q=>{ if(!q.syncGroupId) q.syncGroupId = uid(); });

  siblings.forEach(sib=>{
    origin.subject.questions.forEach(oq=>{
      const match = sib.subject.questions.find(sq=>sq.syncGroupId===oq.syncGroupId);
      const originSource = oq.sourceId ? origin.subject.sources.find(sr=>sr.id===oq.sourceId) : null;
      const sourceId = resolveSourceForSibling(originSource, sib.subject);
      if(!match){
        sib.subject.questions.push({
          id: uid(), syncGroupId: oq.syncGroupId, text: oq.text, options: oq.options.slice(),
          correctIndex: oq.correctIndex, notes: oq.notes, topic: oq.topic, sourceId,
          isPreviousYear: oq.isPreviousYear, year: oq.year, round: oq.round,
          showAuthor: oq.showAuthor, authorName: oq.authorName,
          image: oq.image, optionImages: (oq.optionImages||[]).slice(), ratings:{up:0,down:0}, createdAt: oq.createdAt
        });
      } else {
        Object.assign(match, {
          text: oq.text, options: oq.options.slice(), correctIndex: oq.correctIndex,
          notes: oq.notes, topic: oq.topic, sourceId,
          isPreviousYear: oq.isPreviousYear, year: oq.year, round: oq.round,
          showAuthor: oq.showAuthor, authorName: oq.authorName,
          image: oq.image, optionImages: (oq.optionImages||[]).slice()
        });
      }
    });
    const originGroupIds = new Set(origin.subject.questions.map(q=>q.syncGroupId));
    sib.subject.questions = sib.subject.questions.filter(sq => !sq.syncGroupId || originGroupIds.has(sq.syncGroupId));
  });
}

function deleteQuestion(subjectId, questionId){
  const siblingCount = siblingSubjectPaths(subjectId).length;
  const warn = siblingCount>0 ? ' هذه المادة مشتركة مع '+siblingCount+' كلية/جامعة أخرى بنفس الهيكل — سيُحذف من هناك أيضًا.' : '';
  if(!confirm('حذف هذا السؤال؟'+warn)) return;
  pushUndo();
  const subject = findSubject(subjectId);
  subject.questions = subject.questions.filter(q=>q.id!==questionId);
  removeReportFlag({id:questionId});
  syncBank(subjectId);
  saveDB(); toast('تم حذف السؤال'); render();
}

function imgPreviewHtml(target){

}
function compressImage(file, callback){
  if(file.size > 20000000){ toast('الملف كبير جدًا حتى للمعالجة — اختر صورة أصغر'); callback(null); return; }
  const reader = new FileReader();
  reader.onload = function(){
    const img = new Image();
    img.onload = function(){
      const maxDim = 900;
      let w = img.width, h = img.height;
      if(w>maxDim || h>maxDim){
        if(w>=h){ h = Math.round(h*maxDim/w); w = maxDim; } else { w = Math.round(w*maxDim/h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function(){ toast('تعذّرت معالجة الصورة'); callback(null); };
    img.src = reader.result;
  };
  reader.onerror = function(){ toast('تعذّر قراءة الصورة'); callback(null); };
  reader.readAsDataURL(file);
}
function handleImageUpload(e, target){
  const file = e.target.files[0];
  if(!file) return;
  compressImage(file, function(dataUrl){
    if(!dataUrl) return;
    if(target==='question') qImgState.question = dataUrl; else qImgState.options[target] = dataUrl;
    const el = document.getElementById('imgPreview_'+target);
    if(el) el.innerHTML = imgPreviewHtml(target);
  });
}

  if(target==='question') qImgState.question=''; else delete qImgState.options[target];

function saveQuestion(e, subjectId, questionId){
  e.preventDefault();

    round: f.isPreviousYear.checked ? f.round.value : '',
    showAuthor: f.showAuthor.checked,

  };

/* ==========================================================
   QUIZ ENGINE
   ========================================================== */
let quizState = null;
let selectedTimeMode = '180'; /* minutes per 100 MCQ; 'none' = untimed */
const TIME_MODE_OPTIONS = [
  ['180','الوقت الافتراضي (3 ساعات لكل 100 سؤال)'],
  ['90','1.5 ساعة لكل 100 سؤال'],
  ['120','2 ساعة لكل 100 سؤال'],
  ['150','2.5 ساعة لكل 100 سؤال'],
  ['none','بدون وقت محدد']
];
function formatDuration(totalSec){
  totalSec = Math.max(0, Math.round(totalSec));
  const h = Math.floor(totalSec/3600), m = Math.floor((totalSec%3600)/60), s = totalSec%60;
  const pad = n=>String(n).padStart(2,'0');
  return h>0 ? (h+':'+pad(m)+':'+pad(s)) : (m+':'+pad(s));
}
let quizTimerHandle = null;
function startTest(subjectId, mode, extra){
  if(!hasFeature('tests')){ toast('الاختبارات متوقفة مؤقتًا من قبل الإدارة'); return; }
  const subject = findSubject(subjectId);
  let pool = subject.questions.filter(q=>!isReported(q) && q.correctIndex>=0);
  if(mode==='all'){ /* keep all */ }
  else if(mode==='allSources'){ pool = pool.filter(q=>!q.isPreviousYear && q.sourceId); }
  else if(mode==='source'){ pool = pool.filter(q=>q.sourceId===extra.sourceId); }
  else if(mode==='year'){ pool = pool.filter(q=>q.isPreviousYear && q.year===extra.year); }
  else if(mode==='round'){ pool = pool.filter(q=>q.isPreviousYear && q.year===extra.year && q.round===decodeURIComponent(extra.round)); }
  else if(mode==='single'){ pool = pool.filter(q=>q.id===extra.questionId); }

  // de-duplicate by normalized text+options
  const seen = new Set(); const deduped = [];
  pool.forEach(q=>{
    const key = (q.text.trim()+'|'+q.options.join('|')).replace(/\s+/g,' ').toLowerCase();
    if(!seen.has(key)){ seen.add(key); deduped.push(q); }
  });

  if(deduped.length===0){ toast('لا توجد أسئلة متاحة لهذا الاختيار'); return; }

  db.stats.subjectUsage[subjectId] = (db.stats.subjectUsage[subjectId]||0)+1;
  if(mode==='source' && extra && extra.sourceId){
    if(!db.stats.sourceUsage) db.stats.sourceUsage = {};
    db.stats.sourceUsage[extra.sourceId] = (db.stats.sourceUsage[extra.sourceId]||0)+1;
  }
  saveDB();

  let timed = false, totalSeconds = 0;
  if(hasFeature('timedTest') && selectedTimeMode !== 'none'){
    const ratePer100 = parseInt(selectedTimeMode, 10) || 180;
    totalSeconds = Math.round(ratePer100 * deduped.length / 100 * 60);
    timed = true;
  }
  quizState = { subjectId, subjectName: subject.name, questions: shuffle(deduped), index:0, answers:{}, timed, secondsLeft: totalSeconds, totalSeconds };
  go('/quiz');
}
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- Flashcards ----------
   Rule (owner-specified): if the correct choice's text is essentially
   "all of the above are correct", the card's answer side lists every
   other option (since they are all individually true). If the correct
   choice's text is essentially "none of the above", that question is
   skipped from flashcards entirely — there is no positive content to
   show as an answer. */
const ALL_ABOVE_PATTERNS = [/جميع\s*(ما|الإجابات|الاجابات|الخيارات)?\s*(ذكر|سبق)?\s*صحيح/, /كل\s*(ما|الإجابات|الاجابات)?\s*(ذكر|سبق)/, /جميع\s*ما\s*(ذكر|سبق)/, /all\s*of\s*the\s*above/i];
const NONE_ABOVE_PATTERNS = [/لا\s*(شيء|أحد|احد)\s*مم(ا|ّا)?\s*(ذكر|سبق)/, /لا\s*(شيء|أحد|احد)\s*(صحيح|من\s*(الإجابات|الاجابات|الخيارات))/, /none\s*of\s*the\s*above/i];
function isAllAboveText(t){ t=(t||'').trim(); return ALL_ABOVE_PATTERNS.some(p=>p.test(t)); }
function isNoneAboveText(t){ t=(t||'').trim(); return NONE_ABOVE_PATTERNS.some(p=>p.test(t)); }

function buildFlashcards(subject){
  const cards = [];
  subject.questions.forEach(qq=>{
    if(isReported(qq) || qq.correctIndex<0) return;
    const correctText = qq.options[qq.correctIndex] || '';
    if(isNoneAboveText(correctText)) return; /* excluded per owner's rule */
    let answerText;
    if(isAllAboveText(correctText)){
      const others = qq.options.filter((opt,i)=>i!==qq.correctIndex && !isNoneAboveText(opt));
      answerText = others.join(' • ');
    } else {
      answerText = correctText;
    }
    cards.push({ id: qq.id, question: qq.text, answer: answerText, notes: qq.notes||'' });
  });
  return cards;
}
let flashState = null;
function openFlashcards(subjectId){
  if(!hasFeature('flashcards')){ toast('ميزة البطاقات متوقفة حاليًا'); return; }
  const subject = findSubject(subjectId);
  const cards = shuffle(buildFlashcards(subject));
  if(!cards.length){ toast('لا توجد أسئلة صالحة لبطاقات المراجعة بهذه المادة'); return; }
  flashState = { subjectId, subjectName: subject.name, cards, index:0, flipped:false };
  go('/flashcards');
}
function renderFlashcards(user, params){
  if(!flashState){ go('/browse'); return ''; }
  if(!hasFeature('flashcards')){ flashState=null; go('/home'); return ''; }
  const fs = flashState;
  const card = fs.cards[fs.index];
  return '<div class="screen" style="padding-top:20px;">'
    + '<div class="content" style="padding-top:0;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;">'
    + '<button type="button" class="backbtn" onclick="flashState=null;navTo(\'#/browse\')">'+icon('x',16)+'</button>'
    + '<span class="hint">بطاقة '+(fs.index+1)+' من '+fs.cards.length+' • '+esc(fs.subjectName)+'</span>'
    + '<span style="width:34px;"></span>'
    + '</div>'
    + '<div class="examcard" style="min-height:220px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;" onclick="flipCard()">'
    + '<div class="head" style="text-align:center;">'
    + '<div class="badge badge-muted" style="margin-bottom:10px;">'+(fs.flipped?'الإجابة':'السؤال')+' — اضغط للقلب</div>'
    + '<p class="qtext" dir="auto" style="text-align:center;">'+esc(fs.flipped ? card.answer : card.question)+'</p>'
    + (fs.flipped && card.notes ? '<p class="hint" style="margin-top:10px;">'+esc(card.notes)+'</p>' : '')
    + '</div></div>'
    + '<div class="btnrow"><button class="btn btn-outline" '+(fs.index===0?'disabled':'')+' onclick="prevCard()">'+icon('chevR',16)+' السابقة</button>'
    + '<button class="btn btn-primary" onclick="nextCard()">'+(fs.index===fs.cards.length-1?'إنهاء':'التالية')+' '+icon('chevL',16)+'</button></div>'
    + '</div></div>';
}
function flipCard(){ flashState.flipped = !flashState.flipped; render(); }
function nextCard(){
  if(flashState.index < flashState.cards.length-1){ flashState.index++; flashState.flipped=false; render(); }
  else { toast('انتهت بطاقات هذه المادة'); flashState=null; navTo('#/browse'); }
}
function prevCard(){ if(flashState.index>0){ flashState.index--; flashState.flipped=false; render(); } }

function renderQuiz(user, params){
  if(!quizState){ go('/browse'); return ''; }
  if(quizState.result){ go('/result'); return ''; }
  const qz = quizState;
  const cur = qz.questions[qz.index];
  const total = qz.questions.length;
  const answered = qz.answers[cur.id] !== undefined;
  const pct = Math.round(((qz.index)/total)*100);

  const optsHtml = cur.options.map((opt,i)=>{
    const sel = qz.answers[cur.id]===i;
    const imgHtml = (cur.optionImages && cur.optionImages[i] && hasFeature('imageUpload')) ? '<img src="'+cur.optionImages[i]+'" style="max-width:100%;border-radius:8px;margin-top:6px;"/>' : '';
    return '<button class="opt'+(sel?' selected':'')+'" onclick="selectAnswer('+i+')" style="flex-direction:column;align-items:stretch;"><div style="display:flex;align-items:center;gap:10px;"><span class="dot"></span><span dir="auto">'+esc(opt)+'</span></div>'+imgHtml+'</button>';
  }).join('');

  const favBtn = hasFeature('favorites') ? '<button class="reportlink" onclick="toggleFavorite(\''+cur.id+'\')">'+icon('star',13)+(isFavorite(cur.id)?' إزالة من المفضلة':' إضافة للمفضلة')+'</button>' : '';
  const reportBtn = hasFeature('reports') ? '<button class="reportlink" onclick="toggleReportBox()">'+icon('flag',13)+' إبلاغ عن هذا السؤال</button>' : '';
  const rateHtml = hasFeature('questionRating') ? '<div id="rate_'+cur.id+'" style="display:flex;gap:8px;margin-top:6px;"><button class="btn btn-ghost btn-sm" onclick="rateQuestion(\''+cur.id+'\',\'up\')">👍</button><button class="btn btn-ghost btn-sm" onclick="rateQuestion(\''+cur.id+'\',\'down\')">👎</button></div>' : '';
  const timerHtml = qz.timed ? '<span class="badge badge-danger" id="quizTimerBadge">⏱ '+formatDuration(qz.secondsLeft)+'</span>' : '';
  const qImgHtml = (cur.image && hasFeature('imageUpload')) ? '<img src="'+cur.image+'" style="max-width:100%;border-radius:12px;margin-top:10px;"/>' : '';

  return '<div class="screen" style="padding-top:20px;">'
    + '<div class="content" style="padding-top:0;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;">'
    + '<button type="button" class="backbtn" onclick="exitQuiz()">'+icon('x',16)+'</button>'
    + '<span class="hint">سؤال '+(qz.index+1)+' من '+total+'</span>'
    + (timerHtml || '<span style="width:34px;"></span>')
    + '</div>'
    + '<div class="progresswrap"><div class="progressbar" style="width:'+pct+'%;"></div></div>'
    + '<div class="examcard"><div class="head"><p class="qtext" dir="auto">'+esc(cur.text)+'</p>'+qImgHtml+'</div><div class="perf"></div><div class="body">' + optsHtml + '</div></div>'
    + '<div style="display:flex;justify-content:space-between;align-items:center;">'+favBtn+reportBtn+'</div>'
    + rateHtml
    + '<div class="reportbox" id="reportBox" style="display:none;">'
    + '<div class="field"><label>نوع البلاغ</label><select id="reportType"><option value="خارج المنهج">خارج المنهج</option><option value="إجابة خاطئة">الإجابة خاطئة</option></select></div>'
    + '<div class="field"><label>التصحيح (اختياري)</label><textarea id="reportCorrection" placeholder="اكتب التصحيح المقترح..."></textarea></div>'
    + '<button class="btn btn-danger btn-sm" onclick="submitReport(\''+cur.id+'\')">إرسال البلاغ</button>'
    + '</div>'
    + '<div class="btnrow" style="margin-top:10px;"><button class="btn btn-outline" '+(qz.index===0?'disabled':'')+' onclick="prevQuestion()">'+icon('chevR',16)+' السابق</button>'
    + '<button class="btn btn-primary" '+(answered?'':'disabled')+' onclick="nextQuestion()">'+(qz.index===total-1?'إنهاء الاختبار':'التالي')+'</button></div>'
    + '</div></div>';
}
function prevQuestion(){
  const qz = quizState;
  if(qz.index>0){ qz.index--; render(); }
}
function startQuizTimer(){
  clearInterval(quizTimerHandle);
  if(!quizState || !quizState.timed) return;
  quizTimerHandle = setInterval(()=>{
    if(!quizState || !quizState.timed){ clearInterval(quizTimerHandle); return; }
    quizState.secondsLeft--;
    const badge = document.getElementById('quizTimerBadge');
    if(badge) badge.textContent = '⏱ '+formatDuration(quizState.secondsLeft);
    if(quizState.secondsLeft<=0){ clearInterval(quizTimerHandle); toast('انتهى الوقت المحدد — تم إنهاء الاختبار تلقائيًا'); finishQuiz(); }
  }, 1000);
}
function selectAnswer(i){
  const qz = quizState; const cur = qz.questions[qz.index];
  qz.answers[cur.id] = i;
  render();
}
function exitQuiz(){
  if(!confirm('الخروج من الاختبار؟ لن يتم حفظ التقدم.')) return;
  clearInterval(quizTimerHandle);
  quizState = null;
  navTo('#/browse');
}
function toggleReportBox(){ const b=document.getElementById('reportBox'); b.style.display = b.style.display==='none' ? 'block' : 'none'; }
function submitReport(questionId){
  const subject = findSubject(quizState.subjectId);
  const question = subject.questions.find(q=>q.id===questionId);
  setReport(question, { type: document.getElementById('reportType').value, correction: document.getElementById('reportCorrection').value.trim(), at: Date.now() });
  saveDB();
  toast('تم استلام البلاغ، شكرًا لك');
  document.getElementById('reportBox').style.display='none';
}
function nextQuestion(){
  const qz = quizState;
  if(qz.index < qz.questions.length-1){ qz.index++; render(); }
  else { clearInterval(quizTimerHandle); finishQuiz(); }
}
function finishQuiz(){
  const qz = quizState;
  clearInterval(quizTimerHandle);
  let correct = 0;
  qz.questions.forEach(q=>{ if(qz.answers[q.id]===q.correctIndex) correct++; });
  const total = qz.questions.length;
  const wrong = total-correct;
  const pct = Math.round((correct/total)*100);
  db.stats.quizzesCompleted += 1;
  saveDB();
  quizState.result = { correct, wrong, total, pct, score100: pct };
  if(hasFeature('savedResults')){
    const user = currentUser();
    user.resultHistory = user.resultHistory || [];
    user.resultHistory.push({ date: Date.now(), subjectName: qz.subjectName, correct, total, pct });
    if(user.resultHistory.length>50) user.resultHistory.shift();
    saveSession();
  }
  go('/result');
}
function renderResult(user, params){
  if(!quizState || !quizState.result){ go('/home'); return ''; }
  const r = quizState.result;
  const circumference = 2*Math.PI*54;
  const dash = circumference * (r.pct/100);
  return '<div class="screen" style="padding-top:26px;">'
    + pagehead('نتيجة الاختبار', null)
    + '<div class="content" style="padding-top:0;">'
    + '<div class="card"><div class="ringwrap">'
    + '<svg width="140" height="140" viewBox="0 0 120 120">'
    + '<circle cx="60" cy="60" r="54" fill="none" stroke="var(--surface-2)" stroke-width="10"/>'
    + '<circle cx="60" cy="60" r="54" fill="none" stroke="var(--accent)" stroke-width="10" stroke-linecap="round" stroke-dasharray="'+dash+' '+circumference+'" transform="rotate(-90 60 60)"/>'
    + '<text x="60" y="66" text-anchor="middle" font-size="26" fill="var(--text)" font-weight="800" font-family="Cairo">'+r.pct+'%</text>'
    + '</svg>'
    + '<div class="hint">'+quizState.subjectName+'</div>'
    + '</div>'
    + '<div class="statgrid" style="margin-top:16px;">'
    + '<div class="statbox"><b style="color:var(--success);">'+r.correct+'</b><span>إجابات صحيحة</span></div>'
    + '<div class="statbox"><b style="color:var(--danger);">'+r.wrong+'</b><span>إجابات خاطئة</span></div>'
    + '<div class="statbox"><b>'+r.total+'</b><span>عدد الأسئلة</span></div>'
    + '<div class="statbox"><b>'+r.score100+'/100</b><span>الدرجة</span></div>'
    + '</div></div>'
    + '<button class="btn btn-primary" onclick="retryQuiz()">إعادة المحاولة</button>'
    + (r.wrong>0 && hasFeature('wrongOnlyRetry') ? '<button class="btn btn-outline" onclick="retryWrongOnly()">إعادة اختبار الأخطاء فقط</button>' : '')
    + (hasFeature('reviewAnswers') ? '<button class="btn btn-outline" onclick="navTo(\'#/review\')">مراجعة الإجابات</button>' : '')
    + (hasFeature('shareResults') ? '<button class="btn btn-ghost" onclick="shareResult()">'+icon('users',15)+' مشاركة النتيجة</button>' : '')
    + '<a href="#/browse" class="btn btn-ghost" style="text-decoration:none;">العودة إلى المواد</a>'
    + '</div></div>';
}
function retryQuiz(){
  quizState.index=0; quizState.answers={}; quizState.result=null;
  quizState.questions = shuffle(quizState.questions);
  if(quizState.timed) quizState.secondsLeft = quizState.totalSeconds;
  go('/quiz');
}
function retryWrongOnly(){
  const qz = quizState;
  const wrongOnes = qz.questions.filter(q=>qz.answers[q.id]!==q.correctIndex);
  if(!wrongOnes.length){ toast('لا توجد أخطاء لإعادة اختبارها 🎉'); return; }
  quizState = { subjectId: qz.subjectId, subjectName: qz.subjectName, questions: shuffle(wrongOnes), index:0, answers:{} };
  go('/quiz');
}
function shareResult(){
  const r = quizState.result;
  const text = 'حصلت على '+r.pct+'% ('+r.correct+'/'+r.total+') في اختبار "'+quizState.subjectName+'" على MCQ Study 🎓';
  if(navigator.share){ navigator.share({text}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>toast('تم نسخ النتيجة للمشاركة')); }
  else { toast(text); }
}

   ========================================================== */
function toggleFavorite(qid){
  const u = currentUser(); u.favorites = u.favorites||[];
  const i = u.favorites.indexOf(qid);
  if(i>-1) u.favorites.splice(i,1); else u.favorites.push(qid);
  saveSession(); render();
}
function isFavorite(qid){ const u=currentUser(); return !!(u.favorites||[]).includes(qid); }
function allQuestionsFlat(){
  const out = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>c.departments.forEach(d=>d.stages.forEach(sg=>sg.subjects.forEach(s=>{
    s.questions.forEach(qq=>out.push({q:qq, subjectName:s.name, subjectId:s.id}));
  })))));
  return out;
}
function renderFavorites(user, params){
  const favs = allQuestionsFlat().filter(x=>(user.favorites||[]).includes(x.q.id) && !isReported(x.q));
  let html = '<div class="screen">' + pagehead('المفضلة', '/home') + '<div class="content" style="padding-top:0;">';
  if(!favs.length){
    html += '<div class="empty">'+icon('star',30)+'<b>لا توجد أسئلة مفضّلة بعد</b><p>أثناء أي اختبار، اضغط أيقونة النجمة لحفظ سؤال هنا.</p></div>';
  } else {
    html += '<button class="btn btn-primary" onclick="startFavoritesTest()">'+icon('book',16)+' اختبار من المفضلة ('+favs.length+')</button>';
    html += '<div style="margin-top:6px;">' + favs.map(x=>'<div class="listcard"><div class="rowlist"><b dir="auto" style="font-size:13px;">'+esc(truncate(x.q.text,46))+'</b><span class="hint">'+esc(x.subjectName)+'</span></div><button class="iconbtn" style="width:32px;height:32px;" onclick="toggleFavorite(\''+x.q.id+'\');render()">'+icon('trash',14)+'</button></div>').join('') + '</div>';
  }
  html += '</div></div>';
  return html;
}
function startFavoritesTest(){
  const user = currentUser();
  const favs = allQuestionsFlat().filter(x=>(user.favorites||[]).includes(x.q.id) && !isReported(x.q)).map(x=>x.q);
  if(!favs.length){ toast('لا توجد أسئلة مفضّلة'); return; }
  quizState = { subjectId:'favorites', subjectName:'المفضلة', questions: shuffle(favs), index:0, answers:{} };
  go('/quiz');
}
function resultChartSvg(histChrono){
  const n = histChrono.length;
  const W = 300, H = 130, padX = 14, padY = 14;
  const chartW = W - padX*2, chartH = H - padY*2;
  const pts = histChrono.map((h,i)=>{
    const x = n>1 ? padX + (n-1-i)/(n-1)*chartW : padX + chartW/2;
    const y = padY + (1 - h.pct/100)*chartH;
    return {x, y, pct:h.pct};
  });
  const pathD = pts.map((p,i)=>(i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const dots = pts.map(p=>{
    const color = p.pct>=70?'var(--success)':(p.pct>=50?'var(--accent)':'var(--danger)');
    return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="4" fill="'+color+'"/>';
  }).join('');
  const grid = [0,25,50,75,100].map(v=>{
    const y = padY + (1-v/100)*chartH;
    return '<line x1="'+padX+'" y1="'+y.toFixed(1)+'" x2="'+(W-padX)+'" y2="'+y.toFixed(1)+'" stroke="var(--border)" stroke-width="1"/>';
  }).join('');
  const line = n>1 ? '<path d="'+pathD+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' : '';
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:130px;display:block;">'+grid+line+dots+'</svg>';
}
function renderHistory(user, params){
  const hist = (user.resultHistory||[]).slice().reverse();
  let html = '<div class="screen">' + pagehead('سجل نتائجي', '/home') + '<div class="content" style="padding-top:0;">';
  if(!hist.length){
    html += '<div class="empty">'+icon('bar',30)+'<b>لا توجد محاولات بعد</b><p>نتائج اختباراتك ستظهر هنا تلقائيًا.</p></div>';
  } else {
    const avg = Math.round(hist.reduce((a,h)=>a+h.pct,0)/hist.length);
    html += '<div class="statgrid"><div class="statbox"><b>'+hist.length+'</b><span>اختبارات مكتملة</span></div><div class="statbox"><b>'+avg+'%</b><span>متوسط الأداء</span></div></div>';
    const chartData = (user.resultHistory||[]).slice(-20);
    html += '<div class="card"><b style="font-size:13px;">تطور الأداء</b><div class="hint" style="margin-bottom:6px;">آخر '+chartData.length+' محاولة عبر كل المواد</div>' + resultChartSvg(chartData) + '</div>';
    html += '<div style="margin-top:10px;">' + hist.map(h=>{
      const d = new Date(h.date);
      const dateStr = d.toLocaleDateString('ar-EG', {day:'numeric', month:'short'});
      const color = h.pct>=70 ? 'var(--success)' : (h.pct>=50 ? 'var(--accent)' : 'var(--danger)');
      return '<div class="listcard"><div class="rowlist"><b style="font-size:13px;">'+esc(h.subjectName)+'</b><span class="hint">'+dateStr+' • '+h.correct+'/'+h.total+'</span></div><b style="color:'+color+';font-family:var(--font-display);">'+h.pct+'%</b></div>';
    }).join('') + '</div>';
  }
  html += '</div></div>';
  return html;
}
function renderReview(user, params){
  if(!quizState || !quizState.result){ go('/home'); return ''; }
  if(!hasFeature('reviewAnswers')){ go('/result'); return ''; }
  const qz = quizState;
  let html = '<div class="screen">' + pagehead('مراجعة الإجابات', '/result') + '<div class="content" style="padding-top:0;">';
  html += qz.questions.map((qq,idx)=>{
    const userAns = qz.answers[qq.id];
    const isCorrect = userAns===qq.correctIndex;
    const optsHtml = qq.options.map((opt,i)=>{
      let cls='opt'; let mark='';
      if(i===qq.correctIndex){ cls+=' selected'; mark=' ✓'; }
      else if(i===userAns){ mark=' ✗'; }
      return '<div class="'+cls+'" style="'+(i===qq.correctIndex?'border-color:var(--success);background:var(--success-soft);':(i===userAns?'border-color:var(--danger);background:var(--danger-soft);':''))+'"><span class="dot"></span><span dir="auto">'+esc(opt)+mark+'</span></div>';
    }).join('');
    return '<div class="examcard" style="margin-bottom:12px;"><div class="head"><span class="badge '+(isCorrect?'badge-success':'badge-danger')+'">سؤال '+(idx+1)+' — '+(isCorrect?'صحيح':'خاطئ')+'</span><p class="qtext" dir="auto" style="margin-top:8px;">'+esc(qq.text)+'</p></div><div class="perf"></div><div class="body">'+optsHtml+(qq.notes?('<div class="hint" style="margin-top:8px;">ملاحظة: '+esc(qq.notes)+'</div>'):'')+'</div></div>';
  }).join('');
  html += '</div></div>';
  return html;
}
function rateQuestion(qid, dir){
  const q = allQuestionsFlat().find(x=>x.q.id===qid);
  if(!q) return;
  q.q.ratings = q.q.ratings || {up:0,down:0};
  q.q.ratings[dir] = (q.q.ratings[dir]||0)+1;
  saveDB();
  const btn = document.getElementById('rate_'+qid);
  if(btn) btn.innerHTML = '<span class="hint">شكرًا لتقييمك</span>';
}

  if(user.role !== 'owner'){ return '<div class="screen"><div class="content"><div class="empty">'+icon('shield',30)+'<b>هذه الصفحة للمالك فقط</b></div></div></div>'; }
  const tab = params.tab || 'structure';
  const tabs = [ ['structure','الهيكل الأكاديمي'], ['users','المستخدمون'], ['reports','البلاغات'], ['writers','الكُتّاب'], ['institutions','الجامعات المسجّلة'], ['subscriptions','الاشتراكات'], ['features','الميزات'], ['ads','الإعلانات'], ['import','استيراد الأسئلة'], ['stats','الإحصائيات'] ];
  const tabsHtml = tabs.map(t=>'<a href="#/admin?tab='+t[0]+'" class="tab'+(tab===t[0]?' active':'')+'">'+t[1]+'</a>').join('');

  let body = '';
  if(tab==='structure') body = adminStructureTab();

/* ---------- Users tab (fetches the real global user list from Firestore) ---------- */
let allUsersCache = null;
let usersFetchStatus = 'idle'; /* idle | loading | loaded | error */
function fetchAllUsers(force){
  if(usersFetchStatus==='loading') return;
  if(allUsersCache && !force) return;
  usersFetchStatus = 'loading';
  dbFS.collection('users').get().then(function(snap){
    allUsersCache = [];
    snap.forEach(function(doc){ allUsersCache.push(Object.assign({_id: doc.id}, doc.data())); });
    usersFetchStatus = 'loaded';
    render();
  }).catch(function(err){
    console.error('fetch users failed', err);
    usersFetchStatus = 'error';
    render();
  });
}
function usersListHtml(list){
  if(!list.length) return '<div class="empty">'+icon('users',24)+'<b>لا يوجد مستخدمون مطابقون</b></div>';
  return list.map(function(u){
    const isInst = (u._id||'').indexOf('u:')===0;
    let subLabel = '';
    if(u.subscription && u.subscription.expiresAt>Date.now()){
      const t = db.subscriptionTiers.find(x=>x.id===u.subscription.tierId);
      subLabel = ' • '+(t?t.name:'مشترك');
    }
    const lastSeen = u.lastSeenAt ? new Date(u.lastSeenAt).toLocaleDateString('ar-EG') : '—';
    return '<div class="navrow" onclick="navTo(\'#/admin-user?id='+encodeURIComponent(u._id)+'\')"><div class="main"><b>'+esc(u.fullName||u.name||u._id)+(u.banned?' <span class="badge badge-danger">محظور</span>':'')+'</b><span>'+(isInst?('يوزر: '+esc(u.username||'')):esc(u.email||''))+subLabel+' • آخر ظهور '+lastSeen+'</span></div>'+icon('chevL',18)+'</div>';
  }).join('');
}
function renderUsersListOnly(){
  const term = (document.getElementById('userSearchInput').value||'').trim().toLowerCase();
  let list = allUsersCache || [];
  if(term){
    list = list.filter(function(u){
      return (u.fullName||'').toLowerCase().includes(term) || (u.email||'').toLowerCase().includes(term) || (u.username||'').toLowerCase().includes(term);
    });
  }
  document.getElementById('usersListBox').innerHTML = usersListHtml(list);
}
function adminUsersTab(){
  if(usersFetchStatus==='idle'){ fetchAllUsers(); return '<div class="empty">'+icon('users',26)+'<b>جاري تحميل المستخدمين...</b></div>'; }
  if(usersFetchStatus==='loading') return '<div class="empty">'+icon('users',26)+'<b>جاري تحميل المستخدمين...</b></div>';
  if(usersFetchStatus==='error'){
    return '<div class="empty">'+icon('flag',26)+'<b>تعذّر تحميل المستخدمين</b><p>تأكد من تحديث قواعد Firestore للسماح للمالك بقراءة كل المستخدمين.</p></div><button type="button" class="btn btn-outline" style="margin-top:10px;" onclick="fetchAllUsers(true);render()">إعادة المحاولة</button>';
  }
  const list = allUsersCache || [];
  let html = '<div class="field"><label>بحث (اسم، بريد، أو يوزر)</label><input type="text" id="userSearchInput" oninput="renderUsersListOnly()" placeholder="اكتب للبحث..."/></div>';
  html += '<button type="button" class="btn btn-ghost btn-sm" onclick="fetchAllUsers(true);render()">'+icon('logout',14)+' تحديث القائمة ('+list.length+' مستخدم)</button>';
  html += '<div id="usersListBox" style="margin-top:10px;">' + usersListHtml(list) + '</div>';
  return html;
}

function toggleBanUser(id){
  const u = (allUsersCache||[]).find(x=>x._id===id);
  if(!u) return;
  const newVal = !u.banned;
  if(!confirm(newVal ? 'حظر هذا المستخدم؟ لن يقدر يسجّل دخول بعدها.' : 'فك الحظر عن هذا المستخدم؟')) return;
  dbFS.collection('users').doc(id).set({banned:newVal}, {merge:true}).then(function(){
    u.banned = newVal;
    toast(newVal?'تم الحظر':'تم فك الحظر');
    render();
  }).catch(function(err){ console.error(err); toast('تعذّر تنفيذ العملية'); });

function deleteUserAccount(id){
  if(!confirm('حذف بيانات هذا المستخدم نهائيًا؟ لو رجع يسجّل دخول، بيبدأ حساب جديد من الصفر.')) return;
  dbFS.collection('users').doc(id).delete().then(function(){
    allUsersCache = (allUsersCache||[]).filter(x=>x._id!==id);
    toast('تم الحذف');
    go('/admin', {tab:'users'});
  }).catch(function(err){ console.error(err); toast('تعذّر الحذف'); });
}

function revokePrivilege(email){

function saveAdCap(){

  saveDB(); toast('تم الحفظ');

function openAdEditor(){
  adImgState = '';
  const modal = '<div class="modaloverlay" onclick="if(event.target===this) closeModal()">'
    + '<div class="modalsheet"><h3>إعلان جديد</h3>'
    + '<form onsubmit="return saveNewAd(event)">'
    + '<div class="field"><label>صورة (اختياري)</label><input type="file" accept="image/*" onchange="handleAdImageUpload(event)"/><div id="adImgPreview"></div></div>'
    + '<div class="field"><label>رابط فيديو مباشر (اختياري)</label><input type="text" name="video" placeholder="https://.../video.mp4"/><div class="hint">رابط فقط (وليس رفع ملف) لتفادي امتلاء التخزين المحلي للمتصفح</div></div>'
    + '<div class="field"><label>نص الإعلان (اختياري)</label><textarea name="text"></textarea></div>'
    + '<button class="btn btn-primary" type="submit">حفظ وتفعيل</button>'
    + '<button type="button" class="btn btn-ghost" style="margin-top:8px;" onclick="closeModal()">إلغاء</button>'
    + '</form></div></div>';
  document.body.insertAdjacentHTML('beforeend', modal);
}
function handleAdImageUpload(e){
  const file = e.target.files[0]; if(!file) return;
  compressImage(file, function(dataUrl){
    if(!dataUrl) return;
    adImgState = dataUrl;
    const el=document.getElementById('adImgPreview');
    if(el) el.innerHTML = '<img src="'+adImgState+'" style="max-width:140px;border-radius:8px;margin-top:8px;"/>';
  });
}
function saveNewAd(e){
  e.preventDefault();
  const f = e.target;
  const video = f.video.value.trim();
  const text = f.text.value.trim();
  if(!adImgState && !video && !text){ toast('أضف صورة أو رابط فيديو أو نصًا على الأقل'); return false; }
  db.ads.forEach(a=>a.active=false);
  db.ads.push({ id: uid(), image: adImgState, video, text, active:true });
  saveDB(); closeModal(); toast('تم إنشاء الإعلان وتفعيله'); render();
  return false;
}
function activateAd(id){ db.ads.forEach(a=>a.active=(a.id===id)); saveDB(); toast('تم التفعيل'); render(); }
function deleteAd(id){ if(!confirm('حذف هذا الإعلان؟')) return; pushUndo(); db.ads = db.ads.filter(a=>a.id!==id); saveDB(); toast('تم الحذف'); render(); }

function showAdIfEligible(){
  if(!hasFeature('ads')) return;
  const ad = (db.ads||[]).find(a=>a.active);
  if(!ad) return;
  const u = currentUser(); if(!u || u.role==='owner') return;
  const tier = activeTierOf(u);
  if(tier && tier.adsExempt) return;
  u.adViews = u.adViews || {};
  const cap = (db.adSettings && db.adSettings.maxViewsPerUser) || 0;
  const seen = u.adViews[ad.id] || 0;
  if(cap>0 && seen>=cap) return;
  u.adViews[ad.id] = seen+1; saveSession();

  const mediaHtml = (ad.image?('<img src="'+ad.image+'" style="width:100%;border-radius:14px;max-height:280px;object-fit:cover;"/>'):'')
    + (ad.video?('<video src="'+esc(ad.video)+'" controls autoplay muted playsinline style="width:100%;border-radius:14px;max-height:280px;margin-top:'+(ad.image?'10px':'0')+';"></video>'):'')
    + (ad.text?('<p style="margin-top:12px;line-height:1.7;font-size:14px;">'+esc(ad.text)+'</p>'):'');
  const html = '<div class="modaloverlay" id="adOverlay" style="align-items:center;">'
    + '<div class="modalsheet" style="border-radius:22px;position:relative;">'
    + '<button id="adCloseBtn" disabled onclick="if(!this.disabled) closeAdOverlay()" style="position:absolute;top:10px;left:10px;width:30px;height:30px;border-radius:50%;background:var(--surface-3);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--text);opacity:.6;">5</button>'
    + '<div style="margin-top:4px;">' + mediaHtml + '</div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  let left = 5;
  const cd = setInterval(()=>{
    left--;
    const btn = document.getElementById('adCloseBtn');
    if(!btn){ clearInterval(cd); return; }
    if(left<=0){ clearInterval(cd); btn.disabled=false; btn.style.opacity='1'; btn.innerHTML = icon('x',15); }
    else { btn.textContent = left; }
  }, 1000);
}

function genCodeString(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = '';
  for(let i=0;i<8;i++) s += chars.charAt(Math.floor(Math.random()*chars.length));
  return s;
}
function generateCode(){
  const tierId = document.getElementById('codeTier').value;
  const durationDays = parseInt(document.getElementById('codeDuration').value)||30;
  const maxUses = parseInt(document.getElementById('codeMaxUses').value)||1;
  const expiryVal = document.getElementById('codeExpiry').value;
  const codeExpiresAt = expiryVal ? new Date(expiryVal+'T23:59:59').getTime() : null;
  const notes = document.getElementById('codeNotes').value.trim();
  let code;
  do { code = genCodeString(); } while(db.subscriptionCodes.some(c=>c.code===code));
  pushUndo();
  db.subscriptionCodes.push({ id:uid(), code, tierId, durationDays, maxUses, usedCount:0, usedBy:[], codeExpiresAt, notes, createdAt:Date.now(), revoked:false });
  saveDB();
  const url = location.origin + location.pathname + '#/activate?code=' + code;
  const box = document.getElementById('codeResult');
  box.innerHTML = '<div class="card" style="text-align:center;"><div id="qrHolder" style="display:flex;justify-content:center;margin-bottom:10px;"></div>'
    + '<div class="hint" style="margin-bottom:8px;word-break:break-all;">'+esc(url)+'</div>'
    + '<button type="button" class="btn btn-outline btn-sm" onclick="copyActivationLink(\''+url+'\')">نسخ الرابط</button></div>';
  new QRCode(document.getElementById('qrHolder'), { text:url, width:180, height:180, colorDark:'#1B2333', colorLight:'#ffffff' });
  toast('تم توليد الرمز: '+code);
}
function copyActivationLink(url){
  if(navigator.clipboard){ navigator.clipboard.writeText(url).then(()=>toast('تم نسخ الرابط')).catch(()=>toast('تعذّر النسخ')); }
}

function distinctNames(list){ return Array.from(new Set(list)).sort((a,b)=>a.localeCompare(b,'ar')); }
function distinctCollegeNames(){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>names.push(c.name)));
  return distinctNames(names);
}
function distinctDeptNames(collegeName){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>{ if(c.name===collegeName) c.departments.forEach(d=>names.push(d.name)); }));
  return distinctNames(names);
}
function distinctStageNames(collegeName, deptName){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>{ if(c.name!==collegeName) return; c.departments.forEach(d=>{ if(d.name!==deptName) return; d.stages.forEach(s=>names.push(s.name)); }); }));
  return distinctNames(names);
}
function distinctSubjectNames(collegeName, deptName, stageName){
  const names = [];
  db.universities.forEach(u=>u.colleges.forEach(c=>{ if(c.name!==collegeName) return; c.departments.forEach(d=>{ if(d.name!==deptName) return; d.stages.forEach(sg=>{ if(sg.name!==stageName) return; sg.subjects.forEach(sub=>names.push(sub.name)); }); }); }));
  return distinctNames(names);
}
function findAnySubjectByPath(collegeName, deptName, stageName, subjectName){
  for(const u of db.universities) for(const c of u.colleges){
    if(c.name!==collegeName) continue;
    for(const d of c.departments){
      if(d.name!==deptName) continue;
      for(const sg of d.stages){
        if(sg.name!==stageName) continue;
        const s = sg.subjects.find(x=>x.name===subjectName);
        if(s) return s;
      }
    }
  }
  return null;
}

function handleImportFile(e){
  const file = e.target.files[0]; if(!file) return;
  const name = file.name.toLowerCase();
  const textarea = document.getElementById('impText');
  const status = document.getElementById('impFileStatus');
  status.textContent = 'جاري استخراج النص من الملف...';
  if(name.endsWith('.txt')){
    const reader = new FileReader();
    reader.onload = function(){ textarea.value = reader.result; status.textContent = 'تم استخراج النص من '+file.name; };
    reader.onerror = function(){ status.textContent = 'تعذّر قراءة الملف'; };
    reader.readAsText(file, 'utf-8');
  } else if(name.endsWith('.docx')){
    const reader = new FileReader();
    reader.onload = function(){
      mammoth.extractRawText({arrayBuffer: reader.result}).then(function(result){
        textarea.value = result.value;
        status.textContent = 'تم استخراج النص من '+file.name;
      }).catch(function(err){
        console.error(err); status.textContent = 'تعذّر استخراج النص من ملف Word';
      });
    };
    reader.onerror = function(){ status.textContent = 'تعذّر قراءة الملف'; };
    reader.readAsArrayBuffer(file);
  } else if(name.endsWith('.pdf')){
    const reader = new FileReader();
    reader.onload = function(){
      const typedArray = new Uint8Array(reader.result);
      let sawHighlights = false;
      pdfjsLib.getDocument({data: typedArray}).promise.then(function(pdf){
        const pagePromises = [];
        for(let i=1; i<=pdf.numPages; i++){
          pagePromises.push(pdf.getPage(i).then(function(page){
            return Promise.all([page.getTextContent(), page.getAnnotations()]);
          }).then(function(res){
            const content = res[0], annots = res[1];
            const highlights = annots.filter(function(a){ return a.subtype==='Highlight' && a.quadPoints && a.quadPoints.length>=8; });
            const tagged = content.items.map(function(it){
              const x = it.transform[4], y = it.transform[5];
              const w = it.width||1, h = Math.abs(it.transform[3])||10;
              const cx = x + w/2, cy = y + h/2;
              let marked = false;
              highlights.forEach(function(hl){
                for(let qi=0; qi+7<hl.quadPoints.length; qi+=8){
                  const qx = [hl.quadPoints[qi],hl.quadPoints[qi+2],hl.quadPoints[qi+4],hl.quadPoints[qi+6]];
                  const qy = [hl.quadPoints[qi+1],hl.quadPoints[qi+3],hl.quadPoints[qi+5],hl.quadPoints[qi+7]];
                  const minX=Math.min.apply(null,qx), maxX=Math.max.apply(null,qx);
                  const minY=Math.min.apply(null,qy), maxY=Math.max.apply(null,qy);
                  if(cx>=minX-1 && cx<=maxX+1 && cy>=minY-2 && cy<=maxY+2) marked = true;
                }
              });
              if(marked) sawHighlights = true;
              return { str: it.str, y: y, marked: marked, hasEOL: !!it.hasEOL };
            });
            /* pdf.js gives a flat list of text runs with no line breaks —
               reconstruct lines by grouping runs whose baseline Y is close
               together, since the parser needs real newlines to find
               question/option boundaries. */
            const lines = [];
            let curY = null, curParts = [];
            tagged.forEach(function(t){
              if(curY===null) curY = t.y;
              if(Math.abs(t.y-curY) > 3){
                lines.push(curParts.join(' ').replace(/\s+/g,' ').trim());
                curParts = []; curY = t.y;
              }
              if(t.str) curParts.push(t.marked ? ('*'+t.str+'*') : t.str);
              if(t.hasEOL){ lines.push(curParts.join(' ').replace(/\s+/g,' ').trim()); curParts = []; curY = null; }
            });
            if(curParts.length) lines.push(curParts.join(' ').replace(/\s+/g,' ').trim());
            return lines.filter(Boolean).join('\n');
          }));
        }
        return Promise.all(pagePromises);
      }).then(function(pages){
        textarea.value = pages.join('\n\n');
        status.textContent = 'تم استخراج النص من '+file.name+' ('+pages.length+' صفحة)'
          + (sawHighlights ? ' — تم رصد تظليل ملوّن وتحديده تلقائيًا (راجعه)' : '')
          + ' — راجع النص فقد يحتاج ترتيب بسيط';
      }).catch(function(err){
        console.error(err); status.textContent = 'تعذّر استخراج النص من ملف PDF';
      });
    };
    reader.onerror = function(){ status.textContent = 'تعذّر قراءة الملف'; };
    reader.readAsArrayBuffer(file);
  } else if(name.endsWith('.doc')){
    status.textContent = 'صيغة .doc القديمة غير مدعومة — احفظ الملف بصيغة .docx من Word ثم أعد رفعه';
  } else {
    status.textContent = 'صيغة غير مدعومة — استخدم txt أو docx أو pdf';
  }
}
const AR_LETTER_INDEX = { 'أ':0,'ا':0,'إ':0,'ب':1,'ج':2,'د':3,'ه':4,'و':5 };
function letterToIndex(letter){
  if(!letter) return -1;
  const en = 'ABCDE'.indexOf(letter.toUpperCase());
  if(en>-1) return en;
  if(letter in AR_LETTER_INDEX) return AR_LETTER_INDEX[letter];
  return -1;
}
/* Finds "answer key" lines anywhere in the text: a line that is JUST a
   question number followed by a single option letter (e.g. "45- c",
   "12. D"), as opposed to an actual question/option line which always
   has real content after the marker. Handles both a single key block
   at the end of the file and several smaller key blocks repeated
   throughout (e.g. every ~10 questions). Also handles several pairs
   comma-separated on one line. */
function extractAnswerKey(text){
  const map = {};
  const re = /(?:^|[\s,،(|])(\d{1,4})\s*[-.:)]\s*([A-Ea-e])(?=[\s,،.|]|$)/g;
  let m;
  while((m = re.exec(text)) !== null){
    map[parseInt(m[1],10)] = m[2].toUpperCase();
  }
  return map;
}
function parseBulkQuestions(text){
  const answerKey = extractAnswerKey(text);
  const lines = text.split('\n');
  const blocks = [];
  let current = null;
  lines.forEach(function(line){
    const trimmed = line.trim();
    if(!trimmed) return;
    const isAnswerKeyLine = /^\d{1,4}\s*[-.:)]\s*[A-Ea-e]\s*$/.test(trimmed);
    const qStart = trimmed.match(/^(\d{1,4})\s*[-.:)]\s+(.{4,})$/);
    if(isAnswerKeyLine){
      if(current){ blocks.push(current); current = null; }
    } else if(qStart){
      if(current) blocks.push(current);
      current = { num: parseInt(qStart[1],10), lines: [qStart[2]] };
    } else if(current){
      current.lines.push(trimmed);
    }
  });
  if(current) blocks.push(current);
  if(!blocks.length) return parseBulkQuestionsLegacy(text, answerKey);

  const results = [];
  blocks.forEach(function(b){
    const parsed = parseQuestionLines(b.lines);
    if(!parsed) return;
    if(parsed.correctIndex===-1 && b.num!=null && answerKey[b.num]){
      const idx = letterToIndex(answerKey[b.num]);
      if(idx>-1 && idx<parsed.options.length) parsed.correctIndex = idx;
    }
    results.push({ text:parsed.text, options:parsed.options, correctIndex:parsed.correctIndex, uncertain: parsed.correctIndex<0 });
  });
  return results;
}
function detectDominantScript(text){
  const arabicCount = (text.match(/[\u0600-\u06FF]/g)||[]).length;
  const latinCount = (text.match(/[a-zA-Z]/g)||[]).length;
  if(arabicCount===0 && latinCount===0) return null;
  if(arabicCount > latinCount*2) return 'ar';
  if(latinCount > arabicCount*2) return 'en';
  return null;
}
function stripForeignScript(text, dominant){
  if(!dominant || !text) return text;
  let out = text;
  if(dominant==='en') out = out.replace(/[\u0600-\u06FF]+/g,'');
  else if(dominant==='ar') out = out.replace(/\b[a-zA-Z]{2,}\b/g,'');
  return out.replace(/\s{2,}/g,' ').replace(/\s+([.,;:؟?!])/g,'$1').trim();
}
function parseQuestionLines(blockLines){
  if(!blockLines.length) return null;
  const qLine = blockLines[0].trim();
  let optLines = blockLines.slice(1);
  let answerFromLine = null;
  if(optLines.length){
    const last = optLines[optLines.length-1];
    const ansMatch = last.match(/^(الجواب|الإجابة|Answer)\s*[:\-]\s*(.+)$/i);
    if(ansMatch){ answerFromLine = ansMatch[2].trim(); optLines = optLines.slice(0,-1); }
  }
  let correctIndex = -1;
  const options = optLines.map(function(line,i){
    const isMarked = /^\*/.test(line) || /\*$/.test(line) || /✓/.test(line);
    let clean = line.replace(/^[-•]?\s*(\d+[.)]|[أابجدهوABCDEabcde][.)])?\s*/,'').replace(/^\*+|\*+$/g,'').replace(/✓/g,'').trim();
    if(isMarked) correctIndex = i;
    return clean;
  }).filter(Boolean);
  if(correctIndex===-1 && answerFromLine){
    const idx = letterToIndex(answerFromLine.charAt(0));
    if(idx>-1 && idx<options.length) correctIndex = idx;
    else { const found = options.findIndex(function(o){ return o.trim()===answerFromLine.trim(); }); if(found>-1) correctIndex=found; }
  }
  const dominant = detectDominantScript([qLine].concat(options).join(' '));
  const cleanQLine = stripForeignScript(qLine, dominant);
  let adjustedCorrectIndex = correctIndex;
  const cleanOptions = [];
  options.forEach(function(o, idx){
    const cleaned = stripForeignScript(o, dominant);
    if(cleaned){
      cleanOptions.push(cleaned);
    } else if(idx===correctIndex){
      adjustedCorrectIndex = -1;
    } else if(idx<correctIndex){
      adjustedCorrectIndex--;
    }
  });
  if(cleanQLine && cleanOptions.length>=2) return { text:cleanQLine, options:cleanOptions, correctIndex:adjustedCorrectIndex };
  return null;
}
/* Fallback for text with no numbered questions at all: split on blank
   lines like before, but still consult a separately-declared answer
   key by position (1st block ↔ key #1, etc.) when nothing inline is
   found — and never guess: an undetected answer stays unanswered. */
function parseBulkQuestionsLegacy(text, answerKey){
  const blocks = text.split(/\n\s*\n+/).map(function(b){ return b.trim(); }).filter(Boolean);
  const results = [];
  blocks.forEach(function(block,bi){
    const lines = block.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
    if(lines.length<3) return;
    const cleanFirst = lines[0].replace(/^(س\d*[.):]|\d+[.)]|\d+-)\s*/,'').trim();
    const parsed = parseQuestionLines([cleanFirst].concat(lines.slice(1)));
    if(!parsed) return;
    if(parsed.correctIndex===-1 && answerKey && answerKey[bi+1]){
      const idx = letterToIndex(answerKey[bi+1]);
      if(idx>-1 && idx<parsed.options.length) parsed.correctIndex = idx;
    }
    results.push({ text:parsed.text, options:parsed.options, correctIndex:parsed.correctIndex, uncertain: parsed.correctIndex<0 });
  });
  return results;
}

  const year = isPY ? document.getElementById('impYear').value.trim() : '';
  const round = isPY ? document.getElementById('impRound').value : '';

    let src = subject.sources.find(s=>s.name===sourceName);

  }

    if(chk && chk.checked){
      subject.questions.push({
        id: uid(), text:qq.text, options:qq.options, correctIndex:qq.correctIndex,

        showAuthor:false, authorName:'', image:'', optionImages:[], ratings:{up:0,down:0}, createdAt:Date.now()
      });

    }
  });
  if(count>0) syncBank(subject.id);
  saveDB(); closeModal(); toast('تم استيراد '+count+' سؤال بنجاح'); render();
}

function redeemCode(code, mode){
  const user = currentUser();
  const codeRec = db.subscriptionCodes.find(c=>c.code===code);
  if(!codeRec || codeRec.revoked || codeRec.usedCount>=codeRec.maxUses || (codeRec.codeExpiresAt && codeRec.codeExpiresAt<Date.now())){ toast('تعذّر تفعيل الرمز'); go('/home'); return; }
  const tier = db.subscriptionTiers.find(t=>t.id===codeRec.tierId);
  if(!tier){ toast('الخطة غير موجودة'); go('/home'); return; }
  if(mode==='now'){
    user.subscription = { tierId: tier.id, activatedAt: Date.now(), expiresAt: Date.now() + codeRec.durationDays*86400000 };
    user.scheduledSubscription = null;
  } else {
    user.scheduledSubscription = { tierId: tier.id, durationDays: codeRec.durationDays };
  }
  codeRec.usedCount = (codeRec.usedCount||0)+1;
  codeRec.usedBy = codeRec.usedBy||[]; codeRec.usedBy.push({email:user.email, at:Date.now()});
  saveDB(); saveSession();
  toast(mode==='now' ? 'تم تفعيل الاشتراك بنجاح 🎉' : 'تمت جدولة الاشتراك — سيبدأ تلقائيًا بعد انتهاء اشتراكك الحالي');
  go('/settings');
}
